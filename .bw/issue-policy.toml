# 三列映射:活的类别 → 默认开工工具 → 默认 workflow(空 = 开工时现挑)。
# 工具的探活与接法在 Workbench 的适配模块里,不在这份文件配。

[[mapping]]
category = "prototype"            # 原型
tool     = "open_design"
workflow = ""                     # 意图默认 proto-design,源还没进来、未打包

[[mapping]]
category = "build"                # 构建
tool     = "claude_cli"
workflow = "mattpocock-skills"

[[mapping]]
category = "optimize"             # 优化
tool     = "claude_cli"
workflow = "mattpocock-skills"

[[mapping]]
category = "ops"                  # 运维
tool     = "claude_cli"
workflow = "mattpocock-skills"

[[mapping]]
category = "growth"               # 运营推广
tool     = "claude_cli"
workflow = ""                     # 无默认,从鱼塘挑

# 运作活②「资产盘点」到点自动建活;运作活①永远人触发,不在这里配。
[cadence]
ops2_schedule = "fri 20:00"

# 看板前两列的标题。
[kanban]
pool_label = "待办池 · 未排进任何一周"
todo_label = "待办 · 已排进本周,等开工"
