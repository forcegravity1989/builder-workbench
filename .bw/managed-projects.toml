# 被管理项目白名单 —— 指标采集的正本清单,由人维护。
#
# 纳入一个项目加一条;除名删条目(「纳入 workbench 管理的项目数」的历史周读数会
# 随之变化 —— 白名单即当前事实)。采集脚本 .bw/scripts/managed-projects.py
# (--metric adoption|monday-screen),注册在 .bw/metrics.toml,口径见脚本 docstring。

[[projects]]
name = "builder-workbench"                      # 显示名
provider = "github"                             # github | codehub
remote = "forcegravity1989/builder-workbench"   # github: owner/repo;codehub: -p 项目路径,远端读取时另需 host = 区别名(-H)
local = "."                                     # 本地读盘路径(相对仓根或绝对);有值优先读盘,缺省走远端浅克隆
since = "2026-08-05"                            # 纳入日 YYYY-MM-DD,人填;BW 取 git 里 .bw/ 首次提交日(9d1f30c)
