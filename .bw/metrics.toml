schema_version = 2

# 北极星可缺席(BW 自身尚未定义清楚北极星,不硬立;等外部项目周期数据再议);
# 滞后 / 引领各 ≤3。字段:name / def / target / collect / feature / leads / unit。
# feature 空 = 主要页签;有值 = 「XX特性」页签。
# leads 只写在引领上,值是它盯的那条滞后的 name。空 = 挂到同页签第一条滞后。
# collect 只支持 { kind = "script", run = ["python", ".bw/scripts/x.py"], retro = true };
# manual 与 retro=false 现行协议不支持(见 references/metrics.md),不写回目录。
# 脚本 stdout 吐 {"points":[{"week":"YYYY-Www","value":…}]}(day 粒度吐 day)。
# 窗口由 Workbench 传。失败不写 0。协议见 references/metrics.md。
# [[feature]] 声明记分牌场景:name 对应指标的 feature,value 写该场景交付什么;顺序即页签顺序。

[[feature]]
name = "需求对齐"
value = "版本开始时，把 Top3 承诺写成 Leader 不翻聊天记录也能评审的样子，确认后落成真实任务。"

[[feature]]
name = "任务执行"
value = "每件事一棵独立工作树、一个会话，可以并行推进。AI 跑完能跑的部分，人只审结果。"

[[feature]]
name = "需求验收"
value = "版本结束时，逐个目标下结论，未达的写清下一步。证据在干活时备齐，不另写周报。"

[[feature]]
name = "项目上下文"
value = "项目身份、口径、承诺、交付事实只写一次。模型拿它干活，Leader 拿它核对。"

[[lagging]]
name = "纳入 workbench 管理的项目数"
feature = ""
def = "白名单(.bw/managed-projects.toml)在册、且项目仓 .bw/ 真实落盘的项目去重计数;纳入周按条目 since 起累计归属,除名即删条目。只挂链接但仓里没落 .bw/ 的不算。"
target = "≥3"
collect = { kind = "script", run = ["python", ".bw/scripts/managed-projects.py", "--metric", "adoption"], retro = true }

[[lagging]]
name = "使用周一屏的被管理项目数"
feature = "周一屏"
def = "白名单内项目已合入数据来源的计划活动按周去重计数。schema3 以非空计划创建或目标/任务/进展/轮次实质变更的提交时间归周,纯格式迁移、空计划和未合入草稿不计;旧材料按 Git 历史中的 updated_at/confirmation 解释历史,仅 progress_updates 更新不计。衡量已归档计划活动,不等同页面点击;后续编辑不覆盖旧周事实。"
target = "≥6"
collect = { kind = "script", run = ["python", ".bw/scripts/managed-projects.py", "--metric", "monday-screen"], retro = true }

[[lagging]]
name = "计划制定时长"
feature = "周一屏"
def = "白名单项目在窗口内合入的 PR,从该 ISO 周周一 09:00(BW_METRICS_TIMEZONE)到合入时刻(provider 真源 mergedAt)的时长中位数(小时);测周交付节奏。合入事件由项目侧预采集落 .bw/metrics/daily-observation.jsonl(bw/daily-observation/v1,day=合入日 UTC,remote+pr 幂等);协议脚本固定读取 DATA_COMMIT 的白名单和事件账。只采用全部白名单项目共同可信的连续采集覆盖,被查询范围、当前时刻或真实采集覆盖截断的部分周声明 coverage;旧账无覆盖证明保持未知。没有合入事件的周不出点、不补 0;负时长如实保留,跨夏令时按绝对时间差计算。"
target = ""
unit = "小时"
collect = { kind = "script", run = ["python", ".bw/scripts/plan-cycle-hours.py"], retro = true }

[[leading]]
name = "每周闭环的 issue 数"
feature = ""
leads = "纳入 workbench 管理的项目数"
def = "远端上 closed 时刻落在这一周的 issue 数;本机合并提交 / MR 合入不算(口径不同)。反映『有人提活 + 项目自己闭环快』,对采纳滞后有预测性。"
target = "≥1"
collect = { kind = "script", run = ["python", ".bw/scripts/closed-issues.py"], retro = true }
