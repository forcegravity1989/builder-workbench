schema_version = 2

# 北极星可缺席(BW 自身尚未定义清楚北极星,不硬立)。
# 记分牌场景与指标对齐总览保真稿。[[feature]] 顺序即页签顺序;
# 聚焦不写在这里,由所选版本计划的目标值推出。
# 八个指标的历史来源尚未接入,脚本退出 2,读数保持未知,不写示意数字。
# 原先的纳入项目数、周一屏、计划制定时长、每周闭环 issue 数不再上记分牌;
# 采集脚本仍留在 .bw/scripts,不在本目录注册。

[[feature]]
name = "需求对齐"
value = "版本开始时，把 Top3 承诺写成 Leader 不翻聊天记录也能评审的样子，确认后落成真实任务。"

[[feature]]
name = "项目上下文"
value = "项目身份、口径、承诺、交付事实只写一次。模型拿它干活，Leader 拿它核对。"

[[feature]]
name = "任务执行"
value = "每件事一棵独立工作树、一个会话，可以并行推进。AI 跑完能跑的部分，人只审结果。"

[[feature]]
name = "需求验收"
value = "版本结束时，逐个目标下结论，未达的写清下一步。证据在干活时备齐，不另写周报。"

[[lagging]]
name = "准备期修改程度"
feature = "需求对齐"
def = "越低越好。AI 生成初始版本后、Leader 确认前，人改过描述、验收标准或范围的目标数（删掉、新增也算）÷ 初始版本目标数。从计划文件的提交历史现算。"
target = ""
unit = "%"
collect = { kind = "script", run = ["python3", ".bw/scripts/metric-unavailable.py", "准备期修改程度"], retro = true }

[[leading]]
name = "准备耗时"
feature = "需求对齐"
leads = "准备期修改程度"
def = "越短越好。从 Builder 开始准备，到 Leader 确认 Top3，Builder 实际投入的小时数。"
target = ""
unit = "h"
collect = { kind = "script", run = ["python3", ".bw/scripts/metric-unavailable.py", "准备耗时"], retro = true }

[[lagging]]
name = "会话免交代率"
feature = "项目上下文"
def = "越高越好。不用再补方向、口径、承诺就开工的会话比例，按人参与时长加权；条数比例 81% 并列。"
target = ""
unit = "%"
collect = { kind = "script", run = ["python3", ".bw/scripts/metric-unavailable.py", "会话免交代率"], retro = true }

[[leading]]
name = "文档完备性"
feature = "项目上下文"
leads = "会话免交代率"
def = "越高越好。skill 按固定评分表打分，结果文件随提交留存，重启后读回同一分。补文档当周就能让它动。"
target = ""
collect = { kind = "script", run = ["python3", ".bw/scripts/metric-unavailable.py", "文档完备性"], retro = true }

[[lagging]]
name = "任务交付周期"
feature = "任务执行"
def = "越短越好。从 Issue 开工到产出待评审 PR 的中位时长。"
target = ""
unit = "h"
collect = { kind = "script", run = ["python3", ".bw/scripts/metric-unavailable.py", "任务交付周期"], retro = true }

[[lagging]]
name = "首次评审通过率"
feature = "任务执行"
def = "越高越好。人第一次评审就同意合入的 PR ÷ PR 总数。"
target = ""
unit = "%"
collect = { kind = "script", run = ["python3", ".bw/scripts/metric-unavailable.py", "首次评审通过率"], retro = true }

[[lagging]]
name = "结论可核对率"
feature = "需求验收"
def = "越高越好。只给验收归档，模型判断与人的结论一致且未达项写了下一步的目标 ÷ 目标总数。"
target = ""
unit = "%"
collect = { kind = "script", run = ["python3", ".bw/scripts/metric-unavailable.py", "结论可核对率"], retro = true }

[[leading]]
name = "验收准备耗时"
feature = "需求验收"
leads = "结论可核对率"
def = "越短越好。从候选版本就绪到可以逐个目标下结论的小时数，含产品外整理材料的时间。"
target = ""
unit = "h"
collect = { kind = "script", run = ["python3", ".bw/scripts/metric-unavailable.py", "验收准备耗时"], retro = true }
