schema_version = 2

# ─────────────────────────────────────────────────────────────────────────
# 这个项目的指标定义。**这份文件是正本**,界面上的指标卡、健康灯全从它推导。
#
# 三层,从上到下:北极星(1 个,必填)→ 滞后指标(≤3)→ 引领指标(≤3)。
# 活推动引领指标,引领指标带动滞后指标,滞后指标逼近北极星。
#
# 完整设计见 docs/architecture.md 的「指标采集与读数」模块。
# 这里只写「怎么填」,字段的权威定义在那一章,两边不要各写一遍。
# ─────────────────────────────────────────────────────────────────────────
#
# 本机是 Windows,解释器是 `python`(不是 `python3`)—— run 数组第一项写
# `python`。换台机器要一并改。每个脚本自己在 stdout 里 reconfigure UTF-8。
#
# 指标的判定与理由见 docs/metrics.md,这里只放定义。

# ── 北极星 ────────────────────────────────────────────────────────────
# 本轮(2026-W35 首次运作活①)北极星**留空**,灯保持灰。
#
# 人要的方向是「被 buddy 纳入的项目是否又快又好了」——这是正的**用户效果**
# 价值指标,不是工程供给量。但手填值没有:buddy 本地零库、还没外部项目纳入,
# 既采不到用户周期/回滚数据,人也说不出一个具体数。没数据就是灰,不为了点亮
# 硬凑一个方便采但答非所问的指标(提交数 / issue 数这类工程虚荣)。等外部项目
# 真纳入、能采到其运作周期与回滚率那天,再回来 formalize 这条北极星的具体口径。
[north_star]
name = "(还没填)被 buddy 纳入的项目是否又快又好"
def = "(还没填)本轮留空:方向是『被纳入管理的项目,其运作是否比纳入前更快、质量更好』,但当前无用户效果数据可采,手填也无思路。等外部项目纳入能采到周期/回滚数据再 formalize。"
target = ""
collect = { kind = "manual" }

# ── 滞后指标(≤3):结果量,月/周更新 ───────────────────────────────
# 早期定不出来是正常的,允许一条都没有,界面如实显示灰。

[[lagging]]
name = "纳入 workbench 管理的项目数"
def = "真实接入 buddy、跑通过至少一次运作活①(更新指标 + 周计划)、且当周仍活着的项目去重计数。只在 buddy 里挂了仓链接但没跑过运作活的不算。"
target = "≥3"
# C 类(手填):buddy 的「被管项目清单」在 buddy 应用态里,不在这个仓;脚本从
# 本机读不到「buddy 一共管着几个项目」。也没接入事件日志,历史算不回来。
# 这是采纳结果量(workbench 越好 → 项目越纳入),放滞后正合适。每周运作活① 会
# 再问一次能不能写成脚本——最便宜的下一步是 buddy 接入项目时追加一条带时间戳
# 的事件到 .bw/metrics/readings.jsonl,让它从 C 升到 B。
collect = { kind = "manual" }

# ── 引领指标(≤3):本周可控的先行量,直接由活推动 ──────────────────
# 注意:workbench 平台本身会记项目级**代码仓**指标(每周提交数 / 每周合入 MR 数),
# 那些不在这里重复定义,免得一份数两个正本。这里只收平台不代记的**工作管理**类
# 指标。

[[leading]]
name = "每周闭环的 issue 数"
def = "远端上 closed 时刻落在这一周的 issue 数;本机合并提交 / MR 合入不算(口径不同)。反映『有人提活 + 项目自己闭环快』,对采纳滞后有预测性。"
target = "≥1"
# A 类(可回溯):codehub-cli issue list --state closed 带 closed_at,任意一周现算。
collect = { kind = "script", run = ["python", ".bw/scripts/codehub-closed-issues.py"], retro = true }
