<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workbench — ShortcutKeyCombo</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="primitives.css">
</head>
<body>
<div class="pv-col">
  <div class="pv-row"><span class="pv-cap">macOS</span>
    <span class="shortcut-combo"><span class="shortcut-keycap">⌘</span><span class="shortcut-keycap">⇧</span><span class="shortcut-keycap">N</span></span>
    <span class="shortcut-combo"><span class="shortcut-keycap">⌘</span><span class="shortcut-keycap">J</span></span>
  </div>
  <div class="pv-row"><span class="pv-cap">Win/Linux</span>
    <span class="shortcut-combo"><span class="shortcut-keycap">Ctrl</span><span class="shortcut-sep">+</span><span class="shortcut-keycap">Shift</span><span class="shortcut-sep">+</span><span class="shortcut-keycap">N</span></span>
  </div>
</div>
