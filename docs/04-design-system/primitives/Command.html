<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workbench — Command</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="primitives.css">
</head>
<body>
<div class="pv" style="justify-content:center">
  <div class="command-dialog" style="width:560px">
    <div data-slot="command">
      <div data-cmdk-input-wrapper><svg class="lucide lucide-search" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><input data-slot="command-input" placeholder="Jump to worktree, file or command…" value="login"></div>
      <div data-slot="command-list" style="max-height:none">
        <div data-slot="command-group"><div cmdk-group-heading>Worktrees</div>
          <div data-slot="command-item" class="jump-palette-item" data-selected="true"><svg class="lucide lucide-git-branch" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></svg>feature/login-flow<span class="item-meta">orca</span></div>
          <div data-slot="command-item" class="jump-palette-item"><svg class="lucide lucide-git-branch" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></svg>fix/login-redirect<span class="item-meta">workbench</span></div>
        </div>
        <div data-slot="command-separator"></div>
        <div data-slot="command-group"><div cmdk-group-heading>Files</div>
          <div data-slot="command-item" class="jump-palette-item"><svg class="lucide lucide-file-text" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>LoginForm.tsx<span class="item-meta">src/auth</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
