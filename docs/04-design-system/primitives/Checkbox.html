<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workbench — Checkbox</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="primitives.css">
</head>
<body>
<div class="pv">
  <label data-slot="label"><button data-slot="checkbox" data-state="unchecked" role="checkbox" aria-checked="false"></button>Unchecked</label>
  <label data-slot="label"><button data-slot="checkbox" data-state="checked" role="checkbox" aria-checked="true"><svg class="lucide lucide-check" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>Checked</label>
  <label data-slot="label"><button data-slot="checkbox" data-state="indeterminate" role="checkbox" aria-checked="mixed"><svg class="lucide lucide-minus" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>Some repos</label>
  <label data-slot="label"><button data-slot="checkbox" data-state="unchecked" class="is-focus" role="checkbox" aria-checked="false"></button>Focus</label>
  <label data-slot="label" style="opacity:.5"><button data-slot="checkbox" data-state="unchecked" data-disabled role="checkbox" aria-checked="false" aria-disabled="true"></button>Disabled</label>
</div>
</body>
</html>
