<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workbench — Button</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="primitives.css">
</head>
<body>
<div class="pv-col">
  <div class="pv-row"><span class="pv-cap">Variant</span>
    <button data-slot="button" data-variant="default" data-size="default">Create worktree</button>
    <button data-slot="button" data-variant="secondary" data-size="default">Duplicate</button>
    <button data-slot="button" data-variant="outline" data-size="default"><svg class="lucide lucide-git-branch" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></svg>Checkout</button>
    <button data-slot="button" data-variant="ghost" data-size="default">Cancel</button>
    <button data-slot="button" data-variant="link" data-size="default">View docs</button>
    <button data-slot="button" data-variant="destructive" data-size="default"><svg class="lucide lucide-trash-2" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</button>
  </div>
  <div class="pv-row"><span class="pv-cap">Size</span>
    <button data-slot="button" data-variant="outline" data-size="lg">Large</button>
    <button data-slot="button" data-variant="outline" data-size="default">Default</button>
    <button data-slot="button" data-variant="outline" data-size="sm">Small</button>
    <button data-slot="button" data-variant="outline" data-size="xs"><svg class="lucide lucide-plus" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Extra small</button>
    <button data-slot="button" data-variant="ghost" data-size="icon" aria-label="Settings"><svg class="lucide lucide-settings" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button data-slot="button" data-variant="ghost" data-size="icon-sm" aria-label="Copy"><svg class="lucide lucide-copy" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
    <button data-slot="button" data-variant="ghost" data-size="icon-xs" aria-label="Close"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="pv-row"><span class="pv-cap">State</span>
    <button data-slot="button" data-variant="default" data-size="default" class="is-hover">Hover</button>
    <button data-slot="button" data-variant="outline" data-size="default" class="is-focus">Focus</button>
    <button data-slot="button" data-variant="default" data-size="default" disabled style="width:132px"><svg class="lucide lucide-loader-circle spin" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Cloning…</button>
    <button data-slot="button" data-variant="secondary" data-size="default" disabled>Disabled</button>
  </div>
</div>
</body>
</html>
