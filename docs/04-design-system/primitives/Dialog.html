<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workbench — Dialog</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="primitives.css">
</head>
<body>
<div data-slot="dialog-overlay" style="display:flex;align-items:center;justify-content:center;min-height:300px;padding:24px">
  <div data-slot="dialog-content" role="dialog" aria-labelledby="dt">
    <div data-slot="dialog-header">
      <h2 data-slot="dialog-title" id="dt">Delete worktree “feature/login-flow”?</h2>
      <p data-slot="dialog-description">The folder and its uncommitted changes are removed from disk. The branch stays.</p>
    </div>
    <div data-slot="dialog-footer">
      <button data-slot="button" data-variant="ghost" data-size="default">Cancel</button>
      <button data-slot="button" data-variant="destructive" data-size="default">Delete worktree</button>
    </div>
    <button data-slot="dialog-close" aria-label="Close"><svg class="lucide lucide-x" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>
</body>
</html>
