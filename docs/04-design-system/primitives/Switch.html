<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workbench — Switch</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="primitives.css">
</head>
<body>
<div class="pv">
  <label data-slot="label"><button data-slot="switch" data-state="unchecked" role="switch" aria-checked="false"><span data-slot="switch-thumb" data-state="unchecked"></span></button>Off</label>
  <label data-slot="label"><button data-slot="switch" data-state="checked" role="switch" aria-checked="true"><span data-slot="switch-thumb" data-state="checked"></span></button>On</label>
  <label data-slot="label"><span data-slot="switch-indicator" data-size="compact" data-state="checked"><span data-slot="switch-thumb" data-state="checked"></span></span>Compact</label>
  <label data-slot="label"><button data-slot="switch" data-state="unchecked" class="is-focus" role="switch" aria-checked="false"><span data-slot="switch-thumb" data-state="unchecked"></span></button>Focus</label>
</div>
</body>
</html>
