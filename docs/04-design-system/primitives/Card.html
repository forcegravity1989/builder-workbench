<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workbench — Card</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="primitives.css">
</head>
<body>
<div class="pv" style="background:var(--background)">
  <div data-slot="card" style="width:400px">
    <div data-slot="card-header">
      <div data-slot="card-title">feature/login-flow</div>
      <div data-slot="card-description">Claude Code · started 12 min ago</div>
      <div data-slot="card-action"><span data-slot="badge" data-variant="dot"><span class="badge-pip" style="background:var(--agent-question)"></span>Needs input</span></div>
    </div>
    <div data-slot="card-content" style="display:flex;gap:8px;justify-content:flex-end">
      <button data-slot="button" data-variant="ghost" data-size="sm">Dismiss</button>
      <button data-slot="button" data-variant="default" data-size="sm">Open terminal</button>
    </div>
  </div>
</div>
</body>
</html>
