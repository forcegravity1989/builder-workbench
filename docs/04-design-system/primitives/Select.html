<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workbench — Select</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="primitives.css">
</head>
<body>
<div class="pv" style="align-items:flex-start;gap:24px">
  <div class="pv-col" style="padding:0;gap:8px">
    <button data-slot="select-trigger" data-size="default" style="width:200px"><span data-slot="select-value">Claude Code</span><svg class="lucide lucide-chevron-down select-chevron" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button data-slot="select-trigger" data-size="sm" data-placeholder style="width:200px"><span data-slot="select-value">Choose a shell</span><svg class="lucide lucide-chevron-down select-chevron" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <div data-slot="select-content" style="width:200px">
    <div data-slot="select-label">Agent</div>
    <div data-slot="select-item" class="is-highlighted">Claude Code<span class="select-check"><svg class="lucide lucide-check" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></div>
    <div data-slot="select-item">Codex</div>
    <div data-slot="select-item">OpenCode</div>
    <div data-slot="select-separator"></div>
    <div data-slot="select-item">Custom command…</div>
  </div>
</div>
</body>
</html>
