<!doctype html>
<html lang="zh-CN" data-theme="claude">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BW · 计划页高保真(#23 视觉优化稿)</title>
<!--
  独立高保真:计划屏。类名与 docs/hifi/index.html 及 crates/app-shell/assets/hifi.css
  一一对齐,定稿后改动直接回填到 hifi.css / plan/*.rs。
  样式从 hifi.css 摘出必要段落内联,保证单文件可双击预览。
  视觉规范对齐 Builder design system(Claude 板):暖 ivory 底 + 赭土 accent,
  系统字体栈、hairline 结构、颜色只给状态与主操作、Lucide 图标、状态点语义化。
-->
<style>
:root{
  /* ── Builder · Claude palette ──────────────────────────────────────── */
  --color-bg:#faf9f5; --color-surface:#f0eee6; --color-card:#fefdfa; --color-text:#1f1e1d;
  --color-accent:#d97757; --color-accent-2:#4c73a5;

  --color-neutral-100:#f6f3ef; --color-neutral-200:#ebe7e1; --color-neutral-300:#d7d2ca;
  --color-neutral-400:#b8b3ac; --color-neutral-500:#96918a; --color-neutral-600:#75716a;
  --color-neutral-700:#58554f; --color-neutral-800:#3d3a36; --color-neutral-900:#262421;

  --color-accent-100:#fef0eb; --color-accent-200:#ffe0d7; --color-accent-300:#fec3af;
  --color-accent-400:#f19b80; --color-accent-500:#d47354; --color-accent-600:#af5233;
  --color-accent-700:#893a1f; --color-accent-800:#602613; --color-accent-900:#3c180c;

  --color-accent-2-100:#edf4fe; --color-accent-2-200:#dbe9fc; --color-accent-2-300:#bdd5f4;
  --color-accent-2-400:#96b7e1; --color-accent-2-500:#6c95c9; --color-accent-2-600:#4c73a5;
  --color-accent-2-700:#355781; --color-accent-2-800:#243c59; --color-accent-2-900:#142539;

  --color-success:#579766; --color-success-soft:#dcf7e1; --color-success-deep:#286037;
  --color-warning:#ce9042; --color-warning-soft:#feecce; --color-warning-deep:#774a03;
  --color-danger:#c15f4d;  --color-danger-soft:#ffe4df;  --color-danger-deep:#883324;

  --color-divider:color-mix(in srgb,var(--color-text) 12%,transparent);

  --col-todo:#f3f2ef; --col-doing:#fbf6e8; --col-review:#eef6f1; --col-done:#eef4fb; --col-blocked:#f8eeee;
  --surface-page:#f6f5f2;

  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-heading:var(--font-body);
  --font-heading-weight:600;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px;

  --shadow-sm:0 1px 2px color-mix(in srgb,var(--color-neutral-900) 4%,transparent),0 1px 1px color-mix(in srgb,var(--color-neutral-900) 3%,transparent);
  --shadow-md:0 8px 24px color-mix(in srgb,var(--color-neutral-900) 8%,transparent),0 2px 6px color-mix(in srgb,var(--color-neutral-900) 5%,transparent);
  --shadow-lg:0 16px 40px color-mix(in srgb,var(--color-neutral-900) 14%,transparent),0 3px 10px color-mix(in srgb,var(--color-neutral-900) 8%,transparent);

  /* legacy 别名:让旧内联 var() 仍能解析 */
  --paper:var(--color-bg); --rail-bg:var(--color-surface); --clay:var(--color-accent); --clay-dim:var(--color-accent-200);
  --card:var(--color-card); --card-alt:var(--color-surface); --border:var(--color-divider); --border-deep:var(--color-neutral-300);
  --ink:var(--color-text); --ink-2:color-mix(in srgb,var(--color-text) 75%,transparent); --ink-3:color-mix(in srgb,var(--color-text) 55%,transparent); --ink-4:color-mix(in srgb,var(--color-text) 40%,transparent);
  --agent:var(--color-accent-2); --alert-deep:var(--color-danger-deep);
  --green:var(--color-success); --amber:var(--color-warning); --red:var(--color-danger); --gray:var(--color-neutral-400);
  --up:var(--color-success); --down:var(--color-danger);
  --serif:var(--font-heading); --sans:var(--font-body); --mono:var(--font-mono);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--surface-page);color:var(--color-text);font-family:var(--font-body);font-size:13px;line-height:1.5;letter-spacing:.005em;-webkit-font-smoothing:antialiased;}
::selection{background:color-mix(in srgb,var(--color-accent) 22%,transparent);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--color-neutral-300);border-radius:6px;border:3px solid var(--color-bg);}
::-webkit-scrollbar-track{background:transparent;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;color:var(--color-text);}
textarea{resize:vertical;}
a{color:var(--color-accent);text-decoration:none;}
a:hover{text-decoration:underline;text-underline-offset:3px;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);font-weight:var(--font-heading-weight);line-height:1.25;letter-spacing:-.014em;margin:0 0 var(--space-2);}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--color-accent) 18%,transparent);}
[contenteditable="true"]{outline:2px solid var(--color-accent);outline-offset:1px;border-radius:var(--radius-sm);}

/* ── Builder atoms ─────────────────────────────────────────────────── */
.mono{font-family:var(--font-mono);}
.text-muted{color:color-mix(in srgb,var(--color-text) 55%,transparent);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;font-family:var(--font-body);font-weight:500;font-size:13px;line-height:1;color:var(--color-text);background:transparent;border:1px solid transparent;height:28px;padding:0 var(--space-3);border-radius:var(--radius-sm);white-space:nowrap;}
.btn svg{display:block;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-secondary{background:var(--color-card);border-color:var(--color-divider);box-shadow:var(--shadow-sm);}
.btn-secondary:hover{background:var(--color-neutral-100);border-color:color-mix(in srgb,var(--color-text) 20%,transparent);}
.btn-primary{background:var(--color-accent);border-color:var(--color-accent);color:#fff;}
.btn-primary:hover{background:var(--color-accent-600);border-color:var(--color-accent-600);}
.btn-primary:active{background:var(--color-accent-700);border-color:var(--color-accent-700);}
.btn-primary:disabled{background:var(--color-neutral-300);border-color:var(--color-neutral-300);color:#fff;opacity:1;cursor:not-allowed;}
.btn-ghost{color:var(--color-accent);}
.btn-ghost:hover{background:color-mix(in srgb,var(--color-accent) 9%,transparent);}
.btn-sm{height:24px;font-size:12px;padding:0 var(--space-2);}
.btn-icon{width:28px;padding:0;}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;line-height:1;letter-spacing:.01em;padding:4px 8px;border-radius:999px;white-space:nowrap;}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-700);}
.tag-accent-2{background:var(--color-accent-2-100);color:var(--color-accent-2-700);}
.tag-neutral{background:var(--color-neutral-100);color:var(--color-neutral-700);}
.tag-outline{background:transparent;border:1px solid var(--color-divider);color:color-mix(in srgb,var(--color-text) 70%,transparent);padding:3px 8px;}
.tag-success{background:var(--color-success-soft);color:var(--color-success-deep);}
.tag-warning{background:var(--color-warning-soft);color:var(--color-warning-deep);}
.tag-danger{background:var(--color-danger-soft);color:var(--color-danger-deep);}

.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:color-mix(in srgb,var(--color-text) 75%,transparent);}
.status-dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--status-c,var(--color-neutral-400));}
.status-todo{--status-c:var(--color-neutral-400);}
.status-progress{--status-c:var(--color-warning);}
.status-review{--status-c:var(--color-accent-2);}
.status-done{--status-c:var(--color-success);}
.status-blocked{--status-c:var(--color-danger);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.32;}}
.dot-run .status-dot{animation:pulse 1.2s ease-in-out infinite;}

.card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-card);border:1px solid var(--color-divider);}
.card-title{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:13px;line-height:1.35;letter-spacing:-.01em;}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:color-mix(in srgb,var(--color-text) 50%,transparent);}
.elev-sm{box-shadow:var(--shadow-sm);}
.elev-lg{box-shadow:var(--shadow-lg);}

.avatar{width:24px;height:24px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:10px;font-weight:600;color:#fff;background:var(--color-neutral-500);overflow:hidden;}
.avatar-sm{width:18px;height:18px;font-size:8px;}
.avatar-agent{border-radius:var(--radius-sm);background:var(--color-accent-2);}

/* ── shell ─────────────────────────────────────────────────────────── */
.app-root{display:flex;height:100vh;overflow:hidden;background:var(--color-bg);}
.iconrail{width:56px;flex:0 0 56px;background:var(--color-surface);border-right:1px solid var(--color-divider);display:flex;flex-direction:column;align-items:center;padding:var(--space-3) 0 var(--space-2);gap:var(--space-1);}
.rail-logo{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--color-accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:700;font-size:15px;margin-bottom:var(--space-2);flex:none;}
.rail-btn{width:32px;height:32px;border:none;border-radius:var(--radius-sm);background:transparent;display:flex;align-items:center;justify-content:center;color:color-mix(in srgb,var(--color-text) 62%,transparent);position:relative;}
.rail-btn svg{display:block;}
.rail-btn:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent);color:var(--color-text);}
.rail-btn.active{background:color-mix(in srgb,var(--color-accent) 14%,transparent);color:var(--color-accent);}

.projectrail{width:220px;flex:0 0 220px;background:var(--color-surface);border-right:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);padding:var(--space-3) var(--space-2);overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-3);}
.pr-back{font-size:12.5px;color:color-mix(in srgb,var(--color-text) 62%,transparent);display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px var(--space-2);border-radius:var(--radius-sm);}
.pr-back:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent);color:var(--color-text);text-decoration:none;}
.pr-head{padding-bottom:var(--space-2);border-bottom:1px solid var(--color-divider);}
.pr-head-name{font-family:var(--font-heading);font-weight:700;font-size:14px;letter-spacing:-.01em;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pr-head-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:color-mix(in srgb,var(--color-text) 50%,transparent);font-family:var(--font-mono);}
.pr-nav{display:flex;flex-direction:column;gap:2px;}
.pr-link{display:flex;align-items:center;gap:var(--space-2);height:28px;padding:0 var(--space-2);border-radius:var(--radius-sm);font-size:13px;color:color-mix(in srgb,var(--color-text) 80%,transparent);cursor:pointer;}
.pr-link svg{flex:none;opacity:.75;}
.pr-link:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent);color:var(--color-text);text-decoration:none;}
.pr-link.active{background:color-mix(in srgb,var(--color-text) 8%,transparent);color:var(--color-text);font-weight:500;}
.pr-link.active svg{opacity:1;}
.pr-link .count{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:color-mix(in srgb,var(--color-text) 45%,transparent);}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:44px;flex:0 0 44px;border-bottom:1px solid var(--color-divider);background:var(--color-bg);display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4);}
.topbar-title{font-family:var(--font-heading);font-weight:700;font-size:14px;letter-spacing:-.01em;}
.topbar-crumbs{font-size:12px;color:color-mix(in srgb,var(--color-text) 50%,transparent);font-family:var(--font-mono);}
.content{flex:1;overflow-y:auto;padding:var(--space-4) var(--space-6) 60px;min-width:0;position:relative;}

/* ── plan ─────────────────────────────────────────────────────────── */
[data-screen="plan"]{height:calc(100vh - 112px);max-width:1560px;}
.plan-grid{display:grid;grid-template-columns:188px 1fr;gap:var(--space-4);height:100%;min-height:0;}
.plan-col{background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);overflow-y:auto;padding:var(--space-2);}
.plan-weekrow{padding:6px var(--space-2);border-radius:var(--radius-sm);font-size:12.5px;cursor:pointer;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;color:color-mix(in srgb,var(--color-text) 80%,transparent);}
.plan-weekrow:hover{background:color-mix(in srgb,var(--color-text) 5%,transparent);color:var(--color-text);}
.plan-weekrow.active{background:color-mix(in srgb,var(--color-text) 8%,transparent);color:var(--color-text);font-weight:500;}
.plan-weekgroup{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 45%,transparent);margin:var(--space-3) 0 var(--space-1);padding:0 var(--space-2);}
.chip-muted{background:transparent;color:color-mix(in srgb,var(--color-text) 45%,transparent);font-size:10.5px;font-family:var(--font-mono);padding:0;}
.plan-weekrow.active .chip-muted{color:var(--color-text);}
.plan-versionsel{margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--color-divider);}
.plan-mid{display:flex;flex-direction:column;min-width:0;height:100%;background:transparent;border:none;box-shadow:none;padding:0;overflow:visible;}
.plan-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3);gap:var(--space-3);flex-wrap:wrap;flex:none;}
.plan-toolbar .left{font-size:20px;font-family:var(--font-heading);font-weight:700;letter-spacing:-.014em;}
.plan-toolbar .right{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;}
.switch{display:flex;align-items:center;gap:6px;font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);cursor:pointer;user-select:none;}
.goal-box{background:var(--color-card);border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3);font-size:13px;margin-bottom:var(--space-3);flex:none;white-space:pre-wrap;color:color-mix(in srgb,var(--color-text) 82%,transparent);line-height:1.65;}
.ops-chip-row{display:flex;gap:var(--space-2);flex-wrap:wrap;margin:var(--space-1) 0 var(--space-4);}
.week-progress{height:8px;border-radius:999px;overflow:hidden;display:flex;border:1px solid var(--color-divider);margin-bottom:var(--space-3);background:var(--color-neutral-100);}

/* 看板:列走 surface 底,卡走 card 底 + hairline,不嵌套、不重影 */

.kanban{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(248px,1fr);gap:16px;min-height:0;overflow-x:auto;padding:4px 2px 8px;}
.kanban-col{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:14px;background:var(--col-todo);border:none;min-height:0;overflow:hidden;transition:background .15s;}
.kanban-col.col-todo{background:var(--col-todo);}
.kanban-col.col-doing{background:var(--col-doing);}
.kanban-col.col-pending{background:var(--col-review);}
.kanban-col.col-blocked{background:var(--col-blocked);}
.kanban-col.col-done{background:var(--col-done);}
.kanban-col-head{display:flex;align-items:center;gap:8px;padding:6px 8px 2px;font-size:13px;font-weight:600;color:var(--color-text);flex:none;}
.kanban-col-head .count{margin-left:auto;font-family:var(--font-mono);font-size:12px;font-weight:500;color:color-mix(in srgb,var(--color-text) 45%,transparent);}
.kanban-seg{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 45%,transparent);margin:var(--space-1) 0 var(--space-1);flex:none;display:flex;align-items:center;gap:5px;padding:0 var(--space-1);}
.kanban-seg .seg-count{margin-left:auto;font-family:var(--font-mono);color:color-mix(in srgb,var(--color-text) 40%,transparent);font-weight:400;}
.kanban-seg-sep{height:1px;background:var(--color-divider);margin:var(--space-2) 0 2px;flex:none;}
.kanban-seg-box{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto;padding:2px;}
.kanban-seg-box.drop-target{outline:2px dashed var(--color-accent);outline-offset:-2px;background:var(--color-accent-100);border-radius:var(--radius-sm);}
.kanban-empty{padding:48px 8px;text-align:center;font-size:12px;color:color-mix(in srgb,var(--color-text) 40%,transparent);}
.kcard{display:flex;flex-direction:column;gap:6px;padding:12px 10px;border-radius:10px;background:#fff;}
.kcard{border:0.5px solid color-mix(in srgb,var(--color-text) 8%,transparent);box-shadow:0 1px 2px color-mix(in srgb,var(--color-neutral-900) 5%,transparent);flex:none;cursor:grab;}
.kcard:hover{border-color:color-mix(in srgb,var(--color-text) 16%,transparent);box-shadow:0 2px 8px color-mix(in srgb,var(--color-neutral-900) 7%,transparent);}
.kcard.dragging{opacity:.4;}
.kcard.sel{border-color:var(--color-accent);box-shadow:0 0 0 1px var(--color-accent);}
.kcard-top{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;color:color-mix(in srgb,var(--color-text) 48%,transparent);}
.kcard-src{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--color-accent-2-700);background:var(--color-accent-2-100);padding:2px 6px;border-radius:999px;}
.kcard-title{font-weight:600;font-size:14px;line-height:1.4;color:var(--color-text);cursor:pointer;}
.kcard-title:hover{color:var(--color-accent);}

.kcard-desc{font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.kcard-place{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;}
.kcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}

.kcard-who{display:inline-flex;align-items:center;gap:6px;font-size:12px;}
.kcard-ago{font-size:11px;opacity:.7;}


.il-row{display:flex;align-items:center;gap:16px;min-height:64px;padding:12px 16px;cursor:pointer;}
.il-row:hover{background:rgba(0,0,0,.03);}
.il-row.sel{background:rgba(217,119,87,.08);}
.il-row.il-head{cursor:default;font-size:12px;font-weight:500;min-height:40px;background:#fafafa;}
.il-num{flex:none;width:56px;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;}
.il-idmark{width:8px;height:8px;border-radius:50%;border:1.5px solid #bbb;flex:none;}
.il-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.il-t1{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.il-t2{font-size:12px;opacity:.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.il-status{flex:none;width:110px;}
.il-pill{display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;}
.il-pill.status-todo{background:#f3f4f3;color:#5c5c5c;}
.il-pill.status-progress{background:#feecce;color:#774a03;}
.il-pill.status-review{background:#e7f6ec;color:#1f6b3a;}
.il-pill.status-done{background:#e8f2fb;color:#1d4e89;}
.il-pill.status-blocked{background:#ffe4df;color:#883324;}
.il-empty{padding:24px;text-align:center;opacity:.45;}

.il-wrap{display:flex;flex-direction:column;flex:1;min-height:0;}
.il-bar{flex:none;border:1px solid color-mix(in srgb,var(--color-text) 8%,transparent);border-bottom:none;border-radius:10px 10px 0 0;background:#f4f4f2;padding:10px 12px 8px;}
.il-presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function weekRail(){
  var h = '';
  h += '<div class="plan-weekrow '+(state.view==='all'?'active':'')+'" onclick="setView(\'all\')">全部 issue</div>';
  // 本周 + 未来周(可排期的未结束周)
  PROJECT.weeks.filter(function(w){return !w.past;}).forEach(function(w){
    var active = state.view==='week' && state.week===w.week ? 'active':'';
    var tag = w.current?' · 本周':(w.future?' · 未来':'');
    h += '<div class="plan-weekrow '+active+'" onclick="setView(\'week\',\''+w.week+'\')">'
      + '<span>'+w.week+tag+'</span>'
      + '<span class="chip-muted">'+w.activity+'</span>'
      + '</div>';
  });
  // 历史周
  var past = PROJECT.weeks.filter(function(w){return w.past;});
  // 已建的版本(需求2):在历史周上方
  if(PROJECT.plan_versions.length){
    h += '<div class="plan-weekgroup">版本</div>';
    PROJECT.plan_versions.forEach(function(v){
      h += '<div class="plan-weekrow" title="'+esc(v.start)+' → '+esc(v.end)+'"><span>'+esc(v.name)+'</span><span class="chip-muted">'+v.issues.length+'</span></div>';
    });
  }
  if(past.length){
    h += '<div class="plan-weekgroup">历史周</div>';
    past.forEach(function(w){
      var active = state.view==='week' && state.week===w.week ? 'active':'';
      h += '<div class="plan-weekrow '+active+'" onclick="setView(\'week\',\''+w.week+'\')">'
        + '<span>'+w.week+'</span>'
        + '<span class="chip-muted">回填</span>'
        + '</div>';
    });
  }
  h += '<div class="plan-versionsel"><div class="label">在研版本</div><div class="mono" style="font-size:13px;color:var(--color-text);">'+PROJECT.version+'</div></div>';
  return h;
}

function kanban(rows, isAll){
  var groups = isAll ? GROUPS : GROUPS_WEEK;
  var h = '<div class="kanban">';
  groups.forEach(function(g){
    var segs = g.segments || [{ key:g.key, label:"", statuses:g.statuses }];
    var rendered = segs.map(function(seg){
      var items = rows.filter(function(r){return seg.statuses.indexOf(r.col)>=0;});
      return { seg:seg, items:items };
    });
    var total = rendered.reduce(function(n,s){return n+s.items.length;},0);
    var multi = segs.length>1;
    var activeKey = state.colSeg[g.key] || segs[0].key;
    var tint = g.key;
    if(g.key==='pending' && activeKey==='blocked') tint = 'blocked';
    if(g.key==='done' && activeKey==='cancelled') tint = 'todo';
    h += '<div class="kanban-col col-'+tint+'">'
      +   '<div class="kanban-col-head"><span class="status-dot '+g.colDot+'"></span>'+g.title+'<span class="count">'+total+'</span></div>';
    if(multi){
      // 需求4:列标题下一行放两个子标题,默认只显示第一段,点第二段切到第二段
      h += '<div class="kanban-segtabs">';
      segs.forEach(function(s){
        var on = s.key===activeKey ? 'active':'';
        var cnt = rendered.find(function(r){return r.seg.key===s.key;}).items.length;
        h += '<button class="seg-tab '+on+'" onclick="setColSeg(\''+g.key+'\',\''+s.key+'\')">'+s.label+'<span class="seg-count">'+cnt+'</span></button>';
      });
      h += '</div>';
    }
    var active = rendered.find(function(r){return r.seg.key===activeKey;}) || rendered[0];
    // 需求3:总览下「已计划」段是放置区,接住未计划卡的拖拽
    var isDropTarget = isAll && active.seg.key==='assigned';
    var dropAttrs = isDropTarget ? 'ondragover="dragOverAssign(event)" ondrop="dropToAssign(event)" data-seg="assigned"' : '';
    h += '<div class="kanban-seg-box" '+dropAttrs+'>';
    if(active.items.length){ active.items.forEach(function(c){ h += card(c); }); } else { h += '<div class="kanban-empty">无 issue</div>'; }
    h += '</div>';
    h += '</div>';
  });
  h += '</div>';
  return h;
}
function setColSeg(gk, sk){ state.colSeg[gk] = sk; render(); }

function agoOf(c){
  var m={16:'16d',20:'12d',23:'2d',18:'3d',17:'4h',15:'1d',11:'6d',10:'8d',9:'20d',19:'5d',12:'9d'};
  var zh={'16d':'更新于 16 天前','12d':'更新于 12 天前','2d':'更新于 2 天前','3d':'更新于 3 天前','4h':'更新于 4小时前','1d':'更新于 1 天前','6d':'更新于 6 天前','8d':'更新于 8 天前','20d':'更新于 20 天前','5d':'更新于 5 天前','9d':'更新于 9 天前','now':'更新于 最近'};
  var k=c.updated||m[c.num]||'now'; return zh[k]||k;
}
function card(c){
  var meta = STATUS_META[c.col] || STATUS_META.Backlog;
  var running = c.col==='InProgress';
  var preview = String(c.body||'').replace(/\s+/g,' ').trim();
  if(preview.length>64) preview = preview.slice(0,64)+'\u2026';
  var place = c.week_of ? c.week_of : (c.plan_version ? ('版本·'+c.plan_version) : '未排期');
  var who = c.assignee || '未指派';
  var initial = (c.assignee||'?').charAt(0).toUpperCase();
  var src = c.remote_number ? '<span class="kcard-src">'+icon('external',10)+' CodeHub</span>' : '';
  var sel = state.selId===c.id ? 'sel':'';
  var drag = c.col==='Backlog' ? 'draggable="true" ondragstart="dragIssue(\''+c.id+'\',event)"' : '';
  return '<div class="kcard '+sel+'" '+drag+' onclick="selectCard(\''+c.id+'\')">'
    + '<div class="kcard-top"><span>#'+c.num+'</span>'+src+'<span class="status '+(running?'dot-run ':'')+meta.status+'" style="margin-left:auto" title="'+meta.label+'"><span class="status-dot"></span></span></div>'
    + '<div class="kcard-title">'+esc(c.title)+'</div>'
    + (preview ? '<div class="kcard-desc">'+esc(preview)+'</div>' : '')
    + '<div class="kcard-place">'+icon('folder',12)+'<span>'+esc(place)+'</span></div>'
    + '<div class="kcard-foot"><span class="kcard-who"><span class="avatar avatar-sm">'+esc(initial)+'</span>'+esc(who)+'</span><span class="kcard-ago">'+esc(agoOf(c))+'</span></div>'
    + '</div>';
}

  } else if(c.col==='Cancelled'){

  var block = (c.col!=='Done'&&c.col!=='Blocked'&&c.col!=='Cancelled') ? '<button class="btn btn-sm btn-secondary" title="标记阻塞" onclick="closeDetail()">'+icon('ban',14)+' 阻塞</button>' : '';
  var cancel = (c.col!=='Done'&&c.col!=='Cancelled') ? '<button class="btn btn-sm btn-secondary" title="Cancel" onclick="closeDetail()">'+icon('xcircle',14)+' Cancel</button>' : '';

/* 需求2:列表视图 —— 一行一张活,点行开详情 */
function cardPlan(c){
  return c.week_of || c.plan_version || c.version || '';
}
function stageLabel(col){
  var m = {Backlog:'未排期',Todo:'已排期',InProgress:'进行中',InReview:'待评审',Blocked:'阻塞',Done:'完成',Cancelled:'已取消'};
  return m[col] || ((STATUS_META[col]||{}).label || col);
}
function listAction(c){
  if(c.col==='Backlog') return 'schedule';
  if(c.col==='Todo') return 'start';
  if(c.col==='InProgress'||c.col==='InReview'||c.col==='Blocked') return 'open';
  return 'dash';
}

function listView(rows, isAll){
  var order = ['Backlog','Todo','InProgress','InReview','Blocked','Done','Cancelled'];
  var f = state.listFilter;
  var plans = [];
  rows.forEach(function(c){
    var pl = cardPlan(c);
    if(pl && plans.indexOf(pl)<0) plans.push(pl);
  });
  PROJECT.weeks.forEach(function(w){ if(plans.indexOf(w.week)<0) plans.push(w.week); });
  (PROJECT.plan_versions||[]).forEach(function(v){ if(v.name && plans.indexOf(v.name)<0) plans.push(v.name); });
  var filtered = rows.filter(function(c){
    if(f.preset==='open' && (c.col==='Done'||c.col==='Cancelled')) return false;
    if(f.preset==='assigned' && (c.assignee||'')!==CURRENT_USER) return false;
    if(f.preset==='mine' && c.origin!=='人建') return false;
    if(f.plan && cardPlan(c)!==f.plan) return false;
    if(f.stage && c.col!==f.stage) return false;
    if(f.q){
      var q = String(f.q).toLowerCase();
      var blob = (c.title+' #'+c.num+' '+(c.body||'')+' '+(c.assignee||'')).toLowerCase();
      if(blob.indexOf(q)<0) return false;
    }
    return true;
  }).sort(function(a,b){return order.indexOf(a.col)-order.indexOf(b.col);});

  function presetBtn(id, lab){
    return '<button class="il-preset'+(f.preset===id?' on':'')+'" onclick="setListPreset(\''+id+'\')">'+lab+'</button>';
  }
  function dd(key, title, value, optsHtml){
    var open = state.listFilterOpen===key;
    return '<div class="il-dd">'
      + '<button class="il-dd-btn" onclick="event.stopPropagation();toggleListFilter(\''+key+'\')">'+title+(value?' <b>'+esc(value)+'</b>':'')+' '+icon('chevron',12)+'</button>'
      + (open ? '<div class="il-popover il-pop-plan">'+optsHtml+'</div>' : '')
      + '</div>';
  }
  var planOpts = '<div class="il-pop-opt '+(f.plan===''?'sel':'')+'" onclick="setListFilter(\'plan\',\'\')">全部</div>';
  plans.forEach(function(pl){
    planOpts += '<div class="il-pop-opt '+(f.plan===pl?'sel':'')+'" onclick="setListFilter(\'plan\',\''+String(pl).replace(/'/g,'')+'\')">'+esc(pl)+'</div>';
  });
  var stageOpts = '<div class="il-pop-opt '+(f.stage===''?'sel':'')+'" onclick="setListFilter(\'stage\',\'\')">全部</div>';
  order.forEach(function(k){
    stageOpts += '<div class="il-pop-opt '+(f.stage===k?'sel':'')+'" onclick="setListFilter(\'stage\',\''+k+'\')">'+stageLabel(k)+'</div>';
  });

  var h = '<div class="il-wrap">'
    + '<div class="il-bar">'
    +   '<div class="il-presets">'+presetBtn('open','开放')+presetBtn('assigned','分配我的')+presetBtn('mine','我的')+'</div>'
    +   '<div class="il-tools">'
    +     dd('plan','计划', f.plan, planOpts)
    +     dd('stage','阶段', f.stage?stageLabel(f.stage):'', stageOpts)
    +     '<div class="il-search-wrap">'+icon('search',14)+'<input id="il-q" class="il-search" placeholder="Search issues..." value="'+esc(f.q||'')+'" oninput="onListSearch(this)"></div>'
    +   '</div>'
    + '</div>'
    + '<div class="issue-list">'
    + '<div class="il-row il-head">'
    +   '<span class="il-num">ID</span><span class="il-title">标题</span>'
    +   '<span class="il-owner">负责人</span>'
    +   '<span class="il-status">状态</span>'
    +   '<span class="il-updated">已更新</span>'
    +   '<span class="il-act"></span>'
    + '</div>';

  filtered.forEach(function(c){
    var meta = STATUS_META[c.col] || STATUS_META.Backlog;
    var ownerName = c.assignee || '';
    var initial = ownerName ? ownerName.charAt(0).toUpperCase() : '';
    var planTag = cardPlan(c) || '未排期';
    var sub = 'by '+(ownerName || '—')+' · '+planTag;
    var ownerHtml = ownerName
      ? '<span class="avatar avatar-sm'+(ownerName==='claude'?' avatar-agent':'')+'">'+esc(initial)+'</span>'+esc(ownerName)
      : '—';
    var kind = listAction(c);
    var actHtml = '<span class="il-dash"></span>';
    if(kind==='schedule')
      actHtml = '<button class="il-btn" onclick="event.stopPropagation();openSchedule(\''+c.id+'\')">schedule</button>';
    else if(kind==='start')
      actHtml = '<button class="il-btn" onclick="event.stopPropagation();openStart(\''+c.id+'\')">Start '+icon('arrowright',12)+'</button>';
    else if(kind==='open')
      actHtml = '<button class="il-btn primary" onclick="event.stopPropagation();openIssueSession(\''+c.id+'\')">Open '+icon('arrowright',12)+'</button>';
    var ago = String(agoOf(c)).replace('更新于 ','');
    h += '<div class="il-row '+(state.selId===c.id?'sel':'')+'" onclick="selectCard(\''+c.id+'\')">'
      +   '<span class="il-num"><span class="il-idmark"></span>#'+c.num+'</span>'
      +   '<span class="il-title"><span class="il-t1">'+esc(c.title)+'</span><span class="il-t2">'+esc(sub)+'</span></span>'
      +   '<span class="il-owner">'+ownerHtml+'</span>'
      +   '<span class="il-status"><span class="il-pill '+meta.status+'">'+stageLabel(c.col)+'</span></span>'
      +   '<span class="il-updated">'+esc(ago)+'</span>'
      +   '<span class="il-act">'+actHtml+'</span>'
      + '</div>';
  });
  if(!filtered.length) h += '<div class="il-empty">没有符合的 issue</div>';
  h += '</div></div>';
  return h;
}
function setListPreset(id){ state.listFilter.preset=id; state.listFilterOpen=null; render(); }
function onListSearch(el){
  state.listFilter.q = el.value;
  state.listFocus = 'q';
  state.listCaret = el.selectionStart||el.value.length;
  render();
}
function restoreListSearch(){
  var el = document.getElementById('il-q');
  if(!el || state.listFocus!=='q') return;
  el.focus();
  var pos = state.listCaret|0;
  try{ el.setSelectionRange(pos, pos); }catch(e){}
}
function toggleListFilter(k){ state.listFilterOpen = state.listFilterOpen===k ? null : k; render(); }
function setListFilter(k,v){ state.listFilter[k]=v; state.listFilterOpen=null; render(); }

function openSchedule(id){ state.scheduleId=id; state.modal='schedule'; state.selId=null; render(); }
function openStart(id){ state.startId=id; state.modal='start'; state.selId=null; render(); }
function openIssueSession(id){
  var c = CARDS.find(function(x){return x.id===id;});
  if(!c) return;
  state.sessionId = id;
  state.screen = 'session';
  state.selId = null;
  state.modal = null;
  render();
}
function backToPlan(){ state.screen='plan'; render(); }
function startModal(){
  var c = CARDS.find(function(x){return x.id===state.startId;});
  if(!c) return '';
  var defName = c.branch || ('bw/issue-'+c.num);
  return '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">'
    + '<div class="modal plan-modal" style="max-width:480px;">'
    +   '<div class="plan-modal-head">'
    +     '<div class="plan-modal-tag">worktree</div>'
    +     '<div class="plan-modal-title">'+icon('play',16)+' Start · #'+c.num+'</div>'
    +     '<button class="plan-modal-x" onclick="closeModal()">'+icon('close',16)+'</button>'
    +   '</div>'
    +   '<div class="plan-modal-body cv-form">'
    +     '<div class="formrow"><label class="label">worktree 名</label>'
    +       '<input id="st-name" class="input" value="'+esc(defName)+'"></div>'
    +     '<div class="formrow"><label class="label">基于</label>'
    +       '<select id="st-base" class="select"><option value="main">main</option><option value="HEAD">HEAD</option></select></div>'
    +     (c.kind==='运作活'
    +       ? '<div class="formrow"><label class="label">类别</label><div>运作</div></div>'
    +       : '<div class="formrow"><label class="label">类别</label><select id="st-cat" class="select"><option value=""'+(c.category?'':' selected')+'>还没选</option><option'+(c.category==='原型'?' selected':'')+'>原型</option><option'+(c.category==='构建'?' selected':'')+'>构建</option><option'+(c.category==='优化'?' selected':'')+'>优化</option><option'+(c.category==='运维'?' selected':'')+'>运维</option><option'+(c.category==='运营推广'?' selected':'')+'>运营推广</option></select></div>')
    +     '<label class="check-row"><input id="st-setup" type="checkbox" checked><span>创建后跑 setup script</span></label>'
    +     '<div class="cfg-readonly-note">确认后创建 worktree，issue 切到进行中，并打开会话。没类别的业务活先选一类。</div>'
    +   '</div>'
    +   '<div class="plan-modal-foot">'
    +     '<span></span>'
    +     '<div style="display:flex;gap:var(--space-2);">'
    +       '<button class="btn btn-secondary" onclick="closeModal()">取消</button>'
    +       '<button class="btn btn-primary" onclick="confirmStart()">Start</button>'
    +     '</div>'
    +   '</div>'
    + '</div></div>';
}
function confirmStart(){
  var c = CARDS.find(function(x){return x.id===state.startId;});
  if(!c){ closeModal(); return; }
  var nameEl = document.getElementById('st-name');
  var baseEl = document.getElementById('st-base');
  var catEl = document.getElementById('st-cat');
  var name = (nameEl && nameEl.value.trim()) || ('bw/issue-'+c.num);
  var base = (baseEl && baseEl.value) || 'main';
  if(c.kind!=='运作活'){
    var cat = catEl && catEl.value.trim();
    if(!cat){ alert('先选类别'); return; }
    c.category = cat;
  }
  c.col = 'InProgress';
  c.branch = name;
  c.worktree = { name:name, base:base };
  c.updated = 'now';
  if(!c.assignee) c.assignee = CURRENT_USER;
  var id = c.id;
  state.modal = null;
  state.startId = null;
  openIssueSession(id);
}
function sessionView(){
  var c = CARDS.find(function(x){return x.id===state.sessionId;});
  if(!c) return '';
  var wt = (c.worktree && c.worktree.name) || c.branch || ('bw/issue-'+c.num);
  return '<div class="sess-page">'
    +   '<div class="sess-bar">'
    +     '<button class="btn btn-sm btn-ghost" onclick="backToPlan()">'+icon('back',14)+' 计划</button>'
    +     '<span class="sess-title">#'+c.num+' '+esc(c.title)+'</span>'
    +     '<span class="sess-meta">'+esc(wt)+'</span>'
    +   '</div>'
    +   '<div class="sess-body">'
    +     '<div class="sess-bubble">worktree 已就绪 · '+esc(wt)+'</div>'
    +     '<div class="sess-bubble">围绕 #'+c.num+' 开始。状态已切到进行中。</div>'
    +   '</div>'
    + '</div>';
}

function row(k,v){ return '<div class="detail-row"><div class="k">'+esc(k)+'</div>'+esc(v)+'</div>'; }

/* ---- 需求4:详情双击编辑,关闭自动保存 ---- */
function editOn(el){ el.setAttribute('contenteditable','true'); el.focus(); }
function editSaveTitle(id){
  var el=document.getElementById('ed-title'); if(!el)return;
  el.removeAttribute('contenteditable');
  var c=CARDS.find(function(x){return x.id===id;}); if(c){c.title=el.textContent.trim();}
}
function editSaveBody(id){
  var el=document.getElementById('ed-body'); if(!el)return;
  el.removeAttribute('contenteditable');
  var c=CARDS.find(function(x){return x.id===id;}); if(c){c.body=el.textContent;}
}
/* 需求6:负责人可编辑,保存时同步到 codehub(原型用 alert 模拟) */
function editSaveAssignee(id){
  var el=document.getElementById('ed-assignee'); if(!el)return;
  var c=CARDS.find(function(x){return x.id===id;});
  if(!c) return;
  var v = el.value.trim();
  var changed = (c.assignee||'') !== v;
  c.assignee = v;
  if(changed) toast('负责人改为 '+(v||'(空)')+' · 已同步到 codehub');
}
function closeDetail(){
  if(state.selId){
    editSaveTitle(state.selId);
    editSaveBody(state.selId);
    editSaveAssignee(state.selId);
  }
  selectCard(null);
}
/* 简易 toast(原型) */
function toast(msg){
  var t = document.createElement('div');
  t.className = 'toast show';
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--color-text);color:var(--color-surface);padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:200;box-shadow:0 8px 26px rgba(0,0,0,.18);';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}

/* ---- 需求3:拖未分配的卡到已分配段 → 排期弹窗 ---- */
function dragIssue(id, e){ state.dragId=id; e.dataTransfer.setData('text', id); e.dataTransfer.effectAllowed='move'; }
function dragOverAssign(e){ e.preventDefault(); e.currentTarget.classList.add('drop-target'); }
function dropToAssign(e){
  e.preventDefault();
  e.currentTarget.classList.remove('drop-target');
  var id = e.dataTransfer.getData('text') || state.dragId;
  if(!id) return;
  var c = CARDS.find(function(x){return x.id===id;});
  if(!c || c.col!=='Backlog') return; // 只接未分配
  state.scheduleId = id;
  state.modal = 'schedule';
  render();
}

/* ---- 需求2:创建版本弹窗 ---- */
function openCreateVersion(){ state.modal='createVersion'; render(); }

/* ---- 需求6:新建 issue 弹窗(含负责人,创建后同步 codehub) ---- */
function openNewIssue(){ state.modal='newIssue'; render(); }
function newIssueModal(){
  return '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">'
    + '<div class="modal plan-modal" style="max-width:480px;">'
    +   '<div class="plan-modal-head">'
    +     '<div class="plan-modal-tag">新建</div>'
    +     '<div class="plan-modal-title">'+icon('plus',16)+' 新建 issue</div>'
    +     '<button class="plan-modal-x" onclick="closeModal()">'+icon('close',16)+'</button>'
    +   '</div>'
    +   '<div class="plan-modal-body cv-form">'
    +     '<div class="formrow"><label class="label">标题 <span class="asterisk">*</span></label>'
    +       '<input id="ni-title" class="input" placeholder="这张活要干什么"></div>'
    +     '<div class="formrow"><label class="label">正文</label>'
    +       '<textarea id="ni-body" class="input" placeholder="要做成什么、边界。可空"></textarea></div>'
    +     '<div class="cv-field-2">'
    +       '<div class="formrow" style="margin:0;"><label class="label">类别</label>'
    +         '<select id="ni-cat" class="select"><option>原型</option><option selected>构建</option><option>优化</option><option>运作</option></select></div>'
    +       '<div class="formrow" style="margin:0;"><label class="label">负责人</label>'
    +         '<input id="ni-assignee" class="input" placeholder="指派谁(可空)"></div>'
    +     '</div>'
    +   '</div>'
    +   '<div class="plan-modal-foot">'
    +     '<span class="cv-foot-hint">新建的 issue 进未排期·未计划;创建后同步到 codehub。</span>'
    +     '<div style="display:flex;gap:var(--space-2);">'
    +       '<button class="btn btn-secondary" onclick="closeModal()">取消</button>'
    +       '<button class="btn btn-primary" onclick="confirmNewIssue()">创建</button>'
    +     '</div>'
    +   '</div>'
    + '</div></div>';
}
function confirmNewIssue(){
  var title = document.getElementById('ni-title').value.trim();
  if(!title){ alert('标题不能空'); return; }
  var body = document.getElementById('ni-body').value.trim();
  var cat = document.getElementById('ni-cat').value;
  var assignee = document.getElementById('ni-assignee').value.trim();
  var num = CARDS.reduce(function(m,c){return Math.max(m,c.num);},0)+1;
  CARDS.push({
    id:'i'+num, col:'Backlog', num:num, title:title, category:cat, kind:'业务活', origin:'人建',
    week_of:'', version:'', metric_key:'', settled:false, pr_number:0, remote_number:num, branch:'',
    body:body, can_start:true, assignee:assignee
  });
  closeModal();
  toast('issue #'+num+' 已创建 · 负责人 '+(assignee||'(空)')+' · 已同步到 codehub');
}

function scheduleModal(){
  var c = CARDS.find(function(x){return x.id===state.scheduleId;});
  if(!c) return '';
  var opts = '';
  openWeeks().forEach(function(w){
    var tag = w.current?'(本周)':(w.future?'(未来)':'');
    opts += '<option value="week:'+w.week+'">周计划 · '+w.week+' '+tag+'</option>';
  });
  PROJECT.plan_versions.forEach(function(v){
    opts += '<option value="version:'+v.name+'">版本 · '+v.name+'</option>';
  });
  return '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">'
    + '<div class="modal" style="max-width:420px;">'
    +   '<div class="plan-modal-title" style="font-size:16px;">'+icon('package',16)+' 排期 · #'+c.num+'</div>'
    +   '<div style="font-size:13px;line-height:1.7;color:color-mix(in srgb,var(--color-text) 75%,transparent);">把这张未排期的活排进哪个版本。周版本每周一按周号出现,也可以排进人起名的版本。</div>'
    +   '<div class="formrow"><label class="label">排进</label>'
    +     '<select id="sched-sel" class="select">'+opts+'</select></div>'
    +   '<div class="cfg-readonly-note">排进一个版本 = 从未排期变已排期。周号形态和人起名的是同一类版本,不是两套排期。</div>'
    +   '<div class="modal-actions">'
    +     '<button class="btn btn-secondary" onclick="closeModal()">取消</button>'
    +     '<button class="btn btn-primary" onclick="confirmSchedule()">确认 · 排期</button>'
    +   '</div>'
    + '</div></div>';
}

function confirmSchedule(){
  var sel = document.getElementById('sched-sel').value;
  var c = CARDS.find(function(x){return x.id===state.scheduleId;});
  if(!c){ closeModal(); return; }
  var parts = sel.split(':');
  c.col='Todo';
  if(parts[0]==='week'){ c.week_of=parts[1]; c.plan_version=''; }
  else { c.plan_version=parts[1]; c.week_of=''; }
  closeModal();
}
function createVersionModal(){
  var unassigned = CARDS.filter(function(x){return x.col==='Backlog';});
  var checks = unassigned.map(function(c){
    return '<label class="check-row"><input type="checkbox" value="'+c.id+'"><span>#'+c.num+' '+esc(c.title)+'</span></label>';
  }).join('') || '<div class="cfg-readonly-note">当前没有未排期的活可划归。</div>';
  return '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">'
    + '<div class="modal plan-modal" style="max-width:480px;">'
    +   '<div class="plan-modal-head">'
    +     '<div class="plan-modal-tag">版本</div>'
    +     '<div class="plan-modal-title">'+icon('package',16)+' 创建版本</div>'
    +     '<button class="plan-modal-x" onclick="closeModal()">'+icon('close',16)+'</button>'
    +   '</div>'
    +   '<div class="plan-modal-body cv-form">'
    +     '<div class="formrow"><label class="label">版本名 <span class="asterisk">*</span></label>'
    +       '<input id="cv-name" class="input" placeholder="例如 MVP收尾" oninput="syncCvRange()"></div>'
    +     '<div class="formrow"><label class="label">时间</label>'
    +       '<div class="cv-field-2">'
    +         '<div><span class="sub">开始 <span class="asterisk">*</span></span><input id="cv-start" class="input" type="date" oninput="syncCvRange()"></div>'
    +         '<div><span class="sub">结束 <span class="asterisk">*</span></span><input id="cv-end" class="input" type="date" oninput="syncCvRange()"></div>'
    +       '</div>'
    +       '<div id="cv-range-err" class="field-err" style="display:none;">开始不能晚于结束</div></div>'
    +     '<div class="formrow"><label class="label">说明</label>'
    +       '<textarea id="cv-note" class="input" placeholder="这个版本要收口什么"></textarea></div>'
    +     '<div class="formrow"><label class="label">划归的 issue</label>'
    +       '<div class="check-list">'+checks+'</div></div>'
    +   '</div>'
    +   '<div class="plan-modal-foot">'
    +     '<span class="cv-foot-hint">人起名的版本,和每周一出现的周版本是同一类东西;与发版号(如 v0.4)不是一回事。</span>'
    +     '<div style="display:flex;gap:var(--space-2);">'
    +       '<button class="btn btn-secondary" onclick="closeModal()">取消</button>'
    +       '<button id="cv-create" class="btn btn-primary" onclick="confirmCreateVersion()" disabled>创建</button>'
    +     '</div>'
    +   '</div>'
    + '</div></div>';
}
function syncCvRange(){
  var name = document.getElementById('cv-name');
  var start = document.getElementById('cv-start');
  var end = document.getElementById('cv-end');
  var err = document.getElementById('cv-range-err');
  var btn = document.getElementById('cv-create');
  if(!start || !end || !err || !btn) return;
  var bad = start.value && end.value && start.value > end.value;
  start.classList.toggle('invalid', bad);
  end.classList.toggle('invalid', bad);
  err.style.display = bad ? 'block' : 'none';
  btn.disabled = !name || !name.value.trim() || !start.value || !end.value || bad;
}
function confirmCreateVersion(){
  var name = document.getElementById('cv-name').value.trim();
  var start = document.getElementById('cv-start').value;
  var end = document.getElementById('cv-end').value;
  if(!name || !start || !end || start > end){ return; }
  var note = document.getElementById('cv-note').value.trim();
  var picked = [];
  document.querySelectorAll('.check-list input[type=checkbox]:checked').forEach(function(cb){
    picked.push(cb.value);
  });
  var v = { name:name, note:note, start:start, end:end, issues:picked };
  PROJECT.plan_versions.push(v);
  picked.forEach(function(id){
    var c = CARDS.find(function(x){return x.id===id;});
    if(c){ c.col='Todo'; c.plan_version=name; c.week_of=''; }
  });
  closeModal();
}
function closeModal(){ state.modal=null; state.scheduleId=null; state.startId=null; render(); }

function render(){
  document.getElementById('week-rail').innerHTML = weekRail();
  document.getElementById('plan-mid').innerHTML = midBar();
  var grid = document.getElementById('plan-grid');
  grid.classList.remove('has-detail');
  var old = grid.querySelector('.plan-detail');
  if(old) old.remove();
  document.getElementById('detail-slot').innerHTML = state.selId ? detail() : '';
  var slot = document.getElementById('modal-slot');
  if(state.modal==='schedule') slot.innerHTML = scheduleModal();
  else if(state.modal==='createVersion') slot.innerHTML = createVersionModal();
  else if(state.modal==='newIssue') slot.innerHTML = newIssueModal();
  else if(state.modal==='start') slot.innerHTML = startModal();
  else slot.innerHTML = '';
  var sess = document.getElementById('session-slot');
  if(sess) sess.innerHTML = state.screen==='session' ? sessionView() : '';
  restoreListSearch();
}

function setView(v, week){ state.view=v; if(week) state.week=week; state.selId=null; render(); }
function selectCard(id){ state.selId = id; render(); }

hydrateStaticIcons();
render();
</script>
