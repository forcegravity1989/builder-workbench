<!DOCTYPE html>
<html data-proto="v4-hifi" data-version="7" lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builders' Workbench</title>
<style>
:root{
  --paper:#EFEBE2; --rail-bg:#E9E3D7; --clay:#C5654A; --clay-dim:#e2b2a4;
  --card:#FBFAF6; --card-alt:#F4F0E7; --border:#E2DCCF; --border-deep:#DBD4C5;
  --ink:#23211C; --ink-2:#57534A; --ink-3:#8C867A; --ink-4:#A19B8D;
  --agent:#5A4E7A; --alert-deep:#A33D29;
  --green:#6B8E5A; --amber:#D3A24A; --red:#C0463A; --gray:#9A9590;
  --up:#5F7355; --down:#B0503A; --warn-text:#B5862F;
  --shadow:0 8px 26px rgba(35,33,28,.08);
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  --sans:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
::selection{background:#E7CFC4;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#D8D1C2;border-radius:6px;border:3px solid var(--paper);}
::-webkit-scrollbar-track{background:transparent;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;font-size:13px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;color:var(--ink);}
textarea{resize:vertical;}
input:focus,textarea:focus,select:focus{outline:1.5px solid var(--clay);outline-offset:0;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;margin:0 0 8px;}

/* ---------- atoms ---------- */
.mono{font-family:var(--mono);}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;line-height:16px;white-space:nowrap;background:#EFE9DA;color:var(--ink-2);}
.chip-clay{background:var(--clay);color:#fff;}
.chip-outline{background:transparent;border:1px solid var(--clay);color:var(--clay);}
.chip-green{background:#E7EDE2;color:#4A5E42;}
.chip-red{background:#F3DFD8;color:var(--alert-deep);}
.chip-gray{background:#EFEADF;color:var(--ink-3);}
.btn{cursor:pointer;background:#fff;border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:7px 14px;font-size:12.5px;white-space:nowrap;}
.btn:hover{border-color:var(--clay);color:var(--clay);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:disabled:hover{border-color:var(--border);color:var(--ink);}
.btn-primary{cursor:pointer;background:var(--clay);border:1px solid var(--clay);color:#fff;border-radius:8px;padding:9px 20px;font-size:13.5px;font-weight:500;}
.btn-primary:hover{background:#B1573F;}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;background:#B89A8E;border-color:#B89A8E;}
.btn-sm{padding:4px 10px;font-size:11.5px;border-radius:6px;}
.btn-ghost{background:transparent;border:1px solid transparent;}
.btn-ghost:hover{background:#EFE9DA;border-color:transparent;color:var(--ink);}
.btn-danger{background:var(--alert-deep);color:#fff;border:1px solid var(--alert-deep);}
.btn.active{background:var(--clay);color:#fff;border-color:var(--clay);}
.input,.textarea,select.select{width:100%;background:#FFFDF8;border:1px solid var(--border-deep);border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.5;font-family:inherit;}
.textarea{resize:vertical;min-height:44px;}
.label{font-size:11.5px;color:var(--ink-3);margin:0 0 5px;display:block;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}
.dot-lg{width:13px;height:13px;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.32;}}
.dot-run{animation:pulse 1.2s ease-in-out infinite;}
.asterisk{color:var(--clay);font-weight:700;}
.spacer{flex:1;}
.hidden{display:none !important;}

/* ---------- shell ---------- */
#app{display:flex;height:100vh;overflow:hidden;background:var(--paper);}
.iconrail{width:64px;flex:0 0 64px;background:var(--rail-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;}
.rail-logo{width:34px;height:34px;border-radius:9px;background:var(--clay);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:17px;margin-bottom:10px;flex:none;}
.rail-btn{width:40px;height:40px;border:none;border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink-3);}
.rail-btn svg{width:19px;height:19px;}
.rail-btn:hover{background:#DED5C2;}
.rail-btn.active{background:#DED5C2;color:var(--ink);}

.projectrail{width:198px;flex:0 0 198px;background:var(--rail-bg);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.pr-back{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 2px;}
.pr-back svg{width:13px;height:13px;}
.pr-back:hover{color:var(--clay);}
.pr-head{padding-bottom:10px;border-bottom:1px solid var(--border);}
.pr-head-name{font-family:var(--serif);font-weight:700;font-size:14.5px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pr-head-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3);font-family:var(--mono);}
.pr-nav{display:flex;flex-direction:column;gap:2px;}
.pr-link{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer;}
.pr-link svg{width:15px;height:15px;flex:none;}
.pr-link:hover{background:#DED5C2;}
.pr-link.active{background:var(--clay);color:#fff;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:52px;flex:0 0 52px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;padding:0 18px;gap:12px;}
.topbar-title{font-family:var(--serif);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.demo-tag{font-size:10.5px;color:var(--ink-3);background:transparent;border:1px solid var(--border);border-radius:999px;padding:2px 10px;white-space:nowrap;}
.avatar-chip{width:26px;height:26px;border-radius:50%;background:var(--clay);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;}
.pr-badge{margin-left:auto;background:var(--clay);color:#fff;font-size:10px;border-radius:8px;padding:0 5px;min-width:14px;text-align:center;line-height:16px;flex:none;}
.env-help{color:var(--clay);cursor:pointer;font-size:11px;margin-left:2px;}
.env-help:hover{text-decoration:underline;}
.content{flex:1;overflow-y:auto;padding:20px 24px 60px;min-width:0;}

/* ---------- wall ---------- */
[data-screen="wall"]{max-width:1300px;}
.wall-topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.wall-topline h1{font-size:21px;margin:0;}
.envbar,.healthbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:11px 16px;margin-bottom:11px;}
.bar-label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;flex:none;}
.env-item{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
.env-item.fail{color:var(--alert-deep);}
.health-group{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;}
.wall-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:15px 17px;cursor:pointer;}
.pcard:hover{border-color:var(--clay);}
.pcard-top{display:flex;align-items:center;gap:6px;margin-bottom:11px;}
.pcard-x{margin-left:auto;background:transparent;border:none;color:var(--ink-3);font-size:14px;padding:0 0 0 6px;}
.pcard-x:hover{color:var(--alert-deep);}
.pcard-name{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:5px;}
.pcard-oneliner{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-bottom:9px;min-height:19px;}
.pcard-meta{font-size:11.5px;color:var(--ink-3);margin-bottom:9px;display:flex;gap:13px;flex-wrap:wrap;}
.pcard-bar{height:6px;border-radius:3px;background:#E6E0D2;overflow:hidden;}
.pcard-bar-fill{height:100%;background:var(--clay);border-radius:3px;}
.pcard-del{margin-top:11px;padding-top:11px;border-top:1px dashed var(--ink-3);display:flex;align-items:center;gap:8px;font-size:11.5px;}
.newcard{border:1.6px dashed var(--border-deep);border-radius:10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--ink-3);}
.newcard:hover{border-color:var(--clay);}
.newcard .plus{font-size:24px;color:var(--clay);}

/* ---------- onboard ---------- */
[data-screen="onboard"]{max-width:880px;}
.ob-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.ob-cards{display:flex;flex-direction:column;gap:14px;}
.ob-card{padding:17px 19px;}
.ob-card h3{font-size:14.5px;margin-bottom:11px;}
.tabrow{display:flex;gap:6px;margin-bottom:11px;}
.pillrow{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap;}
.pill{padding:6px 14px;border-radius:15px;border:1px solid var(--border-deep);font-size:12.5px;cursor:pointer;background:#fff;color:var(--ink-2);}
.pill.active{border:1.5px solid var(--clay);color:var(--clay);font-weight:600;}
.repolist{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto;margin-top:8px;}
.repo-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:12.5px;}
.repo-row:hover{border-color:var(--clay);}
.repo-row.sel{border-color:var(--clay);background:#FBEEE9;}
.formrow{margin-bottom:11px;}
.formgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.probe3{display:flex;gap:16px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--ink-3);flex-wrap:wrap;}
.ob-actions{display:flex;justify-content:flex-end;margin-top:2px;gap:8px;}

/* ---------- settings ---------- */
[data-screen="settings"]{max-width:640px;}
.settings-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);gap:12px;}
.settings-row:last-child{border-bottom:none;}
.settings-row .k{font-size:13px;font-weight:600;}
.settings-row .v{font-size:12px;color:var(--ink-3);}

/* ---------- overview ---------- */
[data-screen="overview"]{max-width:1120px;}
.ov-stack{display:flex;flex-direction:column;gap:14px;}
.ov-banner{background:#FBEEE9;border:1px solid var(--clay-dim);border-radius:9px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;flex-wrap:wrap;gap:8px;}
.ov-block{padding:16px 18px;}
.ov-block1{display:flex;gap:22px;flex-wrap:wrap;}
.ov-block1 .info{flex:1.7;min-width:280px;}
.ov-block1 .health{flex:1;min-width:230px;padding-left:22px;border-left:1px solid var(--border);}
@media (max-width:760px){ .ov-block1 .health{border-left:none;padding-left:0;border-top:1px dashed var(--border);padding-top:14px;} }
.ov-block-title{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px;}
.ov-row{display:flex;gap:14px;flex-wrap:wrap;}
.ov-row .mcard{flex:1;min-width:200px;}
.repo-metric-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.repo-metric-head h3{font-family:var(--serif);font-size:15px;margin:0;}
.repo-metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;}
.repo-metric-item{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 11px;}
.repo-metric-item .v{font-family:var(--mono);font-weight:700;font-size:16px;}
.repo-metric-item .k{font-size:10.3px;color:var(--ink-3);margin-top:2px;}
.week-counts{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin:2px 0 10px;flex-wrap:wrap;}
.week-counts b{font-family:var(--mono);color:var(--ink);}
.ops-chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px;}

.charter-name{font-family:var(--serif);font-size:19px;font-weight:700;margin-bottom:6px;}
.charter-line{font-size:12.8px;color:var(--ink-2);margin-bottom:5px;line-height:1.5;}
.charter-line .k{color:var(--ink-3);font-size:11px;margin-right:4px;}
.charter-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);align-items:center;}
.mr-banner{margin-top:11px;background:#F3E3C4;border:1px solid #E3C78F;border-radius:8px;padding:8px 12px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}

.health-big{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.health-word{font-weight:700;font-size:15px;font-family:var(--serif);}
.health-reasons{display:flex;flex-direction:column;gap:4px;}
.health-reason{display:flex;gap:7px;font-size:12.3px;padding:5px 6px;border-radius:6px;cursor:pointer;}
.health-reason:hover{background:#EEE6D3;}
.health-reason .mark{flex:none;}

.metric-col{flex:1;display:flex;flex-direction:column;gap:8px;min-width:190px;}
.metric-col-title{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}
.mcard{background:#fff;border:1px solid var(--border);border-radius:9px;padding:11px 13px;}
.mcard.gray{background:#F1EEE4;}
.mcard.north{border-left:4px solid var(--clay);}
.mcard-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.mcard-name{font-family:var(--serif);font-size:13px;font-weight:600;flex:1;min-width:0;}
.mcard-name.big{font-size:15px;}
.mcard-value-row{display:flex;align-items:baseline;gap:6px;margin-bottom:3px;}
.mcard-value{font-family:var(--mono);font-weight:700;font-size:19px;}
.mcard-value.big{font-size:23px;}
.mcard-target{font-family:var(--mono);font-size:11.3px;color:var(--ink-3);}
.mcard-sub{font-size:10.3px;color:var(--ink-3);}
.mcard-driven{margin-top:7px;display:flex;gap:4px;flex-wrap:wrap;}
.badge-manual{display:inline-block;font-size:9.5px;background:#E7E0CF;border-radius:4px;padding:0 5px;margin-left:4px;color:var(--ink-3);}

.week-goal{font-size:13.2px;margin-bottom:8px;}
.week-progress{height:10px;border-radius:5px;overflow:hidden;display:flex;border:1px solid var(--border);margin-bottom:10px;}

.version-cols{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:9px;}
.version-col .k{font-size:11px;color:var(--ink-3);}
.version-col .v{font-family:var(--mono);font-size:15px;font-weight:700;}
.release-line{font-size:11.3px;color:var(--ink-3);margin-top:3px;}
.repostats{font-size:11px;color:var(--ink-3);margin-top:10px;padding-top:9px;border-top:1px solid var(--border);font-family:var(--mono);line-height:1.7;}

/* ---------- plan ---------- */
[data-screen="plan"]{height:calc(100vh - 92px);max-width:1560px;}
.plan-grid{display:flex;flex-direction:column;height:100%;min-height:0;}
.plan-col{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow-y:auto;padding:12px;}
.plan-allrow{padding:7px 9px;border-radius:7px;font-size:12.5px;cursor:pointer;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;}
.plan-allrow:hover{background:#EEE6D3;}
.plan-allrow.active{background:var(--clay);color:#fff;}
.plan-weekrow{padding:7px 9px;border-radius:7px;font-size:12.5px;cursor:pointer;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;}
.plan-weekrow:hover{background:#EEE6D3;}
.plan-weekrow.active{background:var(--clay);color:#fff;}
.plan-weekgroup{margin:10px 0 4px;font-size:11px;letter-spacing:.4px;color:var(--ink-3);}
.chip-muted{background:#E4DCCB;color:var(--ink-3);font-size:10.5px;padding:1px 5px;border-radius:5px;}
.plan-weekrow.active .chip-muted{background:rgba(255,255,255,.25);color:#fff;}
.plan-versionsel{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.plan-mid{display:flex;flex-direction:column;min-width:0;height:100%;background:transparent;border:none;box-shadow:none;padding:0;overflow:visible;}
.plan-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:10px;flex-wrap:wrap;flex:none;}
.plan-toolbar .left{font-size:14px;font-family:var(--serif);font-weight:700;}
.plan-toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.switch{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);cursor:pointer;user-select:none;}
.goal-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13.2px;margin-bottom:9px;flex:none;}
.filter-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;flex:none;}
.filter-bar select,.filter-bar input{padding:5px 8px;font-size:11.5px;border:1px solid var(--border);border-radius:6px;background:#fff;}
.filter-bar input{width:150px;}
.detail-empty{font-size:12.5px;color:var(--ink-3);padding:16px 4px;}
.detail-title{font-size:15px;font-weight:700;font-family:var(--serif);margin-bottom:10px;}
.detail-row{margin-bottom:9px;font-size:12.5px;}
.detail-row .k{font-size:10.5px;color:var(--ink-3);margin-bottom:2px;}
.detail-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;}

.kanban{flex:1;display:flex;gap:11px;min-height:0;overflow-x:auto;padding-bottom:4px;}
.kanban-col{flex:1 1 0;min-width:186px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;overflow-y:auto;transition:background .12s,outline .12s;}
.kanban-col.kanban-col-droppable{outline:2px dashed var(--clay);outline-offset:-2px;background:#FBEEE9;}
.kanban-col.kanban-col-noDrop{outline:2px dashed var(--ink-4);outline-offset:-2px;opacity:.72;}
.kanban-col-head{font-size:11.3px;color:var(--ink-3);margin-bottom:8px;flex:none;}
.kanban-col-def{font-size:9.3px;color:var(--ink-4);font-weight:400;margin-top:2px;line-height:1.4;}
.kcard{background:#fff;border:1px solid var(--border);border-left:3px solid var(--border-deep);border-radius:8px;padding:10px 11px;margin-bottom:8px;flex:none;}
.kcard[draggable="true"]{cursor:grab;}
.kcard.dragging{opacity:.4;}
.kcard-top{font-family:var(--mono);font-size:10.6px;color:var(--ink-3);display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.kcard-title{font-size:12.6px;color:var(--ink);margin-bottom:8px;line-height:1.4;cursor:pointer;}
.kcard-title:hover{color:var(--clay);}
.kcard-actions{display:flex;gap:10px;flex-wrap:wrap;font-size:11.3px;}
.kcard-actions button{background:transparent;border:none;padding:0;font-size:11.3px;cursor:pointer;font-family:inherit;}
.kcard-actions button:hover{text-decoration:underline;}
.plan-detail{position:fixed;top:52px;right:0;bottom:0;width:360px;background:var(--card);border-left:1px solid var(--border);box-shadow:var(--shadow);z-index:55;display:flex;flex-direction:column;}
.plan-detail-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex:none;}
.plan-detail-body{flex:1;overflow-y:auto;padding:16px 18px;}

/* ---------- session (Orca-style) ---------- */
[data-screen="session"]{height:calc(100vh - 92px);max-width:1600px;}
.sess-grid{display:flex;flex-direction:column;height:100%;min-height:0;}
.sess-grid .sess-left{width:216px;}
.sess-grid .sess-right{width:264px;}
.sess-grid .sess-left.is-collapsed,.sess-grid .sess-right.is-collapsed{width:40px;}
.sess-rail{flex:1;border:none;background:transparent;color:var(--ink-2);cursor:pointer;writing-mode:vertical-rl;letter-spacing:.12em;font-size:14px;padding:18px 0;min-width:40px;}
.sess-rail-toggle{min-width:36px;min-height:36px;font-size:20px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);}
.guide-panel{width:min(760px,92vw);}
.guide-frame{flex:1;border:none;width:100%;min-height:0;}
.sess-col{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.sess-left-scroll{overflow-y:auto;padding:9px;flex:1;}
.sess-group-label{font-size:10.3px;color:var(--ink-3);font-family:var(--mono);padding:9px 6px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sess-row{display:flex;align-items:flex-start;gap:8px;padding:8px 8px;border-radius:8px;cursor:pointer;margin-bottom:2px;}
.sess-row:hover{background:#EEE6D3;}
.sess-row.sel{background:var(--clay);color:#fff;}
.sess-row .dot{margin-top:4px;}
.sess-row .body{flex:1;min-width:0;}
.sess-row .ttl{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sess-row .sub{font-size:10.3px;color:var(--ink-3);margin-top:1px;}
.sess-row.sel .sub{color:rgba(255,255,255,.78);}
.sess-addnew{font-size:10.3px;color:var(--ink-3);padding:3px 8px 8px;cursor:pointer;}
.sess-addnew:hover{color:var(--clay);}
.sess-mid{min-width:0;}
.sess-actionbar{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--border);background:#FBF8EF;flex-wrap:wrap;flex:none;}
.sess-actionbar .ttl{font-weight:700;font-size:13px;flex:1;min-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sess-tabs{display:flex;gap:2px;padding:7px 8px 0;border-bottom:1px solid var(--border);flex:none;overflow-x:auto;}
.sess-tab{padding:6px 12px;font-size:11.3px;border-radius:7px 7px 0 0;cursor:pointer;color:var(--ink-3);white-space:nowrap;display:flex;align-items:center;gap:6px;}
.sess-tab.active{background:#fff;color:var(--ink);border:1px solid var(--border);border-bottom-color:#fff;margin-bottom:-1px;}
.sess-tab .x{opacity:.5;padding:0 2px;}
.sess-tab .x:hover{opacity:1;color:var(--alert-deep);}
.sess-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:9px;}

.terminal{flex:1;background:#1c1b19;border-radius:9px;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.term-titlebar{background:#2a2825;color:#c9c5b8;font-size:11px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);flex:none;gap:10px;}
.term-titlebar .copybtn{background:transparent;border:1px solid #4c4a44;color:#c9c5b8;border-radius:5px;padding:2px 8px;font-size:10.5px;}
.term-titlebar .copybtn:hover{border-color:var(--amber);color:var(--amber);}
.term-body{flex:1;overflow-y:auto;padding:11px 13px;font-family:var(--mono);font-size:12px;color:#d8d4c6;white-space:pre-wrap;word-break:break-word;user-select:text;}
.term-line{margin-bottom:4px;}
.term-line.sys{color:#8f9c7b;}
.term-line.agent{color:#e3b479;}
.term-line.human{color:#8fb3d9;}
.term-line.git{color:#7fbf8a;}
.term-idle{color:#77746a;}
.term-input-row{display:flex;gap:8px;padding:8px 11px;border-top:1px solid #38352f;flex:none;}
.term-input-row input{flex:1;background:#100f0e;border:1px solid #3c3a34;border-radius:6px;color:#e5e1d4;padding:6px 9px;font-family:var(--mono);font-size:12px;}
.term-input-row input:focus{outline:1px solid var(--amber);}

.codeview{flex:1;background:#fff;border:1px solid var(--border);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.codeview-head{background:var(--card-alt);padding:6px 12px;font-family:var(--mono);font-size:11px;color:var(--ink-3);border-bottom:1px solid var(--border);flex:none;}
.codeview-body{flex:1;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.7;padding:4px 0;}
.codeline{display:flex;}
.codeline .ln{flex:none;width:38px;text-align:right;padding-right:10px;color:var(--ink-4);user-select:none;}
.codeline .src{flex:1;white-space:pre;padding-right:12px;}
.tok-kw{color:#8B4A9C;}
.tok-str{color:#B0764A;}
.tok-com{color:var(--ink-3);font-style:italic;}

.diffview{flex:1;background:#fff;border:1px solid var(--border);border-radius:9px;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.7;}
.diffline{padding:1px 12px;white-space:pre;}
.diffline.add{background:#E9F1E3;color:#3E5A32;}
.diffline.del{background:#F7E4DE;color:var(--alert-deep);}
.diffline.ctx{color:var(--ink-3);}

.od-embed{flex:1;border:1px solid var(--border);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;background:#fff;}
.od-embed-head{background:var(--rail-bg);padding:6px 12px;font-size:11px;font-family:var(--mono);color:var(--ink-3);border-bottom:1px solid var(--border);}
.od-embed-canvas{flex:1;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf7ee,#faf7ee 12px,#f2eede 12px,#f2eede 24px);color:var(--ink-3);font-size:13px;flex-direction:column;gap:8px;}

.sess-right-scroll{overflow-y:auto;padding:11px;flex:1;}
.sr-h{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;}
.sr-h:first-child{margin-top:0;}
.tree-node{font-family:var(--mono);font-size:11.3px;line-height:1.85;cursor:pointer;display:flex;align-items:center;gap:4px;border-radius:4px;}
.tree-node:hover{background:#EEE6D3;}
.tree-node.dir{color:var(--ink-2);}
.tree-node.file{color:var(--ink);}
.tree-node.changed{color:var(--clay);font-weight:600;}
.tree-arrow{width:11px;display:inline-block;color:var(--ink-3);flex:none;}
.changed-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.8px;padding:3px 2px;border-bottom:1px dashed var(--border);cursor:pointer;}
.changed-row:hover{color:var(--clay);}
.diffnum .plus{color:var(--up);}
.diffnum .minus{color:var(--down);margin-left:4px;}
.git-box{font-family:var(--mono);font-size:11.3px;background:#fff;border:1px solid var(--border);border-radius:7px;padding:8px 10px;line-height:1.8;}
.mr-card{margin-top:8px;font-size:12px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 10px;}
.mr-card .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}

/* ---------- plan: kanban segments / list view / centered modal ---------- */
.status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}
.status-dot.dot-gray{background:var(--gray);}
.status-dot.dot-amber{background:var(--amber);}
.status-dot.dot-amber.dot-run{animation:pulse 1.2s ease-in-out infinite;}
.status-dot.dot-green{background:var(--green);}
.status-dot.dot-red{background:var(--red);}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--clay);color:#fff;font-size:10px;font-weight:700;flex:none;}
.avatar-sm{width:18px;height:18px;font-size:9.5px;}
.kanban-col.col-todo{border-left:3px solid var(--gray);}
.kanban-col.col-doing{border-left:3px solid var(--amber);}
.kanban-col.col-pending{border-left:3px solid var(--clay);}
.kanban-col.col-done{border-left:3px solid var(--green);}
.kanban-col-head .count{margin-left:6px;font-family:var(--mono);color:var(--ink-3);}
.kanban-segtabs{display:flex;gap:4px;margin-bottom:8px;flex:none;flex-wrap:wrap;}
.seg-tab{padding:3px 9px;border-radius:6px;font-size:10.8px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink-3);}
.seg-tab.active{background:var(--clay);color:#fff;border-color:var(--clay);}
.seg-tab .seg-count{margin-left:4px;opacity:.7;}
.kanban-seg-box{flex:1;min-height:0;overflow-y:auto;}
.kanban-empty{font-size:11.3px;color:var(--ink-4);padding:10px 4px;text-align:center;}
.kcard-src{font-size:9.5px;background:#EFE9DA;color:var(--ink-3);border-radius:4px;padding:0 5px;}
.kcard-desc{font-size:11.5px;color:var(--ink-2);margin-bottom:6px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kcard-place{font-size:10.8px;color:var(--ink-3);margin-bottom:6px;font-family:var(--mono);}
.kcard-folder{margin-right:3px;}
.kcard-foot{display:flex;align-items:center;justify-content:space-between;font-size:10.8px;color:var(--ink-3);}
.kcard-who{display:flex;align-items:center;gap:5px;}
.kcard-ago{font-family:var(--mono);}
.il-wrap{flex:1;display:flex;flex-direction:column;min-height:0;}
.il-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;flex:none;}
.il-presets{display:flex;gap:4px;}
.il-preset{padding:5px 11px;border-radius:7px;font-size:11.5px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--ink-2);}
.il-preset.on{background:var(--clay);color:#fff;border-color:var(--clay);}
.il-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.il-dd-btn{padding:5px 8px;font-size:11.5px;border:1px solid var(--border-deep);border-radius:6px;background:#FFFDF8;}
.il-search-wrap{flex:1;min-width:120px;}
.il-search{width:100%;padding:5px 8px;font-size:11.5px;border:1px solid var(--border);border-radius:6px;background:#fff;}
.issue-list{flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:9px;background:#fff;}
.il-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px;}
.il-row:hover{background:#FAF6EA;}
.il-row.il-head{background:#FAF6EA;cursor:default;font-size:10.3px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em;}
.il-row.il-head:hover{background:#FAF6EA;}
.il-num{flex:none;width:54px;font-family:var(--mono);}
.il-idmark{display:inline-block;width:3px;height:13px;background:var(--clay);border-radius:2px;margin-right:5px;vertical-align:-2px;}
.il-title{flex:1;min-width:0;display:flex;flex-direction:column;}
.il-t1{font-size:12.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.il-t2{font-size:10.5px;color:var(--ink-3);}
.il-owner{flex:none;width:120px;display:flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.il-status{flex:none;width:78px;}
.il-pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;}
.il-pill.status-todo{background:#EFEADF;color:var(--ink-3);}
.il-pill.status-progress{background:#FBEEE9;color:var(--clay);}
.il-pill.status-review{background:#F3E3C4;color:var(--warn-text);}
.il-pill.status-done{background:#E7EDE2;color:#4A5E42;}
.il-pill.status-blocked{background:#F3DFD8;color:var(--alert-deep);}
.il-pill.status-cancelled{background:#EFEADF;color:var(--ink-4);}
.il-updated{flex:none;width:70px;font-size:10.5px;color:var(--ink-4);font-family:var(--mono);}
.il-act{flex:none;width:78px;text-align:right;}
.il-btn{background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:10.8px;cursor:pointer;color:var(--ink-2);}
.il-btn:hover{border-color:var(--clay);color:var(--clay);}
.il-btn.primary{background:var(--clay);color:#fff;border-color:var(--clay);}
.il-dash{color:var(--ink-4);}
.il-empty{padding:24px 10px;text-align:center;font-size:12px;color:var(--ink-3);}
.plan-modal{max-width:580px;}
.plan-modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.plan-modal-tag{font-family:var(--mono);font-size:10px;color:var(--ink-3);background:#EFE9DA;border-radius:5px;padding:2px 7px;flex:none;}
.plan-modal-title{font-family:var(--serif);font-size:15px;font-weight:700;flex:1;}
.plan-modal-title-input{flex:1;font-family:var(--serif);font-size:15px;font-weight:700;padding:5px 9px;}
.plan-modal-x{background:transparent;border:none;font-size:16px;color:var(--ink-3);cursor:pointer;flex:none;}
.plan-modal-x:hover{color:var(--clay);}
.plan-modal-body{margin-bottom:10px;}
.detail-body-text{min-height:54px;margin-bottom:12px;}
.plan-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
.plan-review-hint{font-size:11.3px;color:var(--ink-3);background:#FBEEE9;border:1px solid var(--clay-dim);border-radius:7px;padding:7px 10px;margin-top:6px;}
.plan-modal-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border);}
.detail-link{color:var(--clay);cursor:pointer;text-decoration:underline;}

/* ---------- session: two iframe tabs ---------- */
.sess-midhead{flex:none;}
.sess-iframe{flex:1;width:100%;min-height:0;border:1px solid var(--border);border-radius:9px;background:#fff;}
.sess-empty{margin:auto;padding:24px;max-width:520px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.8;}

/* ---------- config ---------- */
.tabbtn-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.tabbtn{padding:6px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--ink-2);}
.tabbtn.active{background:var(--clay);color:#fff;border-color:var(--clay);}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:9px;background:#fff;}
table.tbl{width:100%;border-collapse:collapse;font-size:12.2px;min-width:520px;}
table.tbl th{text-align:left;font-size:10.3px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em;padding:8px 12px;border-bottom:1px solid var(--border);background:#FAF6EA;white-space:nowrap;}
table.tbl td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.tbl tr:last-child td{border-bottom:none;}
.tglswitch{width:32px;height:18px;border-radius:9px;background:var(--border-deep);position:relative;display:inline-block;flex:none;}
.tglswitch.on{background:var(--clay);}
.tglswitch .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s;}
.tglswitch.on .knob{left:16px;}
.cfg-topbtn{display:flex;justify-content:flex-end;margin-bottom:12px;}
.cfg-readonly-note{font-size:11.3px;color:var(--ink-3);margin-top:8px;}
[data-screen="config"]{max-width:1120px;}
.cfg-section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
.cfg-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.cfg-section-head h3{font-size:14.5px;margin:0;font-family:var(--serif);}
.cfg-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.cfg-pair .cfg-section{margin-bottom:0;}
@media (max-width:760px){ .cfg-pair{grid-template-columns:1fr;} }
select.select-sm{padding:5px 7px;font-size:11.8px;border:1px solid var(--border-deep);border-radius:6px;background:#FFFDF8;}
select.select-multi{padding:3px;font-size:11.5px;border:1px solid var(--border-deep);border-radius:6px;background:#FFFDF8;min-width:130px;}

/* ---------- space ---------- */
.sp-topinfo{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;font-size:12px;}
.sp-layout{display:grid;grid-template-columns:230px 1fr;gap:14px;}
.sp-tree{padding:10px;height:fit-content;}
.sp-tree-group{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;padding:8px 8px 3px;}
.sp-tree-item{padding:7px 9px;border-radius:7px;cursor:pointer;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sp-tree-item:hover{background:#EEE6D3;}
.sp-tree-item.active{background:var(--clay);color:#fff;}
.sp-preview{background:#fff;padding:18px 20px;min-height:420px;}
.sp-preview h4{font-family:var(--serif);font-size:14.5px;margin-bottom:10px;}
.sp-preview .path{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:12px;}
.sp-preview .field{margin-bottom:9px;font-size:12.5px;}
.sp-preview .field .k{font-size:10.3px;color:var(--ink-3);}
.sp-preview pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:#FAF7EF;border:1px solid var(--border);border-radius:8px;padding:10px 12px;line-height:1.7;}

.graph-svgbox{background:#fff;border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:14px;}
.graph-lower{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.leaderboard-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.3px;padding:5px 2px;border-bottom:1px dashed var(--border);}
.symbol-result{font-family:var(--mono);font-size:11.3px;padding:7px 9px;border:1px solid var(--border);border-radius:6px;margin-bottom:5px;background:#fff;}
.symbol-result .h{color:var(--clay);font-weight:700;margin-bottom:3px;}
.graph-foot{font-size:10.3px;color:var(--ink-3);font-family:var(--mono);margin-top:8px;}

.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:10px;margin-top:8px;}
.asset-card{padding:11px 13px;display:flex;flex-direction:column;gap:6px;}
.asset-card .name{font-weight:700;font-size:12.6px;}
.asset-card .meta{font-size:10.8px;color:var(--ink-3);}
.asset-sect-title{font-size:13.3px;font-weight:700;margin:18px 0 4px;font-family:var(--serif);}
.asset-sect-title:first-child{margin-top:0;}

/* ---------- drawer / modal / toast ---------- */
.drawer-backdrop{position:fixed;inset:0;background:rgba(35,33,28,.32);z-index:60;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;background:var(--card);border-left:1px solid var(--border);box-shadow:var(--shadow);z-index:61;display:flex;flex-direction:column;}
.drawer-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.drawer-head h3{font-size:15px;margin:0;}
.drawer-close{background:transparent;border:none;font-size:16px;color:var(--ink-3);}
.drawer-close:hover{color:var(--clay);}
.drawer-body{flex:1;overflow-y:auto;padding:12px 14px;}
.drawer-item{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.drawer-item .desc{font-size:12.3px;margin-bottom:8px;line-height:1.5;}
.drawer-item .acts{display:flex;gap:6px;flex-wrap:wrap;}
.drawer-empty{font-size:12.5px;color:var(--ink-3);padding:24px 4px;text-align:center;}

.modal-backdrop{position:fixed;inset:0;background:rgba(35,33,28,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;}
.modal{background:#fff;border-radius:12px;max-width:540px;width:100%;padding:20px 22px;max-height:82vh;overflow-y:auto;}
.modal h3{font-size:15.5px;margin-bottom:14px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.check-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:520px;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

/* ---------- guide drawer (wall) ---------- */
.side-tabs{position:fixed;top:130px;right:0;z-index:57;display:flex;flex-direction:column;gap:6px;}
.guide-tab,.issue-tab{background:var(--card);border:1px solid var(--border);border-right:none;border-radius:8px 0 0 8px;padding:12px 7px;writing-mode:vertical-rl;font-size:12px;color:var(--ink-2);cursor:pointer;box-shadow:var(--shadow);letter-spacing:.05em;}
.guide-tab:hover,.issue-tab:hover{color:var(--clay);border-color:var(--clay);}

.busy-card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 28px;background:var(--paper);border:1px solid var(--border);border-radius:12px;max-width:360px;text-align:center;font-size:13px;color:var(--ink-2);line-height:1.6;box-shadow:0 8px 28px rgba(0,0,0,.08);}

function allIssuesArr(pid){ var m=getIssues(pid); return Object.keys(m).map(function(k){return m[k];}); }

function findInboxItem(pid,id){ return getInbox(pid).filter(function(x){return x.id===id;})[0]||null; }
function weekProgress(pid,week){
  var issues=allIssuesArr(pid).filter(function(i){return i.kind==='business'&&i.week===week;});
  var c={todo:0,doing:0,review:0,done:0};
  issues.forEach(function(i){
    if(i.status==='done')c.done++; else if(i.status==='doing')c.doing++;
    else if(i.status==='review'||i.status==='merged')c.review++; else c.todo++;
  });
  return c;
}
function opsIssuesFor(pid){ return allIssuesArr(pid).filter(function(i){return i.kind==='ops';}); }
function opsChipsHTML(pid){
  var all=opsIssuesFor(pid);
  var nums=['①','②','③'];
  return ['ops1','ops2','ops3'].map(function(prefix,idx){
    var iss=all.filter(function(o){return o.id.indexOf(prefix)===0;})[0];
    if(!iss) return '';
    return '<span class="chip mono" data-issue="'+iss.id+'" data-action="goSession" data-arg=\'["'+pid+'","'+iss.id+'"]\' style="cursor:pointer;border-left:3px solid var(--'+STATUS_DOT[iss.status]+');">'+nums[idx]+' '+esc(STATUS_LABEL[iss.status])+'</span>';
  }).join('');
}

function onIssueCompleted(pid,issue){
  if(issue.category==='运作' && /运作活①/.test(issue.title)){
    var wk=issue.week||CURRENT_WEEK;
    state.weekPlans[pid]=state.weekPlans[pid]||{};
    if(!state.weekPlans[pid][wk]){ state.weekPlans[pid][wk]={goal:'(演示)已由运作活①产出版本目标',version:getProject(pid).version}; }
  }
  if(issue.kind==='release'){
    state.releases[pid]=state.releases[pid]||[];
    state.releases[pid].push({version:issue.releaseVersion||issue.version,date:TODAY,note:issue.releaseNote||'',issues:issue.releaseIssues||[]});
  }
}
function mergeIssueGeneric(pid,issueId){
  var issue=getIssue(pid,issueId); if(!issue)return;
  issue.status='merged'; if(issue.mr)issue.mr.status='merged';
  if(issue.kind==='charter'&&issue.draft){
    var proj=getProject(pid); var d=issue.draft;
    Object.assign(proj.card,{name:d.name||proj.card.name,intent:d.intent,benchmark:d.benchmark,northstar:d.northstar});
    if(typeof d.version==='string') proj.version=d.version;
    if(typeof d.chatProvider==='string'){
      state.chatGroup[pid]={configured:!!d.chatProvider,provider:d.chatProvider||'welink',kind:'internal',groupId:d.chatGroup||'',sync:d.chatSync||{review:true,merged:true,release:true}};
    }
  }
  (issue.metricIds||[]).forEach(function(mid){ var m=getMetric(pid,mid); if(m&&typeof m.current==='number'){ m.current+=1; } });

function kanbanOrderArr(pid,col){ state.kanbanOrder=state.kanbanOrder||{}; state.kanbanOrder[pid]=state.kanbanOrder[pid]||{}; state.kanbanOrder[pid][col]=state.kanbanOrder[pid][col]||[]; return state.kanbanOrder[pid][col]; }
function removeFromOrder(pid,col,id){ var arr=kanbanOrderArr(pid,col); var i=arr.indexOf(id); if(i>=0)arr.splice(i,1); }
function insertIntoOrder(pid,col,id,beforeId){
  var arr=kanbanOrderArr(pid,col); var i=arr.indexOf(id); if(i>=0)arr.splice(i,1);
  if(beforeId && beforeId!==id){ var bi=arr.indexOf(beforeId); if(bi>=0){ arr.splice(bi,0,id); return; } }
  arr.push(id);
}
function sortByOrder(pid,col,items){
  var order=(state.kanbanOrder&&state.kanbanOrder[pid]&&state.kanbanOrder[pid][col])||[];
  if(!order.length) return items;
  var idx={}; order.forEach(function(id,i){ idx[id]=i; });
  return items.slice().sort(function(a,b){
    var ai=idx.hasOwnProperty(a.id)?idx[a.id]:9999, bi=idx.hasOwnProperty(b.id)?idx[b.id]:9999;
    return ai-bi;
  });
}
var KANBAN_ILLEGAL_REASON={

function kanbanLegal(fromSeg,toSeg){ if(fromSeg===toSeg)return true; return (KANBAN_LEGAL[fromSeg]||[]).indexOf(toSeg)>=0; }
function openKanbanConfirm(kind,pid,issueId,fromCol,toCol){
  state.ui.modal={type:'kanban-confirm',kind:kind,pid:pid,issueId:issueId,fromCol:fromCol,toCol:toCol,reason:''};
  render();
}
function handleKanbanDrop(pid,issueId,fromSeg,toSeg,overId){
  var issue=getIssue(pid,issueId); if(!issue)return;
  if(fromSeg===toSeg){ insertIntoOrder(pid,toSeg,issueId,overId===issueId?null:overId); render(); return; }
  if(!kanbanLegal(fromSeg,toSeg)){
    var reason=KANBAN_ILLEGAL_REASON[fromSeg+'>'+toSeg]||'状态不允许这样跳转';
    toast((SEG_LABEL[fromSeg]||fromSeg)+' → '+(SEG_LABEL[toSeg]||toSeg)+' 不允许:'+reason);
    render();
    return;
  }
  // 排期/取消排期:unassigned↔assigned(只改 week,不改状态机)
  if((fromSeg==='unassigned'&&toSeg==='assigned')||(fromSeg==='assigned'&&toSeg==='unassigned')){
    var wk=state.ui.planLeft[pid];
    if(!wk||wk==='all'||/^version:/.test(wk)) wk=CURRENT_WEEK;
    else if(/^week:/.test(wk)) wk=wk.slice(5);
    if(toSeg==='assigned'){ issue.status='todo'; issue.week=wk; toast('已排进 2026-'+wk); }
    else { issue.status='pool'; issue.week=''; toast('已移出本周,回到未排期'); }
    removeFromOrder(pid,fromSeg,issueId);
    insertIntoOrder(pid,toSeg,issueId,overId===issueId?null:overId);
    render();
    return;
  }
  var kind = toSeg==='doing' ? (fromSeg==='blocked'?'unblock':'start') : toSeg==='done' ? 'done' : toSeg==='blocked' ? 'block' : toSeg==='cancelled' ? 'reject' : toSeg==='assigned' ? 'revert' : null;
  if(!kind){ render(); return; }
  openKanbanConfirm(kind,pid,issueId,fromSeg,toSeg);
}
document.addEventListener('dragstart', function(e){
  var el=e.target.closest('.kcard[draggable="true"]'); if(!el)return;
  dragState.issueId=el.getAttribute('data-issue');
  var segEl=el.closest('.kanban-seg-box');
  dragState.fromCol=segEl?segEl.getAttribute('data-col'):null;
  el.classList.add('dragging');
  if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragState.issueId); }catch(_){} }
});
document.addEventListener('dragover', function(e){
  if(!dragState.issueId)return;
  var seg=e.target.closest('.kanban-seg-box'); if(!seg)return;
  e.preventDefault();
  var key=seg.getAttribute('data-col');
  var allowed=kanbanLegal(dragState.fromCol,key);
  var col=seg.closest('.kanban-col');
  if(col){ col.classList.remove('kanban-col-droppable','kanban-col-noDrop'); col.classList.add(allowed?'kanban-col-droppable':'kanban-col-noDrop'); }
});
document.addEventListener('dragleave', function(e){
  var seg=e.target.closest('.kanban-seg-box');
  if(seg){ var col=seg.closest('.kanban-col'); if(col && (!e.relatedTarget || !col.contains(e.relatedTarget))){ col.classList.remove('kanban-col-droppable','kanban-col-noDrop'); } }
});
document.addEventListener('drop', function(e){
  if(!dragState.issueId)return;
  var seg=e.target.closest('.kanban-seg-box'); if(!seg)return;
  e.preventDefault();
  var col=seg.closest('.kanban-col'); if(col){ col.classList.remove('kanban-col-droppable','kanban-col-noDrop'); }
  var overCard=e.target.closest('.kcard');
  var toSeg=seg.getAttribute('data-col'), pid=seg.getAttribute('data-pid');
  var overId=overCard?overCard.getAttribute('data-issue'):null;
  handleKanbanDrop(pid,dragState.issueId,dragState.fromCol,toSeg,overId);
  dragState.issueId=null; dragState.fromCol=null;
});
document.addEventListener('dragend', function(e){
  var el=e.target.closest('.kcard'); if(el)el.classList.remove('dragging');
  document.querySelectorAll('.kanban-col').forEach(function(c){ c.classList.remove('kanban-col-droppable','kanban-col-noDrop'); });
  dragState.issueId=null; dragState.fromCol=null;
});

document.addEventListener('click', function(e){
  var el=e.target.closest('[data-action]'); if(!el)return;
  var name=el.getAttribute('data-action');
  if((name==='closeModal'||name==='closeReport') && el.classList.contains('modal-backdrop') && e.target!==el) return;
  if(name==='closePlanDetail' && el.classList.contains('modal-backdrop') && e.target!==el) return;
  var raw=el.getAttribute('data-arg');
  var args=[];
  if(raw){ try{ args=JSON.parse(raw); if(!Array.isArray(args))args=[args]; }catch(_){ args=[raw]; } }
  var fn=ACTIONS[name]; if(fn) fn.apply(null,args);
});
document.addEventListener('input', function(e){

  setPath(state,bind,el.value); render();
});
document.addEventListener('change', function(e){
  var el=e.target;
  var planMove=el.getAttribute&&el.getAttribute('data-plan-move');
  if(planMove){ ACTIONS.applyPlanMove(el.getAttribute('data-pid'),el.getAttribute('data-issue'),el.value); return; }
  var setPlan=el.getAttribute&&el.getAttribute('data-set-plan');
  if(setPlan){ ACTIONS.setIssuePlan(el.getAttribute('data-pid'),el.getAttribute('data-issue'),el.value); return; }
  var bindMulti=el.getAttribute&&el.getAttribute('data-bindchange-multi');
  if(bindMulti){ var vals=Array.prototype.slice.call(el.selectedOptions).map(function(o){return o.value;}); setPath(state,bindMulti,vals); render(); return; }
  var bind=el.getAttribute&&el.getAttribute('data-bindchange'); if(!bind)return;
  setPath(state,bind,el.value); render();
});
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter')return;
  var el=e.target; if(!el.matches)return;

    var pid=el.getAttribute('data-pid'), sid=el.getAttribute('data-sid');
    ACTIONS.submitTermInput(pid,sid,el.value); el.value='';

function updateActionBar(issueId){
  var bar=document.querySelector('[data-actionbar="'+issueId+'"]'); if(!bar)return;

  Object.keys(state.issues).some(function(pid){ var i=getIssue(pid,issueId); if(i){issue=i;return true;} return false; });

  if(stop) stop.disabled=!state.ui.playing[issueId];
}

      + (isOps?'':'<div class="formrow"><label class="label">开工工具</label><select class="select" data-bindchange="ui.modal.tool"><option value="claude_cli" '+(m.tool==='claude_cli'?'selected':'')+'>Claude CLI</option><option value="open_design" '+(m.tool==='open_design'?'selected':'')+'>Open Design</option><option value="cursor" disabled>Cursor(还没接)</option></select></div>')
      + '<div class="modal-actions"><button class="btn" data-action="closeModal">取消</button><button class="btn btn-primary" data-action="confirmNewIssue">创建</button></div></div></div>';
  }
  if(m.type==='import'){
    var srcTypes=[['dir','本机目录'],['git','git 仓地址'],['project','从另一个项目']];
    var st=m.srcType||'dir';
    var srcLabel={dir:'本机目录路径',git:'git 仓地址',project:'项目名'}[st];
    return '<div class="modal-backdrop" data-action="closeModal"><div class="modal">'
      + '<h3>导入'+(m.kind==='skill'?'技能':'workflow')+'</h3>'
      + '<div class="formrow"><label class="label">名称</label><input class="input" data-bind="ui.modal.name" value="'+esc(m.name)+'"></div>'
      + '<div class="pillrow">'+srcTypes.map(function(t){return '<span class="pill '+(st===t[0]?'active':'')+'" data-action="setImportSrcType" data-arg=\'"'+t[0]+'"\'>'+t[1]+'</span>';}).join('')+'</div>'
      + '<div class="formrow"><label class="label">'+srcLabel+'</label><input class="input" data-bind="ui.modal.src" value="'+esc(m.src)+'"></div>'
      + '<div class="modal-actions"><button class="btn" data-action="closeModal">取消</button><button class="btn btn-primary" data-action="confirmImport">确认导入</button></div></div></div>';
  }
  if(m.type==='kanban-confirm'){
    var issue=getIssue(m.pid,m.issueId);
    if(!issue) return '';
    var kindMeta={
      start:{title:'开工确认',label:'开工'},
      review:{title:'推到评审中确认',label:'推到评审中'},
      done:{title:'完成确认',label:'完成'},
      block:{title:'标记阻塞',label:'确认阻塞'},
      unblock:{title:'解除阻塞',label:'解除→进行中'},
      reject:{title:'拒绝(取消)',label:'确认拒绝'},
      revert:{title:'退回待办确认',label:'退回待办'}
    }[m.kind]||{title:'确认',label:'确认'};
    var bodyHTML='<div class="detail-row"><div class="k">活</div>'+esc(issue.title)+'</div>';
    if(m.kind==='start'){
      bodyHTML+='<div class="detail-row"><div class="k">开工工具</div>'+esc(TOOL_LABEL[issue.tool]||'—')+'</div>'
        + '<div class="detail-row"><div class="k">workflow</div>'+esc(issue.workflow||'—')+'</div>';
    }
    if(m.kind==='done'){
      bodyHTML+='<div style="font-size:11.5px;color:var(--ink-3);margin:2px 0 10px;">完成永远由人点——这一下就是。</div>';
    }
    if(m.kind==='block'||m.kind==='reject'){
      bodyHTML+='<div class="formrow"><label class="label">'+(m.kind==='block'?'阻塞原因(必填)':'拒绝原因(必填)')+'</label><textarea class="textarea" data-bind="ui.modal.reason" placeholder="'+(m.kind==='block'?'写清楚卡在哪':'写清楚为什么作废')+'">'+esc(m.reason||'')+'</textarea></div>';
    }
    if(m.kind==='revert'){
      bodyHTML+='<div style="font-size:11.5px;color:var(--ink-3);margin:2px 0 10px;">从「'+esc(SEG_LABEL[m.fromCol]||m.fromCol)+'」退回「已排期(待办)」。</div>';
    }
    if(m.kind==='unblock'){
      bodyHTML+='<div style="font-size:11.5px;color:var(--ink-3);margin:2px 0 10px;">从「阻塞」解除回到「进行中」(只改标签,不开工)。</div>';
    }
    return '<div class="modal-backdrop" data-action="closeModal"><div class="modal">'
      + '<h3>'+kindMeta.title+'</h3>' + bodyHTML
      + '<div class="modal-actions"><button class="btn" data-action="closeModal">取消</button><button class="btn btn-primary" data-action="confirmKanbanAction">'+kindMeta.label+'</button></div></div></div>';
  }
  if(m.type==='delete-session'){
    return '<div class="modal-backdrop" data-action="closeModal"><div class="modal" style="max-width:420px;">'
      + '<h3>删除会话</h3>'
      + '<div style="font-size:13px;line-height:1.85;color:var(--ink-2);margin-bottom:8px;">删掉「'+esc(m.title)+'」在本机的会话和工作树。未提交的改动也会没。<br>远端 issue 不动。作废过的活不会因此重新开工。</div>'
      + '<div class="modal-actions"><button class="btn" data-action="closeModal">算了</button><button class="btn btn-primary" data-action="confirmDeleteSession">删除</button></div></div></div>';
  }
  return '';
}

/* ===================== 渲染:项目墙 ===================== */
function renderWall(){
  var order=['Workbench','jianmu','opsboard','benchmark','bridge'].filter(function(id){return !!state.projects[id];});
  var totalN=order.length;
  var counts={green:0,yellow:0,red:0,gray:0};
  order.forEach(function(id){ var l=state.projects[id].light; if(counts[l]===undefined)counts.gray++; else counts[l]++; });
  var es=state.ui.envStatus||{claude:'unknown',codehub:'unknown',od:'unknown'};
  function envItemHTML(label,status){
    var color=status==='ok'?'green':(status==='fail'?'red':'gray');
    var text=status==='ok'?'可用':(status==='fail'?'失败':'未测');
    var help=status!=='ok'?(' <span class="env-help" data-action="selectGuideChapter" data-arg=\'"env"\'>怎么处理 →</span>'):'';
    return '<span class="env-item'+(status==='fail'?' fail':'')+'">'+lightDot(color)+' '+label+' · '+text+help+'</span>';
  }
  var cards=order.map(function(pid){
    var p=state.projects[pid];
    var inbox=pid==='Workbench'?inboxCount('Workbench'):0;
    var wk=pid==='Workbench'?getPath(state,'weekPlans.Workbench.'+CURRENT_WEEK+'.goal'):null;
    var prog=pid==='Workbench'?weekProgress('Workbench',CURRENT_WEEK):{todo:1,doing:0,review:0,done:0};
    var totalIssues=prog.todo+prog.doing+prog.review+prog.done;
    var pct=totalIssues? Math.round(prog.done/totalIssues*100) : (pid==='Workbench'?0:20);
    var delConfirm=state.ui.deleteConfirm[pid];
    return '<div class="pcard" data-action="openProject" data-arg=\'"'+pid+'"\'>'
      + '<div class="pcard-top">'
      +   '<span class="chip chip-outline mono">'+esc(p.version)+'</span>'
      +   '<span class="chip">'+CURRENT_WEEK+'</span>'
      +   (inbox>0?'<span class="chip chip-clay">⚑ '+inbox+'</span>':'')
      +   '<span style="margin-left:auto;"></span>' + lightDot(p.light,true)
      +   '<button class="pcard-x" data-action="toggleDelete" data-arg=\'"'+pid+'"\'>×</button>'
      + '</div>'
      + '<div class="pcard-name">'+esc(p.name)+'</div>'
      + '<div class="pcard-oneliner">'+esc(p.oneLiner)+'</div>'
      + '<div class="pcard-meta">'
      +   (wk?('<span>版本目标:'+esc(wk.length>30?wk.slice(0,30)+'…':wk)+'</span>'):'<span>版本目标:'+(pid==='Workbench'?'—':'✱ 未展开')+'</span>')
      +   '<span>上次交付 '+esc(p.lastDelivery)+'</span>'
      + '</div>'
      + '<div class="pcard-bar"><div class="pcard-bar-fill" style="width:'+pct+'%"></div></div>'
      + (delConfirm? ('<div class="pcard-del"><span>将删除项目数据(演示)…</span><button class="btn btn-sm btn-danger" data-action="confirmDelete" data-arg=\'"'+pid+'"\'>确认删除</button><button class="btn btn-sm" data-action="toggleDelete" data-arg=\'"'+pid+'"\'>取消</button></div>') : '')
      + '</div>';
  }).join('');
  return '<section data-screen="wall">'
    + '<div class="wall-topline"><h1>项目墙</h1><button class="btn btn-primary" data-action="goOnboard">+ 接入项目</button></div>'
    + '<div class="card envbar">'
    +   '<span class="bar-label">本机环境</span>'
    +   envItemHTML('claude',es.claude)
    +   envItemHTML('codehub-cli',es.codehub)
    +   envItemHTML('Open Design',es.od)
    +   '<span class="env-item">'+lightDot('gray')+' welink-cli · 探活函数待内部补(留位)</span>'
    +   '<span style="margin-left:auto;"></span>'
    +   '<button class="btn btn-sm" data-action="testEnv" '+(state.ui.envTesting?'disabled':'')+'>'+(state.ui.envTesting?'探测中…':'测一下')+'</button>'
    + '</div>'
    + '<div class="card healthbar">'
    +   '<span class="bar-label">健康概览</span>'
    +   '<span class="health-group">'+lightDot('green')+' 平稳 '+counts.green+'</span>'
    +   '<span class="health-group">'+lightDot('yellow')+' 需要关注 '+counts.yellow+'</span>'
    +   '<span class="health-group">'+lightDot('red')+' 阻塞 '+counts.red+'</span>'
    +   '<span class="health-group">'+lightDot('gray')+' 无数据 '+counts.gray+'</span>'
    +   '<span style="margin-left:auto;">共 '+totalN+' 个项目</span>'
    + '</div>'
    + '<div class="wall-grid">'+cards+'</div>'
    + '</section>';
}

  var i=getIssue(pid,issueId); if(!i)return '';
  return '<span class="chip mono" data-issue="'+i.id+'" data-action="goSession" data-arg=\'["'+pid+'","'+i.id+'"]\' style="cursor:pointer;">'+esc(i.title.slice(0,14))+(i.title.length>14?'…':'')+'</span>';

function metricCardHTML(pid,m,big){
  if(!m) return '';

    return '<div class="mcard gray'+(big?' north':'')+'"><div class="mcard-head"><span class="mcard-name'+(big?' big':'')+'">'+esc(m.label)+'</span><span class="chip badge-manual">手填</span></div>'

    + '<div class="mcard-value-row"><span class="mcard-value'+(big?' big':'')+'">'+esc(m.current)+'</span><span class="mcard-target">目标 '+esc(m.target)+(m.targetAssumed?' ✱':'')+'</span></div>'

  var initial = (assignee||'?').charAt(0).toUpperCase();

    + '<div class="kcard-top"><span class="mono">#'+esc(issueSuffix(i.id))+'</span>'+remoteBadge+kindChip+'<span class="status-dot '+statusDotClass(i.status)+'" style="margin-left:auto;" title="'+esc(STATUS_LABEL[i.status]||'')+'"></span></div>'

function kanbanHTML(pid,issuesList){
  var bySeg={unassigned:[],assigned:[],doing:[],review:[],blocked:[],done:[],cancelled:[]};
  issuesList.forEach(function(i){ var s=segOf(i.status); (bySeg[s]=bySeg[s]||[]).push(i); });
  Object.keys(bySeg).forEach(function(s){ bySeg[s]=sortByOrder(pid,s,bySeg[s]); });
  var segs = state.ui.planSeg[pid]=state.ui.planSeg[pid]||{};
  var cols=KANBAN_COLS.map(function(c){
    var colKey=c[0],colLabel=c[1],segDefs=c[2];
    if(!segs[colKey]||!segDefs.some(function(s){return s[0]===segs[colKey];})) segs[colKey]=segDefs[0][0];
    var activeSeg=segs[colKey];
    var tabsHTML='';
    if(segDefs.length>1){
      tabsHTML='<div class="kanban-segtabs">'+segDefs.map(function(s){
        var cnt=bySeg[s[0]].length;
        return '<button class="seg-tab '+(activeSeg===s[0]?'active':'')+'" data-action="selectPlanSeg" data-arg=\'["'+pid+'","'+colKey+'","'+s[0]+'"]\'>'+esc(s[1])+'<span class="seg-count">'+cnt+'</span></button>';
      }).join('')+'</div>';
    }
    var total=segDefs.reduce(function(n,s){return n+bySeg[s[0]].length;},0);
    var cards=bySeg[activeSeg].map(function(i){return issueCardHTML(pid,i);}).join('') || '<div class="kanban-empty">无 issue</div>';
    var colTint={todo:'col-todo',doing:'col-doing',pending:'col-pending',done:'col-done'}[colKey]||'col-todo';
    return '<div class="kanban-col '+colTint+'"><div class="kanban-col-head"><span class="status-dot '+statusDotClass(segStatus(activeSeg))+'"></span>'+esc(colLabel)+'<span class="count">'+total+'</span></div>'+tabsHTML+'<div class="kanban-seg-box" data-col="'+activeSeg+'" data-pid="'+pid+'">'+cards+'</div></div>';
  }).join('');
  return '<div class="kanban">'+cols+'</div>';
}
function listViewHTML(pid,issuesList){
  var filt=state.ui.planFilter[pid]=state.ui.planFilter[pid]||{cat:'',version:'',source:'',keyword:'',plan:'',stage:''};
  var rows=issuesList.filter(function(i){
    if(filt.cat&&i.category!==filt.cat)return false;
    if(filt.version&&i.version!==filt.version)return false;
    if(filt.source&&(i.source||'').indexOf(filt.source)<0)return false;
    if(filt.keyword&&i.title.toLowerCase().indexOf(filt.keyword.toLowerCase())<0)return false;
    if(filt.plan){
      if(filt.plan==='unscheduled'){ if(i.week||i.version)return false; }
      else if(filt.plan.indexOf('version:')===0){ if(i.version!==filt.plan.slice(8))return false; }
      else if(filt.plan.indexOf('week:')===0){ if(i.week!==filt.plan.slice(5))return false; }
    }
    if(filt.stage){ var sm={Todo:['todo'],InProgress:['doing'],InReview:['review','merged'],Blocked:['blocked'],Done:['done'],Cancelled:['cancelled']}; var arr=sm[filt.stage]; if(arr&&arr.indexOf(i.status)<0)return false; }
    return true;
  });
  var presets=[['open','开放'],['assigned','分配我的'],['mine','我的']];
  var presetHTML=presets.map(function(p){return '<button class="il-preset '+(p[0]==='open'?'on':'')+'" data-action="toastOnly" data-arg=\'"预设筛选(演示:开放)"\'>'+p[1]+'</button>';}).join('');
  var planOpts=[['','全部'],['unscheduled','未排期']].concat(VERSIONS.map(function(v){return ['version:'+v,v];}));
  var stageOpts=[['','全部'],['Todo','已排期'],['InProgress','进行中'],['InReview','待评审'],['Blocked','阻塞'],['Done','完成'],['Cancelled','已取消']];
  function sel(opts,cur,bind){return '<select class="il-dd-btn" data-bindchange="'+bind+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'" '+(o[0]===cur?'selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';}
  var bar='<div class="il-bar"><div class="il-presets">'+presetHTML+'</div><div class="il-tools">'
    + sel(planOpts,filt.plan||'','ui.planFilter.'+pid+'.plan')
    + sel(stageOpts,filt.stage||'','ui.planFilter.'+pid+'.stage')
    + '<div class="il-search-wrap"><input class="il-search" placeholder="Search issues..." data-bind="ui.planFilter.'+pid+'.keyword" value="'+esc(filt.keyword||'')+'"></div>'
    + '</div></div>';
  var head='<div class="il-row il-head"><span class="il-num">ID</span><span class="il-title">标题</span><span class="il-owner">负责人</span><span class="il-status">状态</span><span class="il-updated">已更新</span><span class="il-act"></span></div>';
  var pillMap={pool:['status-todo','未排期'],todo:['status-todo','已排期'],doing:['status-progress','进行中'],review:['status-review','待评审'],merged:['status-review','待评审'],done:['status-done','完成'],blocked:['status-blocked','阻塞'],cancelled:['status-cancelled','已拒绝']};
  function rowHTML(i){
    var pill=pillMap[i.status]||['status-todo',i.status];
    var assignee=i.assignee||'未指派';
    var initial=(assignee||'?').charAt(0).toUpperCase();
    var planTag=i.week?('周·'+i.week):(i.version?('版本·'+i.version):'未排期');
    var sub='by '+(i.source||'—')+' · '+planTag;
    var act = (i.status==='pool'||(i.status==='todo'&&!i.week)) ? '<button class="il-btn" data-action="scheduleToWeek" data-arg=\'["'+pid+'","'+i.id+'"]\'>schedule</button>'
      : i.status==='todo' ? '<button class="il-btn primary" data-action="startWork" data-arg=\'["'+pid+'","'+i.id+'"]\'>Start →</button>'
      : '<button class="il-btn primary" data-action="goSession" data-arg=\'["'+pid+'","'+i.id+'"]\'>Open →</button>';
    return '<div class="il-row"><span class="il-num"><span class="il-idmark"></span>#'+esc(issueSuffix(i.id))+'</span>'
      + '<span class="il-title"><span class="il-t1" data-action="selectPlanIssue" data-arg=\'["'+pid+'","'+i.id+'"]\' style="cursor:pointer;">'+esc(i.title)+'</span><span class="il-t2">'+esc(sub)+'</span></span>'
      + '<span class="il-owner"><span class="avatar avatar-sm">'+esc(initial)+'</span>'+esc(assignee)+'</span>'
      + '<span class="il-status"><span class="il-pill '+pill[0]+'">'+pill[1]+'</span></span>'
      + '<span class="il-updated"></span><span class="il-act">'+act+'</span></div>';
  }
  var body=rows.length?rows.map(rowHTML).join(''):'<div class="il-empty">没有符合的 issue</div>';
  return '<div class="il-wrap">'+bar+'<div class="issue-list">'+head+body+'</div></div>';
}

function renderPlan(pid){
  var proj=getProject(pid); if(!proj) return '<section data-screen="plan"><div class="detail-empty">项目不存在</div></section>';
  var left=normView(state.ui.planLeft[pid]||CURRENT_WEEK);
  state.ui.planLeft[pid]=left;
  var selIssue=state.ui.selectedIssue[pid];
  var viewMode=state.ui.planViewMode[pid]||'board';

  var viewOpts=[['all','全部 issue']];
  VERSIONS.forEach(function(v){ viewOpts.push(['version:'+v, v]); });
  function viewSel(){return '<select class="il-dd-btn" data-bindchange="ui.planLeft.'+pid+'">'+viewOpts.map(function(o){return '<option value="'+o[0]+'" '+(o[0]===left?'selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';}

  var title, issuesList;
  if(left.indexOf('week:')===0){ left='all'; state.ui.planLeft[pid]='all'; }
  if(left==='all'){ title='全部 issue'; issuesList=allIssuesArr(pid); }
  else { var vn=left.slice(8); title=vn; issuesList=allIssuesArr(pid).filter(function(i){return i.version===vn;}); }

  var rightBtns='';
  if(left==='all'){ rightBtns='<button class="btn btn-sm btn-secondary" data-action="toastOnly" data-arg=\'"演示:在 codehub 建里程碑(版本)"\'>创建版本</button><button class="btn btn-sm btn-secondary" data-action="toastOnly" data-arg=\'"演示:删 codehub 里程碑 + 摘 bw:plan 标签"\'>删除版本</button>'; }
  else if(left.indexOf('version:')===0){ rightBtns='<button class="btn btn-sm" data-action="openReleaseModal" data-arg=\'"'+pid+'"\'>发版本</button>'; }
  var viewToggleLabel=viewMode==='board'?'☰ 列表':'▦ 看板';
  var toolbar='<div class="plan-toolbar"><div class="left">'+esc(title)+'</div><div class="right">'+viewSel()+rightBtns
    + '<button class="btn btn-sm btn-primary" data-action="newIssueDraft" data-arg=\'"'+pid+'"\'>新建issue</button>'
    + '<button class="btn btn-sm btn-secondary" data-action="togglePlanView" data-arg="'+pid+'">'+viewToggleLabel+'</button>'
    + '</div></div>';

  var weekHead='';
  if(left.indexOf('version:')===0){
    var wp=getPath(state,'weekPlans.'+pid+'.'+CURRENT_WEEK);
    var prog=weekProgress(pid,CURRENT_WEEK);
    var totalW=prog.todo+prog.doing+prog.review+prog.done;
    function segPct(n){ return totalW? Math.round(n/totalW*100) : 0; }
    weekHead='<div class="goal-box">'+esc(wp?wp.goal:'（这个版本还没写版本目标）')+'</div>'
      + '<div class="week-progress">'
      +   '<div style="width:'+segPct(prog.done)+'%;background:var(--green);"></div>'
      +   '<div style="width:'+segPct(prog.review)+'%;background:var(--amber);"></div>'
      +   '<div style="width:'+segPct(prog.doing)+'%;background:var(--clay);"></div>'
      +   '<div style="width:'+segPct(prog.todo)+'%;background:#E4DDC8;"></div>'
      + '</div>'
      + '<div class="ops-chip-row">'+opsChipsHTML(pid)+'</div>';
  }

  var body = viewMode==='list' ? listViewHTML(pid,issuesList) : kanbanHTML(pid,issuesList);

  var detailModal='';
  var di=selIssue?getIssue(pid,selIssue):null;
  if(di){ detailModal=planDetailModalHTML(pid,di); }

  return '<section data-screen="plan"><div class="plan-grid">'
    + '<div class="plan-col plan-mid">'+toolbar+weekHead+body+'</div>'
    + '</div>'+detailModal+'</section>';
}

function renderSession(pid,sidParam){
  var proj=getProject(pid); if(!proj) return '<section data-screen="session"><div class="detail-empty">项目不存在</div></section>';
  // 只剩两个 iframe 页签:Orca / Open Design(对齐 session/mod.rs + 模块7)。
  // 动作条 / 灌词条不要 —— 开工在计划屏(拖进进行中或详情 ▶跑);停止 / MR / 评审
  // 在 Orca 里或计划屏拖列;Workbench 不知 Orca 里当前哪条会话,灌会对错。
  var tab=state.ui.sessTab[pid]||'orca';
  state.ui.sessTab[pid]=tab;
  var tabsHTML='<div class="sess-tab '+(tab==='orca'?'active':'')+'" data-action="selectSessTab" data-arg=\'["'+pid+'","orca"]\'>Orca</div>'
    + '<div class="sess-tab '+(tab==='opendesign'?'active':'')+'" data-action="selectSessTab" data-arg=\'["'+pid+'","opendesign"]\'>Open Design</div>';
  var body;
  if(tab==='orca'){
    body='<div class="sess-iframe" style="display:flex;flex-direction:column;overflow:hidden;">'
      + '<div class="od-embed-head">Orca · 本机网页内嵌(loopback · #pairing=)</div>'
      + '<div class="od-embed-canvas"><span style="font-size:22px;">⬢</span><span>演示:本机已开的 Orca web 配对页嵌在这里</span><span style="font-size:11px;">贴「给 web 配对」完整 URL 到设置屏后 iframe 亮 · 开工在计划屏 ▶跑 · 停止 / MR / 评审在 Orca 里或计划屏拖列</span></div>'
      + '</div>';
  } else {
    body='<div class="sess-iframe" style="display:flex;flex-direction:column;overflow:hidden;">'
      + '<div class="od-embed-head">Open Design · 本机网页内嵌(loopback)</div>'
      + '<div class="od-embed-canvas"><span style="font-size:22px;">◐</span><span>演示:本机已打开的 Open Design 首页嵌在这里</span><span style="font-size:11px;">原型类活默认停这页 · 探活拿 loopback 首页</span></div>'
      + '</div>';
  }
  return '<section data-screen="session"><div class="sess-grid">'
    + '<div class="sess-col sess-midhead"><div class="sess-tabs">'+tabsHTML+'</div></div>'
    + '<div class="sess-col sess-mid"><div class="sess-body">'+body+'</div></div>'
    + '</div></section>';
}

      + '<option value="cursor" disabled>Cursor(还没接,选了开不了工)</option>'
      + '<option value="" '+(r.tool==='—'||!r.tool?'selected':'')+'>—</option>'

/* ===================== 渲染:知识库(内部沿用 space/spaceTab 命名) ===================== */
function codeGraphSVG(){
  function box(x,y,w,h,label,lines){
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="7" fill="#FBFAF6" stroke="#C5654A" stroke-width="1.3"/>'
      + '<text x="'+(x+w/2)+'" y="'+(y+h/2-3)+'" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#23211C">'+label+'</text>'
      + '<text x="'+(x+w/2)+'" y="'+(y+h/2+13)+'" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#8C867A">'+lines+' 行</text>';
  }
  function arrow(x1,y1,x2,y2){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#8C867A" stroke-width="1.3" marker-end="url(#gArrow)"/>'; }
  return '<svg viewBox="0 0 640 180" width="100%" style="max-width:640px;display:block;">'
    + '<defs><marker id="gArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8C867A"/></marker></defs>'
    + arrow(130,90,230,90) + arrow(350,90,450,90)
    + box(20,62,110,56,'bw','内核') + box(230,62,120,56,'bw-engine','底座') + box(450,62,120,56,'app-shell','壳')
    + '</svg>';
}
function renderSpace(pid,subTab){
  var tab=subTab||state.ui.spaceTab[pid]||'knowledge';
  state.ui.spaceTab[pid]=tab;
  var tabsHTML=[['knowledge','知识'],['graph','代码图'],['assets','资产']].map(function(t){return '<div class="tabbtn '+(tab===t[0]?'active':'')+'" data-action="setSpaceTab" data-arg=\'["'+pid+'","'+t[0]+'"]\'>'+t[1]+'</div>';}).join('');
  var body='';
  if(tab==='knowledge'){
    var docId=state.ui.spaceDoc[pid]||'k-project';
    var groups={};
    KNOWLEDGE_DOCS.forEach(function(d){ groups[d.group]=groups[d.group]||[]; groups[d.group].push(d); });
    var treeHTML=Object.keys(groups).map(function(g){
      return '<div class="sp-tree-group">'+esc(g)+'</div>' + groups[g].map(function(d){
        return '<div class="sp-tree-item '+(docId===d.id?'active':'')+'" data-action="selectKDoc" data-arg=\'["'+pid+'","'+d.id+'"]\'>'+esc(d.name)+'</div>';
      }).join('');
    }).join('');
    var doc=KNOWLEDGE_DOCS.filter(function(d){return d.id===docId;})[0];
    var previewHTML='<div class="detail-empty">选一份文档查看</div>';
    if(doc){
      var lines=doc.path?(FILE_CONTENTS[doc.path]||['(演示未内嵌内容)']):['(演示未内嵌内容,正本以仓文件为准)'];
      previewHTML='<h4>'+esc(doc.name)+'</h4>'+(doc.path?('<div class="path">'+esc(doc.path)+'</div>'):'')+'<pre>'+esc(lines.join('\n'))+'</pre>';
    }
    body='<div class="sp-layout"><div class="card sp-tree">'+treeHTML+'</div><div class="card sp-preview">'+previewHTML+'</div></div>';
  } else if(tab==='graph'){
    var q=(state.ui.symbolQuery[pid]||'').trim();
    var SYMBOL_RESULTS={
      'recompute_health':[['crates/bw/src/app/health.rs','recompute_health 唯一写入者'],['crates/bw/src/derive/mod.rs','derive_project_health 纯函数']],
      'can_transition_to':[['crates/bw/src/model.rs','状态机守卫'],['crates/bw/src/app/issue.rs','transition_issue']]
    };
    var results=SYMBOL_RESULTS[q];
    var resultsHTML=q?(results?results.map(function(r){return '<div class="symbol-result"><div class="h">'+esc(r[0])+'</div><div>'+esc(r[1])+'</div></div>';}).join(''):'<div class="detail-empty">—</div>'):'';
    body='<div class="graph-wrap">'
      + '<div class="graph-svgbox" data-codegraph>'+codeGraphSVG()+'</div>'
      + '<div class="graph-lower">'
      +   '<div class="card" style="padding:12px 14px;"><div class="sr-h" style="margin-top:0;">大文件榜</div>'
      +     [['crates/app-shell/src/screens/plan/mod.rs','—'],['crates/bw/src/app/mod.rs','—'],['crates/bw-engine/src/remote.rs','—']].map(function(r){return '<div class="leaderboard-row"><span>'+esc(r[0])+'</span><span>'+r[1]+'</span></div>';}).join('')
      +   '</div>'
      +   '<div class="card" style="padding:12px 14px;"><div class="sr-h" style="margin-top:0;">符号 → 调用者 / 影响面</div>'
      +     '<input class="input symbol-search-input" placeholder="recompute_health / can_transition_to" data-symbol-input data-pid="'+pid+'" value="'+esc(q)+'">'
      +     resultsHTML + '</div>'
      + '</div>'
      + '<div class="graph-foot">索引时间 2026-08-18 09:10 · codegraph explore</div>'
      + '</div>';
  } else if(tab==='assets'){
    var skills=state.skills[pid]||[], wfs=state.workflows[pid]||[];
    var own=skills.filter(function(s){return !s.distilled && /^项目导入/.test(s.source||'');});
    var distilled=skills.filter(function(s){return s.distilled;});
    function assetCards(list,metaFn){ return '<div class="asset-grid">'+list.map(function(x){return '<div class="card asset-card"><div class="name">'+esc(x.name)+'</div><div class="meta">'+esc(metaFn(x))+'</div></div>';}).join('')+'</div>'; }
    var artifacts=[
      {name:'mvp-blueprint-draft.md / .html',meta:'V4 全貌草案(三轮 grilling 收口)'},
      {name:'standard-module-draft.md',meta:'规范铺底模块设计稿'},
      {name:'research-orca.md 等预研三篇',meta:'Orca / DSH / codegraph 借鉴判断'},
      {name:'hifi/index.html',meta:'V4 高保真可点击原型(本文件)'}
    ];
    body=''
      + '<div class="asset-sect-title">项目自有技能</div>' + (own.length?assetCards(own,function(s){return (s.pkg||'独立')+' · '+(s.desc||'');}):'<div class="detail-empty">暂无</div>')
      + '<div class="asset-sect-title">蒸馏技能</div>' + (distilled.length?assetCards(distilled,function(s){return s.source;}):'<div class="detail-empty">暂无</div>')
      + '<div class="asset-sect-title">workflow</div>' + (wfs.length?assetCards(wfs,function(w){return w.source+' · '+w.oneliner;}):'<div class="detail-empty">暂无</div>')
      + '<div class="asset-sect-title">产物登记</div>' + assetCards(artifacts,function(a){return a.meta;})
      + '<div class="asset-sect-title">仓统计指标</div>'
      + '<div class="repostats" style="border:none;padding:0;">30 天提交 464 · Rust 115 文件 / 60,824 行 · docs 80 篇 · 技能 9 · 30 天 PR 数 7 · 开放 PR 4</div>';
  }
  return '<section data-screen="kb"><div class="card sp-topinfo"><span>管账里登记着核心件</span><span>对账只看不改</span><span style="margin-left:auto;"></span><button class="btn btn-sm" data-action="toastOnly" data-arg=\'"对账:缺 / 过期 / 人改过,结果显示在回执里(演示)"\'>对一遍账</button></div>'
    + '<div class="tabbtn-row">'+tabsHTML+'</div>' + body + '</section>';
}

/* ===================== 主渲染 / 路由分发 ===================== */
function screenHTML(){
  var parts=parseHash();
  var top=parts[0]||'wall';
  var screenSeg='wall', pid=null, sub2=null;
  if(top==='wall'||!parts.length){ screenSeg='wall'; }
  else if(top==='onboard'){ screenSeg='onboard'; }
  else if(top==='settings'){ screenSeg='settings'; }
  else if(top==='p'){ pid=parts[1]; screenSeg=parts[2]||'overview'; sub2=parts[3]; }
  else { screenSeg='wall'; }
  var inProject = top==='p' && !!getProject(pid);
  if(top==='p' && !inProject){ screenSeg='wall'; }
  var html='';
  if(!inProject && screenSeg==='wall') html=renderWall();
  else if(!inProject && screenSeg==='onboard') html=renderOnboard();
  else if(!inProject && screenSeg==='settings') html=renderSettings();
  else if(inProject && screenSeg==='overview') html=renderOverview(pid);
  else if(inProject && screenSeg==='plan') html=renderPlan(pid);
  else if(inProject && screenSeg==='session') html=renderSession(pid,sub2);
  else if(inProject && screenSeg==='config') html=renderConfig(pid);
  else if(inProject && screenSeg==='kb') html=renderSpace(pid,sub2);
  else html=renderWall();
  return {html:html,inProject:inProject,pid:pid,screenSeg:screenSeg};
}
function shellHTML(){
  var r=screenHTML();
  return iconRailHTML(r.inProject,r.screenSeg)
    + (r.inProject?projectRailHTML(r.pid,r.screenSeg):'')
    + '<div class="main">'+topbarHTML(r.inProject,r.pid,r.screenSeg)+'<div class="content">'+r.html+'</div></div>'
    + guideMarkupHTML()
    + modalHTML()
    + (state.ui.reportBusy?'<div class="busy-mask"><div class="busy-card"><div class="busy-spin"></div>日志上传中</div></div>':'');
}
function render(){
  var active=document.activeElement;
  var bind=active&&active.getAttribute&&(active.getAttribute('data-bind')||active.getAttribute('data-bindchange'));
  var selStart=active&&typeof active.selectionStart==='number'?active.selectionStart:null;
  var selEnd=active&&typeof active.selectionEnd==='number'?active.selectionEnd:null;
  document.getElementById('app').innerHTML=shellHTML();
  saveState();
  if(bind){
    var el=document.querySelector('[data-bind="'+bind+'"], [data-bindchange="'+bind+'"]');
    if(el){ el.focus(); if(selStart!=null&&el.setSelectionRange){ try{ el.setSelectionRange(selStart,selEnd); }catch(_){} } }
  }
}
window.addEventListener('hashchange', render);
render();
})();
