:root {

  --color-neutral-300: #d1d3d5;
  --color-neutral-400: #b2b4b7;
  --color-neutral-500: #909295;
  --color-neutral-600: #6f7274;
  --color-neutral-700: #535558;
  --color-neutral-800: #393b3d;
  --color-neutral-900: #232426;

  --color-accent-100: #edf4fe;
  --color-accent-200: #dae9fe;
  --color-accent-300: #b7d5fe;
  --color-accent-400: #82b7ff;
  --color-accent-500: #3b91fe;
  --color-accent-600: #006ddc;
  --color-accent-700: #0152a8;
  --color-accent-800: #003877;
  --color-accent-900: #00224e;

  --color-accent-2-100: #f1f3ff;
  --color-accent-2-200: #e2e6fe;
  --color-accent-2-300: #c8cffe;

  --color-accent-2-500: #7d83f7;
  --color-accent-2-600: #5e5eda;
  --color-accent-2-700: #4544ab;
  --color-accent-2-800: #2f2d7c;
  --color-accent-2-900: #1c1c4e;

  /* Semantic status — base fill, soft tint, deep (text on the tint). */
  --color-success: #34c759;
  --color-success-soft: #d9f8dc;
  --color-success-deep: #1d622c;
  --color-warning: #ff9500;
  --color-warning-soft: #ffead9;
  --color-warning-deep: #7c4602;
  --color-danger: #ff3b30;

  /* The select caret. A data URI can't read a CSS var, so the stroke is

  /* ── Shared (both themes) ────────────────────────────────────────────── */
  --color-divider: color-mix(in srgb, var(--color-text) 12%, transparent);

  /* Han is deliberately unnamed: no listed family covers it, so every
     platform falls to its per-script system default — PingFang SC on
     macOS/iOS, Microsoft YaHei on Windows, Noto Sans CJK SC on Android and
     Linux. Naming those system faces would register them as uploadable web
     fonts; the unnamed fallback renders the same glyphs. */
  --font-body:
    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif;
  --font-heading: var(--font-body);
  --font-heading-weight: 600;
  --font-mono:
    ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;

  --radius-md: 8px;

  /* Elevation — three levels only: hairline border (default), subtle lift

  --shadow-md:

  --shadow-lg:
    0 16px 40px color-mix(in srgb, var(--color-neutral-900) 14%, transparent),

/* ══════════════════════════════════════════════════════════════════════════

*,
*::before,
*::after {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 400;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
}
h1,
h2,
h3,
h4,
h5,
h6 {
  font-family: var(--font-heading);
  font-weight: var(--font-heading-weight);
  line-height: 1.25;
  letter-spacing: -0.014em;
  margin: 0 0 var(--space-2);
}
h1 {
  font-size: 28px;
  letter-spacing: -0.022em;
}
h2 {
  font-size: 22px;
  letter-spacing: -0.018em;
}
h3 {
  font-size: 17px;
}
h4 {
  font-size: 15px;
}
h5 {
  font-size: 13px;
}
h6 {
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
p {
  margin: 0 0 var(--space-3);
}
a {
  color: var(--color-accent);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}
img {
  display: block;
  max-width: 100%;
}
figure {
  margin: 0;
}
figcaption {
  font-size: 11px;
  margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
code {
  font-family: var(--font-mono);
  font-size: 0.92em;
}
.text-muted {
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
:focus {
  outline: none;
}
:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
::selection {
  background: color-mix(in srgb, var(--color-accent) 22%, transparent);
}

/* — rules — */
.hr {
  height: 1px;
  border: 0;
  margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  text-decoration: none;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 13px;
  line-height: 1;
  color: var(--color-text);
  background: transparent;
  border: 1px solid transparent;
  height: 28px;
  padding: 0 var(--space-3);
  border-radius: var(--radius-sm);
}
.btn svg {
  display: block;
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn-primary {
  background: var(--color-accent);
  border-color: var(--color-accent);
  color: #fff;
}
.btn-primary:hover {
  background: var(--color-accent-600);
  border-color: var(--color-accent-600);
}
.btn-primary:active {
  background: var(--color-accent-700);
  border-color: var(--color-accent-700);
}
.btn-secondary {
  background: var(--color-card);
  border-color: var(--color-divider);
  box-shadow: var(--shadow-sm);
}
.btn-secondary:hover {
  background: var(--color-neutral-100);
}
.btn-secondary:active {
  background: var(--color-neutral-200);
}
.btn-ghost {
  color: var(--color-accent);
}
.btn-ghost:hover {
  background: color-mix(in srgb, var(--color-accent) 9%, transparent);
}
.btn-ghost:active {
  background: color-mix(in srgb, var(--color-accent) 16%, transparent);
}
.btn-danger {
  background: var(--color-danger);
  border-color: var(--color-danger);
  color: #fff;
}
.btn-danger:hover {
  background: color-mix(in srgb, var(--color-danger) 84%, var(--color-neutral-900));
}
.btn-danger:active {
  background: color-mix(in srgb, var(--color-danger) 70%, var(--color-neutral-900));
}
.btn-icon {
  width: 28px;
  padding: 0;
}
.btn-block {
  width: 100%;
}

/* — tags & status pills — */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: 0.01em;
  padding: 4px 8px;
  border-radius: 999px;
}
.tag-accent {
  background: var(--color-accent-100);
  color: var(--color-accent-700);
}
.tag-accent-2 {
  background: var(--color-accent-2-100);
  color: var(--color-accent-2-700);
}
.tag-neutral {
  background: var(--color-neutral-100);
  color: var(--color-neutral-700);
}
.tag-outline {
  border: 1px solid var(--color-divider);
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
  padding: 3px 8px;
}
.tag-success {
  background: var(--color-success-soft);
  color: var(--color-success-deep);
}
.tag-warning {
  background: var(--color-warning-soft);
  color: var(--color-warning-deep);
}
.tag-danger {
  background: var(--color-danger-soft);
  color: var(--color-danger-deep);
}

/* — keyboard keys — */
.kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: color-mix(in srgb, var(--color-text) 65%, transparent);
  background: var(--color-neutral-100);
  border: 1px solid var(--color-divider);
  border-bottom-width: 2px;
  border-radius: 4px;
}

/* — forms — */
.field > label {
  display: block;
  font-size: 11px;
  font-weight: 500;
  margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 65%, transparent);
}
.input {
  width: 100%;
  min-height: 30px;
  padding: 5px 9px;
  font: inherit;
  font-size: 13px;
  color: var(--color-text);
  caret-color: var(--color-accent);
  background: var(--color-card);
  border: 1px solid var(--color-divider);
  border-radius: var(--radius-sm);
}
.input::placeholder {
  color: color-mix(in srgb, var(--color-text) 35%, transparent);
}
.input:hover {
  border-color: color-mix(in srgb, var(--color-text) 28%, transparent);
}
.input:focus-visible {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 18%, transparent);
}
textarea.input {
  min-height: 72px;
  resize: vertical;
}
/* Selects drop the platform's own chrome — a macOS stepper or a Windows box
   sitting next to hairline-bordered fields reads as a leftover, not as a
   control. What replaces it is the lucide chevron the rest of the UI uses. */
select.input {
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  padding-right: 26px;
  background-image: var(--select-caret);
  background-repeat: no-repeat;
  background-position: right 8px center;
  background-size: 12px 12px;
}
/* appearance:none also drops the platform's greying-out of a disabled
   control, so the disabled state has to be drawn here. */
.input:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
select.input:disabled {
  background-image: none;
}
.radio {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  font-size: 13px;
}
.radio input,
.seg-opt input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}
.radio .dot {
  width: 14px;
  height: 14px;
  flex: none;
  border-radius: 50%;
  border: 1.5px solid color-mix(in srgb, var(--color-text) 30%, transparent);
  background: var(--color-card);
}
.radio:hover .dot {
  border-color: var(--color-accent);
}
.radio input:checked + .dot {
  border-color: var(--color-accent);
  background: var(--color-accent);
  box-shadow: inset 0 0 0 3px var(--color-card);
}
.radio input:focus-visible + .dot {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.seg {
  display: inline-flex;
  gap: 2px;
  padding: 2px;
  background: var(--color-neutral-100);
  border: 1px solid color-mix(in srgb, var(--color-text) 6%, transparent);
  border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  color: color-mix(in srgb, var(--color-text) 65%, transparent);
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.seg-opt:has(input:checked) {
  background: var(--color-card);
  color: var(--color-text);
  box-shadow: var(--shadow-sm);
}
.seg-opt:not(:has(input:checked)):hover {
  color: var(--color-text);
}
.seg-opt:has(input:focus-visible) {
  outline: 2px solid var(--color-accent);
  outline-offset: -2px;
}

/* — cards — */
.card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-4);
  border-radius: var(--radius-md);
  background: var(--color-card);
  border: 1px solid var(--color-divider);
}
.card-kicker {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-accent);
}
.card-title {
  font-family: var(--font-heading);
  font-weight: var(--font-heading-weight);
  font-size: 14px;
  line-height: 1.3;
  letter-spacing: -0.01em;
}
.card-body {
  margin: 0;
  font-size: 12.5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
  flex: 1;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm {
  box-shadow: var(--shadow-sm);
}
.elev-md {
  box-shadow: var(--shadow-md);
}
.elev-lg {
  box-shadow: var(--shadow-lg);
}

/* — status — */
.status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: color-mix(in srgb, var(--color-text) 75%, transparent);
}
.status-dot {
  width: 8px;
  height: 8px;
  flex: none;
  border-radius: 50%;
  background: var(--status-c, var(--color-neutral-400));
}
.status-todo {
  --status-c: var(--color-neutral-400);
}
.status-progress {
  --status-c: var(--color-warning);
}
.status-review {
  --status-c: var(--color-accent-2);
}
.status-done {
  --status-c: var(--color-success);
}
.status-blocked {
  --status-c: var(--color-danger);
}

/* — avatars — */
.avatar {
  width: 24px;
  height: 24px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: #fff;
  background: var(--color-neutral-500);
  overflow: hidden;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.avatar-sm {
  width: 18px;
  height: 18px;
  font-size: 8px;
}
.avatar-lg {
  width: 32px;
  height: 32px;
  font-size: 12px;
}
.avatar-agent {
  border-radius: var(--radius-sm);
  background: var(--color-accent-2);
}
.avatar-group {
  display: inline-flex;
}
.avatar-group .avatar {
  box-shadow: 0 0 0 2px var(--color-bg);
}
.avatar-group .avatar + .avatar {
  margin-left: -6px;
}

/* — navigation (top bar) — */
.nav {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  min-height: 44px;
  padding: 0 var(--space-4);
  border-bottom: 1px solid var(--color-divider);
  background: var(--color-bg);
}
.nav-brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-heading);
  font-weight: var(--font-heading-weight);
  font-size: 13px;
  margin-right: auto;
}
.nav a {
  color: color-mix(in srgb, var(--color-text) 62%, transparent);
  text-decoration: none;
  font-size: 12.5px;
  font-weight: 500;
}
.nav a:hover {
  color: var(--color-text);
}
.nav a[aria-current='page'] {
  color: var(--color-text);
}

/* — sidebar — */
.sidebar {
  width: 220px;
  flex: none;
  display: flex;
  flex-direction: column;
  padding: var(--space-2);
  background: var(--color-surface);
  border-right: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);
}
.sidebar-section {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 45%, transparent);
  padding: var(--space-2) var(--space-2) var(--space-1);
  margin-top: var(--space-2);
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 var(--space-2);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: color-mix(in srgb, var(--color-text) 80%, transparent);
  text-decoration: none;
  cursor: pointer;
}
.sidebar-item svg {
  flex: none;
  opacity: 0.75;
}
.sidebar-item:hover {
  background: color-mix(in srgb, var(--color-text) 6%, transparent);
  text-decoration: none;
  color: var(--color-text);
}
.sidebar-item:active {
  background: color-mix(in srgb, var(--color-text) 10%, transparent);
}
.sidebar-item[aria-current='page'] {
  background: color-mix(in srgb, var(--color-text) 8%, transparent);
  color: var(--color-text);
  font-weight: 500;
}
.sidebar-item .count {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: color-mix(in srgb, var(--color-text) 45%, transparent);
}

/* — tabs — */
.tabs {
  display: flex;
  gap: var(--space-4);
  border-bottom: 1px solid var(--color-divider);
}
.tab {
  appearance: none;
  background: none;
  border: 0;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
  padding: var(--space-2) 2px 9px;
  margin-bottom: -1px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.tab:hover {
  color: var(--color-text);
}
.tab[aria-selected='true'] {
  color: var(--color-text);
  border-bottom-color: var(--color-accent);
}

/* — list rows — */
.list {
  display: flex;
  flex-direction: column;
}
.list-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 36px;
  padding: 0 var(--space-3);
  font-size: 13px;
  color: var(--color-text);
  text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 6%, transparent);
}
.list-row:hover {
  background: color-mix(in srgb, var(--color-text) 3.5%, transparent);
  text-decoration: none;
}
.row-id {
  flex: none;
  width: 52px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 45%, transparent);
}
.row-title {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
}
.row-meta {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex: none;
  font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}

/* — board (kanban) — */
.board {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(220px, 1fr);
  gap: var(--space-3);
  align-items: start;
}
.board-col {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-2);
  border-radius: var(--radius-md);
  background: var(--color-surface);
}
.board-col-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px var(--space-1);
  font-size: 12px;
  font-weight: 500;
  color: color-mix(in srgb, var(--color-text) 65%, transparent);
}
.board-col-head .count {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: color-mix(in srgb, var(--color-text) 40%, transparent);
}

/* — tables — */
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
.table th {
  text-align: left;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--color-divider);
}
.table td {
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 6%, transparent);
}
.table tbody tr:hover {
  background: color-mix(in srgb, var(--color-text) 3.5%, transparent);
}

/* — dialog — */
.dialog-backdrop {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 40%, transparent);
}
.dialog {
  width: min(420px, 100%);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-6);
  border-radius: var(--radius-lg);
  background: var(--color-card);
  border: 1px solid var(--color-divider);
  box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading);
  font-weight: var(--font-heading-weight);
  font-size: 15px;
  letter-spacing: -0.01em;
}
.dialog-body {
  font-size: 13px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--space-2);
  margin-top: var(--space-2);
}

/* — command palette — */
.cmdk {
  width: min(560px, 100%);
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-lg);
  background: var(--color-card);
  border: 1px solid var(--color-divider);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.cmdk-input {
  width: 100%;
  padding: var(--space-3) var(--space-4);
  font: inherit;
  font-size: 14px;
  color: var(--color-text);
  caret-color: var(--color-accent);
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--color-divider);
  outline: none;
}
.cmdk-input::placeholder {
  color: color-mix(in srgb, var(--color-text) 35%, transparent);
}
.cmdk-list {
  max-height: 320px;
  overflow: auto;
  padding: var(--space-1);
}
.cmdk-section {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 40%, transparent);
  padding: var(--space-2) var(--space-2) var(--space-1);
}
.cmdk-item {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 36px;
  padding: 0 var(--space-2);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: color-mix(in srgb, var(--color-text) 85%, transparent);
  cursor: pointer;
}
.cmdk-item svg {
  flex: none;
  opacity: 0.7;
}
.cmdk-item:hover {
  background: color-mix(in srgb, var(--color-text) 6%, transparent);
  color: var(--color-text);
}
.cmdk-item[aria-selected='true'] {
  background: color-mix(in srgb, var(--color-text) 9%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-text) 14%, transparent);
  color: var(--color-text);
}
.cmdk-item .keys {
  margin-left: auto;
  display: flex;
  gap: 3px;
}

/* — toast — */
.toast {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: fit-content;
  max-width: 360px;
  padding: 10px var(--space-3);
  border-radius: var(--radius-md);
  background: var(--color-neutral-900);
  color: var(--color-neutral-100);
  font-size: 12.5px;
  line-height: 1.45;
  box-shadow: var(--shadow-lg);
}
.toast svg {
  flex: none;
  margin-top: 1px;
}
.toast-title {
  font-weight: 600;
}
.toast-body {
  opacity: 0.7;
}
.toast-action {
  margin-left: var(--space-3);
  flex: none;
  align-self: center;
  font: inherit;
  font-weight: 600;
  color: var(--color-accent-400);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
.toast-action:hover {
  text-decoration: underline;
}

/* — imagery: crisp frame, hairline edge — */
.frame {
  border-radius: var(--radius-md);
  border: 1px solid var(--color-divider);
  overflow: hidden;
}

/* — page head — */
.page-head {
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}
.page-head h1 {
  font-size: 24px;
  letter-spacing: -0.018em;
  margin: 0;
}
.page-desc {
  margin: 2px 0 0;
  font-size: 13px;
  max-width: 68ch;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
}
.page-actions {
  margin-left: auto;
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

/* — settings: section + group + row — */
.section {
  display: flex;
  align-items: flex-end;
  gap: var(--space-3);
  margin: var(--space-6) 0 var(--space-2);
}
.section:first-of-type {
  margin-top: 0;
}
.section-title {
  font-size: 14px;
  font-weight: 600;
  margin: 0;
}
.section-desc {
  margin: 2px 0 0;
  font-size: 12.5px;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.section-tools {
  margin-left: auto;
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.set-group {
  display: flex;
  flex-direction: column;
  border-radius: var(--radius-md);
  background: var(--color-card);
  border: 1px solid var(--color-divider);
}
.set-row {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  min-height: 52px;
  padding: 10px var(--space-4);
  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 6%, transparent);
}
.set-row:last-child {
  border-bottom: 0;
}
.set-text {
  flex: 1;
  min-width: 0;
}
.set-title {
  font-weight: 500;
}
.set-desc {
  margin-top: 1px;
  font-size: 12px;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.set-ctl {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  max-width: 56%;
}
.set-ctl .input {
  width: 260px;
}
.set-ctl .input-sm {
  width: auto;
}
.path {
  font-family: var(--font-mono);
  font-size: 11.5px;
  white-space: nowrap;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}

/* — toggle — */
.toggle {
  position: relative;
  display: inline-flex;
  width: 34px;
  height: 20px;
  flex: none;
  cursor: pointer;
}
.toggle input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}
.toggle .knob {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: var(--color-neutral-300);
  transition: background 0.15s;
}
.toggle .knob::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--color-card);
  box-shadow: var(--shadow-sm);
  transition: left 0.15s;
}
.toggle input:checked + .knob {
  background: var(--color-accent);
}
.toggle input:checked + .knob::after {
  left: 16px;
}
.toggle input:focus-visible + .knob {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* — choice cards (pick one of a few looks) — */
.choice {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  cursor: pointer;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.choice input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}
.choice-pv {
  width: 112px;
  height: 68px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-divider);
  overflow: hidden;
  background: var(--color-card);
}
.choice input:checked ~ .choice-pv {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.choice input:checked ~ .choice-label {
  color: var(--color-text);
  font-weight: 500;
}
.choice input:focus-visible ~ .choice-pv {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

/* ── CJK (中文) layer ────────────────────────────────────────────────────
   Mixed script works untouched: the stacks set Latin faces first, han falls
   through to PingFang / YaHei; digits, IDs, code and shortcuts stay Latin
   mono inside Chinese copy. Declare lang="zh" on <html> or any subtree and
   these rules re-tune han: headings drop the Latin negative tracking (it
   makes han glyphs collide), copy gains leading, emphasis becomes weight
   (han has no italics), and the smallest labels step up to 11px. */
:lang(zh) {
  text-autospace: normal;
  text-spacing-trim: normal;
}
p:lang(zh),
li:lang(zh),
dd:lang(zh),
.card-body:lang(zh),
.dialog-body:lang(zh) {
  line-height: 1.7;
  letter-spacing: 0.02em;
}
:is(
  h1,
  h2,
  h3,
  h4,
  h5,
  .card-title,
  .dialog-title,
  .row-title,
  .nav-brand,
  .toast-title,
  .section-title,
  .set-title
):lang(zh) {
  letter-spacing: 0;
}
h1:lang(zh),
h2:lang(zh) {
  line-height: 1.35;
}
em:lang(zh),
i:lang(zh),
cite:lang(zh) {
  font-style: normal;
  font-weight: 600;
}
:is(h6, .card-kicker, .sidebar-section, .cmdk-section):lang(zh) {
  font-size: 11px;
  letter-spacing: 0.1em;
}
.table th:lang(zh) {
  font-size: 11px;
}
.tag:lang(zh) {
  font-size: 11.5px;
  letter-spacing: 0.02em;
}
.avatar:lang(zh) {
  font-size: 12px;
}
.avatar-sm:lang(zh) {
  font-size: 10px;
}

/* Proposal layouts only. Tokens and shared components come from the design system. */
html,
body {
  min-width: 320px;
}
button,
select,
input,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
}
button svg,
.inline-icon svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
.muted {
  color: var(--color-neutral-600);
}
.mono {
  font-family: var(--font-mono);
}
.proposal-bar {
  min-height: 44px;
  padding: var(--space-2) var(--space-6);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  border-bottom: 1px solid var(--color-divider);
  background: var(--color-surface);
  font-size: 12px;
}
.proposal-label,
.proposal-controls {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.proposal-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--color-neutral-600);
}
.proposal-controls .input {
  width: 194px;
  height: 28px;
  font-size: 12px;
}
.proposal-controls .btn {
  height: 28px;
  font-size: 12px;
}
.app-shell {
  display: grid;
  grid-template-columns: 204px minmax(0, 1fr);
  min-height: calc(100vh - 45px);
}
.app-sidebar {
  width: auto;
  display: flex;
  flex-direction: column;
  padding: var(--space-4) var(--space-3);
  border-right: 1px solid var(--color-divider);
}
.brand {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  margin: var(--space-1) var(--space-2) var(--space-8);
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border: 1px solid var(--color-neutral-700);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-weight: 600;
}
.project-switch {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2);
  margin-bottom: var(--space-6);
}
.project-icon {
  background: var(--color-bg);
  border: 1px solid var(--color-divider);
  border-radius: var(--radius-md);
  padding: var(--space-1) var(--space-2);
  font-weight: 600;
}
.project-switch strong {
  display: block;
  font-size: 12px;
}
.project-switch span:not(.project-icon),
.sidebar-bottom div span {
  display: block;
  color: var(--color-neutral-600);
  font-size: 11px;
  margin-top: var(--space-1);
}
.app-sidebar .sidebar-item {
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  height: 36px;
  margin-bottom: var(--space-1);
}
.app-sidebar .sidebar-item[aria-current='page'] {
  background: var(--color-neutral-200);
  color: var(--color-text);
  font-weight: 600;
}
.app-sidebar .sidebar-item:hover {
  background: var(--color-neutral-200);
}
.sidebar-item > span:first-child {
  display: flex;
}
.worktree-label {
  margin-top: var(--space-8);
}
.native-entry {
  color: var(--color-neutral-700);
  font-size: 12px !important;
}
.sidebar-bottom {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: auto;
  padding: var(--space-6) var(--space-2) var(--space-1);
}
.sidebar-bottom div {
  flex: 1;
  font-size: 11px;
}
.sidebar-bottom > .mono {
  font-size: 10px;
  color: var(--color-neutral-600);
}
.workspace {
  min-width: 0;
}
.workspace-top {
  min-height: 56px;
  padding: 0 var(--space-8);
  border-bottom: 1px solid var(--color-divider);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
}
.breadcrumbs,
.top-right {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-size: 12px;
}
.breadcrumbs > span:first-child {
  color: var(--color-neutral-600);
}
.version-marker {
  font-family: var(--font-mono);
  border: 1px solid var(--color-divider);
  border-radius: var(--radius-sm);
  padding: 0 var(--space-2);
  font-size: 11px;
}
#main {
  padding: var(--space-8);
  max-width: 1512px;
  margin: auto;
}
.page-heading {
  display: flex;
  justify-content: space-between;
  gap: var(--space-6);
  align-items: flex-start;
  margin-bottom: var(--space-6);
}
.page-heading h1 {
  font-size: 24px;
  line-height: 1.4;
  margin-bottom: var(--space-2);
}
.page-heading p {
  color: var(--color-neutral-600);
  margin: 0;
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
  color: var(--color-neutral-600);
  font-size: 11px;
}
.heading-status {
  white-space: nowrap;
  margin-top: var(--space-2);
}
.two-column {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 276px;
  gap: var(--space-8);
}
.content-column,
.side-column {
  min-width: 0;
}
.side-column {
  border-left: 1px solid var(--color-divider);
  padding-left: var(--space-6);
}
.section-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin: 0 0 var(--space-3);
}
.section-label h2,
.section-label h3 {
  font-size: 14px;
  margin: 0;
}
.section-label .muted {
  font-size: 11px;
}
section + section {
  margin-top: var(--space-6);
}
.section-divider {
  border-top: 1px solid var(--color-divider);
  padding-top: var(--space-6);
}
.commitment {
  margin: 0 0 var(--space-6);
  padding-bottom: var(--space-6);
  border-bottom: 1px solid var(--color-divider);
}
.commitment-main {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.6;
  margin-bottom: var(--space-3);
  max-width: 720px;
}
.inline-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-4);
  font-size: 12px;
  color: var(--color-neutral-600);
}
.inline-meta strong {
  font-weight: 500;
  color: var(--color-text);
}
.evidence-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0;
  border: 1px solid var(--color-divider);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-6);
}
.evidence-step {
  background: transparent;
  border: 0;
  color: var(--color-text);
  text-align: left;
  padding: var(--space-4);
  min-width: 0;
}
.evidence-step + .evidence-step {
  border-left: 1px solid var(--color-divider);
}
.evidence-step:hover {
  background: var(--color-surface);
}
.evidence-step .step-top {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
  font-size: 12px;
}
.step-no {
  font-family: var(--font-mono);
  color: var(--color-neutral-500);
  font-size: 10px;
}
.evidence-step strong {
  display: block;
  margin-bottom: var(--space-1);
  font-size: 14px;
  font-weight: 600;
}
.evidence-step small {
  color: var(--color-neutral-600);
  font-size: 11px;
  line-height: 1.7;
  display: block;
}
.evidence-step .status-dot {
  margin-left: auto;
}
.signal-number {
  font-family: var(--font-mono);
  font-size: 32px;
  font-weight: 500;
  line-height: 1.2;
}
.signal-number span {
  color: var(--color-neutral-500);
  font-size: 18px;
}
.result-summary {
  display: flex;
  align-items: center;
  gap: var(--space-6);
  padding: var(--space-1) 0 var(--space-4);
}
.result-summary p {
  margin: 0;
}
.result-summary .muted {
  font-size: 12px;
}
.trial-list {
  border-top: 1px solid var(--color-divider);
}
.trial-row {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) auto;
  gap: var(--space-3);
  align-items: center;
  border-bottom: 1px solid var(--color-divider);
  padding: var(--space-3) 0;
}
.trial-row strong {
  font-size: 12px;
  font-weight: 500;
}
.trial-row p {

      }
      const reason = $('#reason').value.trim(),
        next = $('#next-step').value.trim()
      if (!reason || !next) {
        $('#decision-error').textContent = '请同时留下未达成原因和明确的下一步。'
        return
      }
      state.decision = { reason, next }
      state.done = false
      closeModal()
      render()
      announce('已记录你的决定，总览与验收已同步。')
      return
    }
    if (action === 'complete') {
      return complete()
    }
    if (action === 'save-complete') {
      if (!completionAllowed()) {
        return
      }
      state.done = true
      state.decision = null
      closeModal()
      navigate('overview')
      announce('本次完成已由你确认。首次失败与复测证据仍然保留。')
      return
    }
    if (action === 'history') {
      return showModal(
        '首次试用记录',
        '保留历史 · 不被复测覆盖',
        `<dl class="evidence-facts"><dt>版本</dt><dd>v0.3 · rc.1</dd><dt>窗口</dt><dd>2026-10-09 15:10–15:40</dd><dt>来源</dt><dd>任务事件 task-import-009 + 试用观察表</dd><dt>结果</dt><dd>2 / 3 独立完成，运营 C 卡在字段映射</dd></dl>${trials(
          originalTrials
        )}<p class="caption">修复后复测与本次记录并列保留，不能用新结果改写旧窗口。</p>`,
        button('返回', 'close', 'secondary'),
        true
      )
    }
  })
  $('#scenario').addEventListener('change', (event) => {
    state = initial(event.target.value)
    render()
    window.scrollTo(0, 0)
    announce('已切换示例场景；没有替你确认本次完成。')
  })
  modal.addEventListener('keydown', (event) => {
    if (event.key !== 'Tab') {
      return
    }
    const focusable = [
      ...modal.querySelectorAll(
        'button:not(:disabled), input:not(:disabled), textarea:not(:disabled), select:not(:disabled), [tabindex="0"]'
      )
    ].filter((element) => element.getClientRects().length > 0)
    const first = focusable[0]
    const last = focusable.at(-1)
    if (!first) {
      event.preventDefault()
      return
    }
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault()
      last.focus()
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault()
      first.focus()
    }
  })
  modal.addEventListener('cancel', (event) => {
    event.preventDefault()
    closeModal()
  })
  modal.addEventListener('click', (event) => {
    if (event.target === modal) {
      const r = modal.getBoundingClientRect()
      if (
        event.clientX < r.left ||
        event.clientX > r.right ||
        event.clientY < r.top ||
        event.clientY > r.bottom
      ) {
        closeModal()
      }
    }
  })
  render()
})()

</script>
  </body>
</html>
