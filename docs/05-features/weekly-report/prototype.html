<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>项目周报 · Workbench</title>
    <link rel="stylesheet" href="prototype/style.css" />
    <style id="report-theme">
      .weekly-report {
        border: 1px solid #000;
        color: #000;
        background: #fff;
        font:
          14px/1.65 'Microsoft YaHei',
          sans-serif;
      }
      .weekly-report h1 {
        margin: 0;
        padding: 20px 24px;
        background: #785ed8;
        color: #fff;
        text-align: center;
        font-size: 28px;
        font-weight: 700;
      }
      .weekly-report .report-meta {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 24px;
        padding: 12px 18px;
        font-size: 13px;
      }
      .weekly-report section {
        margin: 0;
      }
      .weekly-report h2 {
        margin: 0;
        padding: 7px 14px;
        background: #785ed8;
        color: #fff;
        font-size: 18px;
        font-weight: 700;
      }
      .weekly-report table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 13px;
      }
      .weekly-report th,
      .weekly-report td {
        padding: 9px 12px;
        border: 1px solid #000;
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      .weekly-report th {
        background: #eedeee;
        font-weight: 700;
      }
      .weekly-report th:first-child,
      .weekly-report td:first-child {
        border-left: 0;
      }
      .weekly-report th:last-child,
      .weekly-report td:last-child {
        border-right: 0;
      }
      .weekly-report .section-summary {
        margin: 0;
        padding: 9px 12px;
        background: #fff;
        border-bottom: 1px solid #000;
        font-size: 13px;
      }
      .weekly-report .manual-text {
        white-space: pre-wrap;
      }
      .weekly-report .status-done {
        color: #00b050;
      }
      .weekly-report .status-risk {
        color: #c00000;
      }
      .weekly-report .status-unknown {
        color: #666;
      }
      .weekly-report .note-row td {
        background: #e7e6e6;
      }
      @media (max-width: 700px) {
        .weekly-report h1 {
          font-size: 22px;
          padding: 16px;
        }
        .weekly-report table {
          font-size: 12px;
        }
        .weekly-report th,
        .weekly-report td {
          padding: 7px 5px;
        }
        .weekly-report h2 {
          font-size: 16px;
        }
      }
      @media print {
        .weekly-report h1,
        .weekly-report h2,
        .weekly-report th {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
        .weekly-report section {
          break-inside: avoid;
        }
      }
    </style>
    <script defer src="prototype/data.js"></script>
    <script defer src="prototype/app.js"></script>
  </head>
  <body>
    <main class="report-page">
      <header class="toolbar">
        <div class="report-options">
          <label>周期<select id="period" aria-label="周报周期"></select></label>
          <label>版本<select id="version" aria-label="周报版本"></select></label>
        </div>
        <div class="report-actions">
          <button id="update" class="button primary">更新周报</button>
          <button id="supplement" class="button">补充或修正</button>
          <button id="export" class="button">导出</button>
        </div>
      </header>
      <p id="notice" class="notice" role="status" hidden></p>
      <article id="report" class="weekly-report" aria-label="项目周报"></article>
    </main>
    <dialog id="editor" aria-labelledby="editor-title">
      <form id="edit-form">
        <div class="dialog-heading">
          <h2 id="editor-title">补充或修正</h2>
          <button type="button" class="icon-button" data-close="editor" aria-label="关闭">×</button>
        </div>
        <label>栏目<select id="note-section"></select></label>
        <label
          >方式<select id="note-mode">
            <option value="append">补充</option>
            <option value="correct">修正</option>
          </select></label
        >
        <label>内容<textarea id="note-content" rows="6" required></textarea></label>
        <label class="check-label"
          ><input id="note-checked" type="checkbox" /> 已核对本次内容</label
        >
        <div class="dialog-actions">
          <button type="button" class="button" data-close="editor">取消</button
          ><button type="submit" class="button primary">保存</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
