<!doctype html>
<!-- W01 原型：在探索 BW 弹窗内评审完整 Workbench 窗口的连续动画。 -->
<html lang="zh" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>探索 BW · W01 运营看板整窗动画原型</title>
    <link rel="stylesheet" href="../../04-design-system/styles.css" />
    <link rel="stylesheet" href="../../../src/renderer/src/workbench/workbench-wall.css" />
    <link rel="stylesheet" href="../../../src/renderer/src/workbench/workbench-overview.css" />
    <link rel="stylesheet" href="../../../src/renderer/src/workbench/project-settings.css" />
    <link rel="stylesheet" href="prototype/w01-kanban-journey.css" />
  </head>
  <body>
    <header class="review-bar">
      <div>
        <strong>探索 BW · W01 运营看板整窗动画原型</strong>
        <span>按当前 Workbench 壳展示“明确方向”的完整路径</span>
      </div>
      <button class="btn btn-secondary" id="theme-toggle" type="button">切换深色</button>
    </header>

    <main class="preview-shell">
      <section class="explore-modal" aria-label="探索 BW 弹窗原型">
        <header class="explore-header">
          <div>
            <span class="explore-kicker">帮助 · 工作旅程</span>
            <h1>探索 BW</h1>
          </div>
          <button class="btn btn-ghost btn-icon" type="button" aria-label="关闭探索">×</button>
        </header>
        <nav class="explore-tabs" aria-label="探索类型">
          <button class="tab is-active" type="button">工作旅程</button>
          <button class="tab" type="button">功能</button>
        </nav>

        <div class="explore-body">
          <aside class="explore-rail" aria-label="工作旅程目录">
            <p class="rail-heading">工作旅程</p>
            <button class="explore-item is-active" type="button"><span>01</span><strong>明确方向</strong></button>
            <button class="explore-item" type="button"><span>02</span><strong>制定版本计划</strong></button>
            <button class="explore-item" type="button"><span>03</span><strong>构建交付</strong></button>
            <button class="explore-item" type="button"><span>04</span><strong>验收成果</strong></button>
            <button class="explore-item" type="button"><span>05</span><strong>查看效果</strong></button>
            <p class="rail-note">示例数据只用于说明路径，不会改动你的项目。</p>
          </aside>

          <section class="explore-content" aria-label="明确方向动画">
            <header class="journey-heading">
              <span class="explore-kicker">工作旅程 01</span>
              <h2>明确方向</h2>
              <p>找到运营看板，确认共同目标，再安排本轮阶段成果。</p>
            </header>
            <div class="path-strip" id="path-strip" aria-label="旅程路径"></div>

            <section class="animation-card" aria-label="完整 Workbench 窗口动画">
              <header class="animation-toolbar">
                <div>
                  <span class="animation-kicker" id="step-kicker"></span>
                  <strong id="step-title"></strong>
                </div>
                <div class="animation-controls">
                  <button class="btn btn-primary" id="play" type="button">播放本段</button>
                  <button class="btn btn-secondary" id="restart" type="button">重播</button>
                </div>
              </header>
              <div class="route-strip" aria-live="polite">
                <span>来源</span><strong id="route-source"></strong><span class="route-arrow">→</span><span>当前画面</span><strong id="route-target"></strong>
              </div>
              <div class="window-stage" id="window-stage">
                <div class="workbench-window" id="workbench-window" aria-label="Workbench 完整窗口"></div>
              </div>
              <footer class="animation-caption">
                <span id="location"></span>
                <span id="progress"></span>
              </footer>
            </section>
            <p class="review-note">这版只评审 W01 的整窗层次和来源定位；正式实现仍复用 Workbench 现有组件、token 和探索播放器。</p>
          </section>
        </div>
      </section>
    </main>

    <script src="prototype/w01-kanban-journey.js" defer></script>
  </body>
</html>
