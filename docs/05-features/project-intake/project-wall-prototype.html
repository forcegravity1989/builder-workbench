<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目墙 · Builder 项目组合</title>
<style>
:root{
 --bg:#faf9f5;--surface:#f0eee6;--card:#fefdfa;--text:#1f1e1d;
 --accent:#d97757;--accent-2:#4c73a5;--n100:#f6f3ef;--n200:#ebe7e1;--n300:#d7d2ca;--n400:#b8b3ac;--n500:#96918a;--n600:#75716a;--n700:#58554f;--n800:#3d3a36;
 --acc100:#fef0eb;--acc700:#893a1f;--acc2-100:#edf4fe;--acc2-700:#355781;
 --ok:#579766;--ok-soft:#e7f1e8;--ok-deep:#286037;
 --warn:#ce9042;--warn-soft:#feecce;--warn-deep:#774a03;
 --dang:#c15f4d;--dang-soft:#ffe4df;--dang-deep:#883324;
 --divider:color-mix(in srgb,var(--text) 12%,transparent);
 --r-sm:6px;--r-md:8px;--r-lg:12px;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.55 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a,input,select,textarea{outline-offset:3px}
:focus-visible{outline:2px solid var(--accent-2)}
button{border:0;background:none}
button:disabled{cursor:default;opacity:.55}
a{color:var(--acc2-700)}
svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.6;fill:none;vertical-align:middle;flex-shrink:0}
.app{display:flex;min-height:100vh}
.side{width:234px;flex-shrink:0;border-right:1px solid var(--divider);background:var(--surface);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:0 9px 26px;font-weight:650;font-size:14px}
.brandmark{width:29px;height:29px;display:grid;place-items:center;background:var(--accent);color:white;border-radius:6px;font-size:17px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:6px;color:var(--n700)}
.nav button:hover{background:rgba(255,255,255,.45)}
.nav button.active{background:var(--card);color:var(--acc700);box-shadow:0 1px 3px #30211408}
.nav .count{margin-left:auto;background:var(--n200);padding:0 6px;border-radius:4px;font-size:11px}
.side-label{font-size:11px;color:var(--n600);padding:23px 12px 8px}
.side-note{margin-top:26px;border-top:1px solid var(--divider);padding:16px 10px;font-size:12px;color:var(--n600)}
.side-note strong{display:block;color:var(--n700);margin-bottom:5px;font-weight:550}
.side-bottom{margin-top:auto;padding:16px 10px 0;color:var(--n600)}
.side-bottom button{display:flex;gap:9px;align-items:center;padding:0}
.main{flex:1;min-width:0;padding:27px 28px 30px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{font-size:24px;line-height:1.3;margin:0 0 7px;font-weight:650;letter-spacing:-.6px}
.subtitle{color:var(--n600);margin:0;font-size:13px}
.actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--n300);border-radius:6px;padding:7px 12px;background:var(--card);white-space:nowrap}
.btn:hover{background:var(--n100)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#c86d50}
.btn.small{padding:5px 9px;font-size:12px}
.textbtn{display:inline-flex;align-items:center;gap:5px;color:var(--acc2-700);padding:0;font-size:12px}
.textbtn:hover{text-decoration:underline}
.scenario{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--n100);border:1px solid var(--divider);border-radius:6px;padding:9px 12px;margin-bottom:19px}
.scenario-text{font-size:12px;color:var(--n600)}
.scenario-text strong{color:var(--n700);font-weight:550}
.seg{display:inline-flex;border:1px solid var(--n300);border-radius:6px;padding:2px;gap:2px;background:var(--surface);flex-shrink:0}
.seg button{padding:5px 10px;border-radius:4px;color:var(--n600);font-size:12px}
.seg button.active{background:var(--card);color:var(--text);box-shadow:0 1px 2px #00000008}
.hbar{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--divider);border-radius:8px;background:var(--card);margin-bottom:20px}
.health-stat{text-align:left;padding:13px 18px;position:relative;border-right:1px solid var(--divider)}
.health-stat:last-child{border:0}
.health-stat.active:after{content:"";position:absolute;bottom:0;height:2px;left:18px;right:18px;background:var(--accent)}
.health-stat:hover{background:var(--n100)}
.health-stat .num{font-size:23px;line-height:1.3;font-weight:600;margin-right:7px}
.health-stat .label{font-size:12px;color:var(--n600)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--n500);margin-right:6px}
.dot.red{background:var(--dang)}.dot.amber{background:var(--warn)}.dot.green{background:var(--ok)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:9px}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--n300);background:var(--card);border-radius:6px;padding:6px 9px;width:220px;color:var(--n600)}
.search input{border:0;background:none;width:100%;min-width:0;outline:none;font-size:12px}
select{background:var(--card);border:1px solid var(--n300);border-radius:6px;padding:6px 8px;font-size:12px}
.sectionline{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px;color:var(--n600);font-size:12px}
.sectionline strong{font-weight:550;color:var(--n700)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{border:1px solid var(--divider);background:var(--card);border-radius:8px;padding:17px 17px 0;display:flex;flex-direction:column;min-width:0;position:relative}
.card:hover{border-color:var(--n400)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.tag{border-radius:4px;background:var(--n100);color:var(--n600);padding:2px 6px;font-size:11px}
.tags{display:flex;align-items:center;gap:6px;min-width:0}
.tag.blue{background:var(--acc2-100);color:var(--acc2-700)}
.badge{display:inline-flex;align-items:center;border-radius:5px;padding:3px 7px;font-size:11px;white-space:nowrap;font-weight:550}
.badge.red{color:var(--dang-deep);background:var(--dang-soft)}
.badge.amber{color:var(--warn-deep);background:var(--warn-soft)}
.badge.green{color:var(--ok-deep);background:var(--ok-soft)}
.badge.gray{color:var(--n700);background:var(--n200)}
.cname{font-size:18px;line-height:1.3;font-weight:600;margin:0}
.cname button{text-align:left;padding:0;font-weight:inherit;font-size:inherit;word-break:break-word}
.cname button:hover{color:var(--acc700)}
.cbrief{color:var(--n600);font-size:12px;margin:7px 0 14px;min-height:37px}
.builder{display:flex;align-items:center;gap:7px;color:var(--n700);font-size:12px;margin-bottom:15px}
.avatar{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--surface);color:var(--n700);font-size:10px;font-weight:600;flex-shrink:0}
.builder .role{color:var(--n600);margin-left:auto;font-size:11px}
.commitment{background:var(--n100);padding:11px 12px;border-radius:6px}
.commit-title{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11px;color:var(--n600)}
.commit-title strong{font-size:12px;color:var(--n800);font-weight:550}
.cfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--divider);padding:10px 0;gap:9px}
.fresh{color:var(--n600);font-size:10px}
.fresh.stale{color:var(--warn-deep)}
.footnote{display:flex;justify-content:space-between;gap:15px;margin-top:23px;font-size:11px;color:var(--n600)}
.empty{background:var(--card);border:1px dashed var(--n300);padding:38px 20px;text-align:center;border-radius:8px}
.empty h2{font-size:16px;font-weight:550;margin:0 0 8px}.empty p{color:var(--n600);margin:0 0 16px}
.dback{margin-bottom:18px;color:var(--n600);display:flex;align-items:center;gap:7px;padding:0}
.dhead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}
.dhead h1{font-size:25px}.dhead .builder{margin:12px 0 0;justify-content:flex-start}
.dhead .builder .role{margin-left:0}
.dstrip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--divider);border-radius:8px;margin-bottom:18px}
.dimension{padding:15px 17px;border-right:1px solid var(--divider)}.dimension:last-child{border:0}
.dimension .dimhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:550}
.dimension p{margin:0;color:var(--n600);font-size:12px}
.dcols{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--divider);border-radius:8px;padding:18px;margin-bottom:16px}
.panel h2{font-size:13px;font-weight:600;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center;gap:9px}
.panel p{color:var(--n700);font-size:12px;margin:0 0 12px}
.label{font-size:11px;color:var(--n600);margin-bottom:5px}
.outcome{font-size:15px;color:var(--text);margin-bottom:18px}
.datecompare{display:grid;grid-template-columns:1fr 1fr;gap:15px;border-top:1px solid var(--divider);padding-top:15px;margin-top:15px}
.datecompare strong{font-size:19px;font-weight:550}
.criterion{display:flex;align-items:flex-start;gap:9px;padding:12px 0;border-bottom:1px solid var(--divider)}
.criterion:last-child{border:0;padding-bottom:0}.criterion svg{margin-top:2px}
.criterion .ctext{flex:1;font-size:12px}.criterion small{display:block;color:var(--n600);margin-top:3px}
.criterion .accepted{color:var(--ok-deep)}
.read{padding:12px 0;border-top:1px solid var(--divider);font-size:12px}
.read:first-of-type{border-top:0;padding-top:0}
.readtop{display:flex;gap:12px;justify-content:space-between}.readtop span{color:var(--n600);font-size:11px}
.read p{color:var(--n600);margin:5px 0 0;font-size:11px}
.dependency{border-left:2px solid var(--warn);padding:0 0 0 12px;margin-bottom:16px}
.dependency strong{font-size:12px;font-weight:550}.dependency p{margin:5px 0;font-size:12px;color:var(--n600)}
.dependency .depmeta{font-size:11px;color:var(--n600)}
.draft{font-size:12px;border-top:1px solid var(--divider);padding:11px 0}.draft:first-of-type{border:0}
.draft .meta{font-size:10px;color:var(--n600);margin:5px 0}
.local-label{font-size:10px;color:var(--acc2-700);background:var(--acc2-100);border-radius:4px;padding:2px 6px;white-space:nowrap}
details summary{cursor:pointer;color:var(--n600);font-size:12px}details p{margin:12px 0 0}
.timeline{border:1px solid var(--divider);border-radius:8px;background:var(--card);overflow:auto}
.tname{font-weight:550;font-size:13px}.tname small{display:block;color:var(--n600);font-weight:400;font-size:11px;margin-top:4px}
.shiftline{position:absolute;top:15px;height:2px;background:var(--dang);opacity:.5}
.timeline-legend{display:flex;gap:20px;color:var(--n600);font-size:11px;margin:12px 0}
.builder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.buildercard{padding:18px;border:1px solid var(--divider);background:var(--card);border-radius:8px}
.buildercard h2{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:550;margin:0 0 15px}
.buildercard .project-link{font-size:12px;text-align:left;padding:0;color:var(--acc2-700);margin-bottom:12px}
.buildercard p{font-size:12px;color:var(--n600);margin:8px 0}.buildercard .focus{color:var(--n700)}
.buildercard .load{display:flex;justify-content:space-between;font-size:12px}
dialog{width:min(560px,calc(100vw - 30px));max-height:85vh;border:1px solid var(--n300);border-radius:10px;padding:23px;background:var(--card);color:var(--text);box-shadow:0 20px 70px #2b251c25}
dialog::backdrop{background:#29262155}
dialog h2{font-size:18px;font-weight:600;margin:0 0 8px}
.modal-intro{font-size:12px;color:var(--n600);margin:0 0 19px}
.dialog-head{display:flex;justify-content:space-between;gap:10px}
.closebtn{width:28px;height:28px;display:grid;place-items:center;border-radius:4px}.closebtn:hover{background:var(--surface)}
.field{display:block;margin:14px 0;font-size:12px;color:var(--n700)}
.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;border:1px solid var(--n300);border-radius:6px;padding:8px 10px;background:var(--bg);font-size:13px}
.field textarea{resize:vertical;min-height:80px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.rules{padding-left:19px;color:var(--n700);font-size:12px}.rules li{margin-bottom:13px}.rules strong{color:var(--text)}
.notice{border-left:2px solid var(--accent-2);background:var(--acc2-100);padding:10px 12px;color:var(--acc2-700);font-size:12px}
.error{color:var(--dang-deep);font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--n800);color:white;padding:10px 18px;border-radius:6px;z-index:20;font-size:12px;box-shadow:0 3px 14px #0002}
[hidden]{display:none!important}
@media(min-width:1500px){.main{padding:30px 36px}.grid{grid-template-columns:repeat(3,1fr);max-width:1500px}}
@media(max-width:1050px){.side{width:190px;padding:20px 10px}.main{padding:22px}.toolbar{align-items:flex-start;flex-wrap:wrap}.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.health-stat{padding:12px}.health-stat .label{display:block;margin-top:4px}.dcols{grid-template-columns:1fr}.scenario{align-items:flex-start}}
@media(max-width:700px){.app{display:block}.side{width:100%;height:auto;position:static;padding:12px;border-right:0;border-bottom:1px solid var(--divider)}.brand{padding:0 3px 12px}.nav{flex-direction:row;overflow:auto;gap:3px}.nav button{padding:7px 10px;white-space:nowrap}.side-label,.healthnav,.side-note,.side-bottom{display:none}.main{padding:20px 14px}.head{flex-wrap:wrap}h1{font-size:22px}.scenario{flex-direction:column;gap:8px}.hbar{margin-bottom:16px}.health-stat{padding:10px 6px;text-align:center}.health-stat .num{font-size:20px;margin-right:0}.health-stat .label{font-size:10px}.health-stat .dot{display:none}.toolbar-left{flex-wrap:wrap;width:100%}.search{width:100%}.toolbar-right{width:100%;justify-content:space-between}.grid{grid-template-columns:1fr}.dstrip{grid-template-columns:1fr}.dimension{border-right:0;border-bottom:1px solid var(--divider)}.dimension:last-child{border:0}.dhead{flex-direction:column}.footnote{flex-direction:column}.builder-grid{grid-template-columns:1fr}.sectionline{gap:10px}.actions{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* Version delivery keeps the original palette and card geometry. */
.promise{margin:7px 0 12px;font-size:13px;line-height:1.6;min-height:42px}
.stage-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:10px;border-top:1px solid var(--divider)}
.stage-item{min-width:0}.stage-label{font-size:10px;color:var(--n600);margin-bottom:5px}
.stage-result{display:flex;align-items:center;gap:5px;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.stage-result.red,.card-exception.red{color:var(--dang-deep)}.stage-result.amber,.card-exception.amber{color:var(--warn-deep)}.stage-result.green{color:var(--ok-deep)}.stage-result.gray{color:var(--n600)}
.stage-result .dot{flex-shrink:0}.card-exception{font-size:11px;line-height:1.5;max-width:69%;overflow-wrap:anywhere}
.cfoot .textbtn{flex-shrink:0}.commitment{margin-bottom:14px}.card .builder{margin-bottom:12px}
.cycle-table{min-width:660px}.cycle-row{display:grid;grid-template-columns:minmax(170px,1.1fr) repeat(3,minmax(145px,1fr));border-bottom:1px solid var(--divider)}
.cycle-row:last-child{border-bottom:0}.cycle-row>div{padding:16px 18px;min-width:0}.cycle-head{font-size:11px;color:var(--n600);background:var(--n100)}
.cycle-cell strong{font-size:12px;font-weight:500}.cycle-cell .stage-result{margin-top:7px}.buffer{font-size:10px;color:var(--n600);line-height:1.5;margin:7px 0 0}
.builder-project{border-top:1px solid var(--divider);padding-top:14px;margin-top:14px}.builder-project p{font-size:12px;color:var(--n700);margin:6px 0 12px}
.fact-row{display:flex;justify-content:space-between;gap:15px;font-size:12px;margin:12px 0}.fact-row>span:last-child{text-align:right;overflow-wrap:anywhere}.pr-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:10px 0;border-bottom:1px solid var(--divider)}
.date-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.date-opt{display:flex;align-items:center;gap:7px;font-size:12px;margin:12px 0}.date-opt input{width:auto}
.panel .notice{font-size:11px;line-height:1.65}.panel>h2 .stage-result{font-weight:400}.panel details summary{cursor:pointer;font-size:12px}
@media(max-width:700px){.stage-mini{gap:6px}.date-fields{grid-template-columns:1fr 1fr}.cycle-row>div{padding:13px}.card-exception{max-width:64%}}
</style>
</head>
<body>
<div class="app" id="app">
 <aside class="side" aria-label="项目组合导航">
  <div class="brand"><span class="brandmark" aria-hidden="true">B</span><span>Builders' Workbench</span></div>
  <nav class="nav" id="viewnav" aria-label="视图"></nav>
  <div class="side-note"><strong>一项目，一位主要 Builder</strong>周一计划，周中开发，周五验收。<br>按交付版本对齐承诺与结果。</div>
  <div class="side-bottom"><button data-action="rules"><span aria-hidden="true">ⓘ</span>健康判据与管理方法</button></div>
 </aside>
 <main class="main" id="main"></main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const SNAPSHOT='2026-10-12';
const STORE='bw-projects-v4-drafts-1';
const ICONS={
 wall:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/>',
 person:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
 search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
 arrow:'<path d="m9 5 7 7-7 7M4 12h12"/>',
 back:'<path d="m12 5-7 7 7 7M5 12h15"/>',
 check:'<path d="m5 12 4 4L19 6"/>',
 alert:'<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3v1"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 close:'<path d="m6 6 12 12M6 18 18 6"/>',
 refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-2l2 3M4 16l2 3a7 7 0 0 0 12-2"/>'
};
const STATUS={red:{name:'需介入',short:'介入'},amber:{name:'需关注',short:'关注'},green:{name:'按计划',short:'按计划'},gray:{name:'未知',short:'未知'}};
const state={mode:'demo',view:'wall',filter:'all',query:'',owner:'all',sort:'health',selected:null};
let draftStorage=true,draftData={};
try{const value=JSON.parse(localStorage.getItem(STORE)||'{}');if(value&&typeof value==='object'&&!Array.isArray(value))draftData=value;}catch{draftStorage=false;}
const el=(tag,attrs,...children)=>{const node=document.createElement(tag);for(const [key,value] of Object.entries(attrs||{})){if(value===null||value===undefined||(value===false&&!key.startsWith('aria-')))continue;if(key==='class')node.className=value;else if(key==='text')node.textContent=value;else if(key.startsWith('on'))node.addEventListener(key.slice(2),value);else if(key==='value')node.value=value;else node.setAttribute(key,key.startsWith('aria-')?String(value):value===true?'':String(value));}for(const child of children.flat(Infinity))if(child!==null&&child!==undefined&&child!==false)node.append(child instanceof Node?child:document.createTextNode(String(child)));return node;};
function icon(name){const span=el('span',{'aria-hidden':'true'});span.innerHTML='<svg viewBox="0 0 24 24">'+(ICONS[name]||ICONS.clock)+'</svg>';return span;}
