<!doctype html>
<html lang="zh" data-skin="ds" data-theme="claude">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BW · 接入项目 · ① 项目地址（克隆远端仓 · 多行地址）</title>
  <link rel="stylesheet" href="../../../../src/renderer/src/workbench/workbench-tokens.css">
  <link rel="stylesheet" href="../../../../src/renderer/src/workbench/workbench-onboard.css">
  <link rel="stylesheet" href="../../../../src/renderer/src/workbench/workbench-wall.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pt-shell">
  <aside class="pt-sidebar" aria-label="Orca 侧栏示意">
    <a class="pt-proj" href="wall.html" title="项目墙"><span class="pt-avatar">W</span><span class="pt-proj-name">Workbench</span></a>
    <nav class="pt-nav" aria-label="项目内导航">
      <a class="pt-nav-item" href="#overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>总览</a>
      <a class="pt-nav-item" href="#plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 10h18M8 2v4M16 2v4"></path></svg>计划</a>
      <a class="pt-nav-item" href="#tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 11l2 2 4-4"></path><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>任务</a>
      <a class="pt-nav-item" href="#acceptance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 3v2h6V3M9 13l2 2 4-4"></path></svg>验收</a>
      <a class="pt-nav-item" href="#automations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>自动化</a>
      <a class="pt-nav-item" href="#knowledge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 4h7a2 2 0 0 1 2 2v14a1 1 0 0 0-1-1H4zM20 4h-7a2 2 0 0 0-2 2v14a1 1 0 0 1 1-1h8z"></path></svg>知识库</a>
    </nav>
    <div class="pt-section">Projects</div>
    <div class="pt-repo is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Workbench</div>
    <div class="pt-repo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>clawd</div>
  </aside>

  <main class="pt-main">
    <div class="wb-onboard-page" aria-label="接入项目" data-screen="onboard">
      <div class="wb-onboard is-batch">
        <header class="page-head">
          <div>
            <h1>接入项目</h1>
            <p class="page-desc">选择仓库，再确认项目基础信息。</p>
          </div>
          <div class="page-actions">
            <a class="wb-btn wb-btn-secondary" href="wall.html">← 项目墙</a>
            <a class="wb-btn wb-btn-ghost" href="wall.html">关闭</a>
          </div>
        </header>

        <div class="ob-steps">
          <span class="ob-step active">① 项目地址</span>
          <span class="ob-step-line"></span>
          <span class="ob-step">② 接入清单</span>
        </div>

        <div class="ob-cards">
          <div class="ob-card">
            <h3>项目地址</h3>
            <div class="seg" role="radiogroup" aria-label="接入方式">
              <a class="seg-opt" href="../prototype.html">打开本地仓</a>
              <label class="seg-opt"><input type="radio" name="ob-repo-kind" checked>克隆远端仓</label>
            </div>

            <div class="field">
              <label>远端仓</label>
              <textarea class="wb-ob-textarea mono" rows="5" placeholder="每行一个：owner/repo 或 https://github.com/owner/repo.git">forcegravity1989/aihot
forcegravity1989/linkcheck-md
https://github.com/forcegravity1989/workflowhub.git
forcegravity1989/builder-workbench</textarea>
              <span class="ob-hint">4 个地址 · 1 个已接入（builder-workbench → Workbench，跳过）</span>
            </div>

            <div class="field">
              <label>父文件夹</label>
              <div class="ob-path-row">
                <input class="wb-ob-input mono" value="/Users/gravity/projects" placeholder="/Users/you/projects">
                <button type="button" class="wb-btn wb-btn-secondary">浏览文件夹</button>
              </div>
              <span class="ob-hint mono">/Users/gravity/projects/&lt;仓名&gt;</span>
            </div>

            <div class="ob-row-head">
              <span class="ob-note">克隆前先读每个仓默认分支上的名片</span>
              <div class="seg" role="radiogroup" aria-label="多仓怎么接">
                <label class="seg-opt"><input type="radio" name="ob-batch-mode" checked>各自成项目</label>
                <label class="seg-opt"><input type="radio" name="ob-batch-mode">合成一个多仓项目</label>
              </div>
            </div>
          </div>

          <div class="ob-actions">
            <span class="ob-summary">3 个待克隆</span>
            <a class="wb-btn wb-btn-primary" href="review.html">下一步：接入清单 →</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
