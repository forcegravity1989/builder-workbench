<!doctype html>
<html lang="zh" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench · 添加项目与项目墙</title>
    <link rel="stylesheet" href="../../04-design-system/styles.css" />
    <link rel="stylesheet" href="prototype/project-settings.css" />
    <script src="prototype/project-wall-data.js" defer></script>
    <script src="prototype/project-wall-views.js" defer></script>
    <script src="prototype/project-wall-dialogs.js" defer></script>
    <script src="prototype/project-settings.js" defer></script>
  </head>
  <body>
    <!-- Refactored #497 / #345 design candidate; all data and writes are in-memory simulations. -->
    <header class="design-bar">
      <strong>添加项目与项目墙</strong><span class="design-badge">设计原型</span>
      <span class="design-note">G1 评审批注版 · 示例人物与数据 · 刷新重置</span
      ><span class="grow"></span> <label class="sr-only" for="viewer">观察身份</label
      ><select id="viewer" class="input">
        <option value="self">我自己的项目墙</option>
        <option value="peer">另一客户端看本机共享墙</option>
      </select>
      <button class="btn btn-ghost" data-action="journey">旅程与信息取舍</button>
      <label class="sr-only" for="scenario">演示场景</label>
      <select id="scenario" class="input">
        <option value="mixed">日常项目</option>
        <option value="empty">首次使用</option>
        <option value="error">主机读取失败</option>
        <option value="many">项目较多</option>
        <option value="add-failure">添加失败</option>
        <option value="info-failure">信息提交失败</option>
        <option value="merged">信息已合入待更新</option>
        <option value="stale">交付依据陈旧</option>
        <option value="cross-version">验收版本不匹配</option>
        <option value="future">验收日期在未来</option>
        <option value="cross-promise">验收承诺不匹配</option>
      </select>
      <button class="btn btn-ghost" data-action="theme" aria-label="切换深浅色">深色</button>
      <button class="btn btn-ghost" data-action="reset">重置</button>
    </header>
    <div class="app-window">
      <header class="app-title">
        <img src="../../../resources/icon.png" alt="" /><strong>Builder Workbench</strong
        ><span class="grow"></span
        ><span class="window-symbols" aria-hidden="true">− &nbsp; □ &nbsp; ×</span>
      </header>
      <div class="app-body">
        <nav id="app-rail" class="app-rail" aria-label="工作台导航"></nav>
        <aside id="project-sidebar" class="project-sidebar" aria-label="项目工作区" hidden></aside>
        <main id="main" tabindex="-1"></main>
        <aside id="config-rail" class="config-rail" aria-label="项目设置" hidden></aside>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" class="prototype-toast" role="status" hidden></div>
  </body>
</html>
