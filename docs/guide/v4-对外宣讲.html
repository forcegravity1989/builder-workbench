<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>把 Workbench 讲给同事听</title>
<style>
  :root{
    --bg:#EFEBE2; --card:#FBFAF6; --card2:#F4F0E7; --rail:#E9E3D7;
    --ink:#23211C; --ink2:#57534A; --ink3:#8C867A; --ink4:#A19B8D;
    --line:#E2DCCF; --line2:#DBD4C5;
    --clay:#C5654A; --clay-ink:#A8432B; --clay-soft:#EFD9CE;
    --green:#6B8E5A; --amber:#D3A24A; --red:#C0463A; --gray:#9A9590;
    --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
    --sans:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  body{display:flex}
  ::selection{background:var(--clay-soft)}

  aside.nav{display:none;width:200px;flex:0 0 200px;height:100vh;background:var(--rail);border-right:1px solid var(--line);padding:16px 0;overflow:auto}
  body.outline aside.nav{display:flex;flex-direction:column}
  .nav .brand{font-family:var(--serif);font-weight:700;font-size:18px;padding:0 16px 12px;border-bottom:1px solid var(--line)}
  .nav .brand i{color:var(--clay);font-style:normal}
  .nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 16px;font:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer;border-left:3px solid transparent}
  .nav button.on{background:var(--clay-soft);color:var(--clay-ink);border-left-color:var(--clay);font-weight:600}

  .deck{flex:1;min-width:0;height:100vh;display:flex;flex-direction:column}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 40px 12px}
  .slide{display:none;width:min(1180px,100%);max-height:100%}
  .slide.on{display:block;animation:in .16s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--clay-ink);font-weight:600;margin-bottom:8px}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,3.6vw,44px);line-height:1.18;letter-spacing:-.02em;margin-bottom:10px}
  .sub{font-size:clamp(15px,1.6vw,19px);color:var(--ink2);line-height:1.5;max-width:40em}

  .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
  .g6{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  @media(max-width:900px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}}

  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px}
  .tile h3{font-size:16px;margin:8px 0 4px}
  .tile p{font-size:13.5px;color:var(--ink2);line-height:1.45}
  .tile .ico{width:44px;height:44px}

  .pair{display:grid;grid-template-columns:1fr 28px 1fr;gap:8px;align-items:center}
  .pair .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-height:86px}
  .pair .box.out{background:var(--card2)}
  .pair .box b{display:block;font-size:14.5px;margin-bottom:4px}
  .pair .box span{font-size:12.5px;color:var(--ink2);line-height:1.4}
  .pair .arr{text-align:center;color:var(--clay);font-size:20px;font-weight:700}

  .chip{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--clay-ink);background:var(--clay-soft);padding:2px 7px;border-radius:4px;margin-right:6px}

  svg.fig{display:block;width:100%;height:auto}
  .figbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:16px}
  .figbox .cap{font-size:11px;color:var(--ink3);letter-spacing:.06em;margin-bottom:8px}

  .ops{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .ops div{background:var(--card2);border-radius:12px;padding:10px 12px}
  .ops b{display:block;font-size:13.5px}
  .ops span{font-size:12.5px;color:var(--ink2);line-height:1.4}

  .whybar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .whybar div{background:var(--card);border-left:3px solid var(--clay);border-radius:0 10px 10px 0;padding:10px 12px}
  .whybar b{display:block;font-size:14px}
  .whybar span{font-size:12.5px;color:var(--ink2)}

  .quote{font-family:var(--serif);font-size:clamp(20px,2.4vw,28px);font-weight:600;line-height:1.35;border-left:4px solid var(--clay);padding:4px 0 4px 16px;margin-top:14px}
  .quote small{display:block;margin-top:6px;font-family:var(--sans);font-size:14px;font-weight:400;color:var(--ink2)}

  footer.bar{flex:0 0 40px;display:flex;align-items:center;gap:12px;padding:0 24px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
  footer.bar .prog{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  footer.bar .prog i{display:block;height:100%;background:var(--clay);width:0}
  footer.bar b{font-family:var(--mono);font-weight:500;color:var(--ink)}
  body.present footer.bar span{display:none}
  body.present footer.bar{opacity:.45}
</style>
</head>
<body>
<aside class="nav" id="nav"></aside>
<div class="deck">
  <div class="stage" id="stage"></div>
  <footer class="bar">
    <b id="num">1 / 10</b>
    <div class="prog"><i id="prog"></i></div>
    <span>左右键翻页 · ?present 投影 · ?outline 大纲</span>
  </footer>
</div>
<script>
var SLIDES = [

{title:"一句话",html:`

    <div class="cap">市面工具停在左边 · Workbench 要回答右边</div>
    <svg class="fig" viewBox="0 0 1040 160" xmlns="http://www.w3.org/2000/svg">

      <text x="218" y="88" text-anchor="middle" font-size="20" font-weight="700" fill="#23211C">看板 · 列表 · 状态</text>
      <text x="218" y="116" text-anchor="middle" font-size="13" fill="#8C867A">不回答「现在该干什么 / 算不算完」</text>
      <path d="M448 80h88" stroke="#C5654A" stroke-width="2.4"/>
      <polygon points="536,80 520,72 520,88" fill="#C5654A"/>
      <rect x="556" y="18" width="476" height="124" rx="14" fill="#FBFAF6" stroke="#C5654A" stroke-width="1.6"/>
      <text x="794" y="58" text-anchor="middle" font-size="15" fill="#A8432B">一张工作台</text>
      <text x="794" y="88" text-anchor="middle" font-size="20" font-weight="700" fill="#23211C">现在该干什么 · 做到什么算完</text>
      <text x="794" y="116" text-anchor="middle" font-size="13" fill="#57534A">活在代码平台 · 灯从数据来 · 完成人点</text>
    </svg>
  </div>
`},

{title:"组里卡住的",html:`
  <div class="k">AI Coding 之下</div>
  <h1>写代码已经不是瓶颈。</h1>
  <p class="sub">组里卡住的是这四件。每一件后面都有对应的特性和设计。</p>
  <div class="g4">
    <div class="tile">
      <svg class="ico" viewBox="0 0 44 44"><rect x="4" y="8" width="14" height="18" rx="2" fill="#EFD9CE"/><rect x="16" y="14" width="14" height="18" rx="2" fill="#C5654A" opacity=".85"/><rect x="26" y="6" width="14" height="18" rx="2" fill="#E2DCCF"/></svg>
      <h3>项目长得不一样</h3>
      <p>每个仓一套目录、一套约定。换项目先换脑子。产出散在群、本机、各人脑子里。</p>
    </div>
    <div class="tile">
      <svg class="ico" viewBox="0 0 44 44"><circle cx="22" cy="22" r="14" fill="none" stroke="#9A9590" stroke-width="3"/><circle cx="22" cy="22" r="6" fill="#E2DCCF"/></svg>
      <h3>没有指标和计划</h3>
      <p>北极星说不清。这周干什么在周报里。健康不健康，开会听口头汇报。</p>
    </div>
    <div class="tile">
      <svg class="ico" viewBox="0 0 44 44"><path d="M8 32 L22 8 L36 32" fill="none" stroke="#C5654A" stroke-width="2.4"/><circle cx="22" cy="8" r="3" fill="#C5654A"/><circle cx="8" cy="32" r="3" fill="#8C867A"/><circle cx="36" cy="32" r="3" fill="#8C867A"/></svg>
      <h3>各人各套工作流</h3>
      <p>提示词、skill、开工工具各用各的。同一类活，做法对不上，质量也对不上。</p>
    </div>
    <div class="tile">
      <svg class="ico" viewBox="0 0 44 44"><rect x="4" y="10" width="16" height="12" rx="2" fill="#E2DCCF"/><rect x="24" y="22" width="16" height="12" rx="2" fill="#EFD9CE"/><path d="M20 16h8M28 22v4" stroke="#C5654A" stroke-width="2"/></svg>
      <h3>系统和群是另一摊</h3>
      <p>活在代码平台，讨论在项目群，干活在本机终端。评审中了、发版了，群里没人知道。</p>
    </div>
  </div>
`},

{title:"三个愿景",html:`
  <div class="k">按愿景讲，别按屏幕讲</div>
  <h1>三件事。</h1>
  <div class="g3">
    <div class="tile">
      <svg class="fig" viewBox="0 0 280 90">
        <rect x="8" y="18" width="70" height="54" rx="8" fill="#EFD9CE"/>
        <rect x="88" y="18" width="70" height="54" rx="8" fill="#EFD9CE"/>
        <rect x="168" y="18" width="70" height="54" rx="8" fill="#EFD9CE"/>
        <text x="123" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#A8432B">管理面 + 项目规范</text>
      </svg>
      <h3>所有项目长一样</h3>
      <p>接入只铺管理面要的信息。项目自己怎么建、怎么跑，跟资产盘点这份剧本走。仓根一个字不擅自写。</p>
    </div>
    <div class="tile">
      <svg class="fig" viewBox="0 0 280 90">
        <circle cx="140" cy="46" r="32" fill="none" stroke="#C5654A" stroke-width="2.2"/>
        <path d="M140 20 v26 h18" fill="none" stroke="#C5654A" stroke-width="2.2"/>
        <text x="140" y="84" text-anchor="middle" font-size="11" fill="#8C867A">每周一圈 · 增量可验收</text>
      </svg>
      <h3>小项目的 Builder</h3>
      <p>每周转一圈。指标从真实数据来，版本目标挂着具体的活，完成永远人点，灯不假绿。</p>
    </div>
    <div class="tile">
      <svg class="fig" viewBox="0 0 280 90">
        <rect x="90" y="16" width="100" height="58" rx="10" fill="#FBFAF6" stroke="#C5654A"/>
        <text x="140" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#23211C">一张台</text>
        <rect x="12" y="28" width="64" height="22" rx="6" fill="#F4F0E7"/><text x="44" y="43" text-anchor="middle" font-size="10" fill="#57534A">CLI</text>
        <rect x="204" y="28" width="64" height="22" rx="6" fill="#F4F0E7"/><text x="236" y="43" text-anchor="middle" font-size="10" fill="#57534A">OD</text>
        <rect x="12" y="56" width="64" height="22" rx="6" fill="#F4F0E7"/><text x="44" y="71" text-anchor="middle" font-size="10" fill="#57534A">平台</text>
        <rect x="204" y="56" width="64" height="22" rx="6" fill="#EFD9CE"/><text x="236" y="71" text-anchor="middle" font-size="10" fill="#A8432B">群</text>
      </svg>
      <h3>一张台打通系统</h3>
      <p>工具缝进来，不自造。Claude 命令行嵌在终端里；原型打开 Open Design；项目配了群才能发一条通知。</p>
    </div>
  </div>
`},

{title:"特性对问题",html:`
  <div class="k">组里的情况 → 用来接住的</div>
  <h1>特性是对上的那一刀。</h1>
  <div class="g6">
    <div class="pair">
      <div class="box out"><b>项目长得不一样</b><span>各仓各套规矩，资产散落</span></div>
      <div class="arr">→</div>
      <div class="box"><b>铺底 + 资产盘点</b><span>铺底只铺管理面（名片、映射、版本）。项目怎么建怎么跑，跟资产盘点剧本：每周对账，首次问你写手册。</span></div>
    </div>
    <div class="pair">
      <div class="box out"><b>没有指标和计划</b><span>周报靠嘴，灯自己点</span></div>
      <div class="arr">→</div>
      <div class="box"><b>指标 + 版本计划</b><span>北极星在名片。灯现算。版本目标在运作活评论。看板 = 代码平台 issue。</span></div>
    </div>
    <div class="pair">
      <div class="box out"><b>各人各套工作流</b><span>同类活做法对不上</span></div>
      <div class="arr">→</div>
      <div class="box"><b>提示词 + 工作流</b><span>开工先读统一要求。构建默认「对齐 → 实现 → 评审」。项目 skill 扫得见。</span></div>
    </div>
    <div class="pair">
      <div class="box out"><b>工具各切各的窗</b><span>命令行 / 设计器 / 编辑器</span></div>
      <div class="arr">→</div>
      <div class="box"><b>借用，不自造</b><span>Claude CLI 嵌在伪终端。原型嵌 Open Design。每活一棵 git 工作树。</span></div>
    </div>
    <div class="pair">
      <div class="box out"><b>群和活对不上</b><span>发版了还要再转述</span></div>
      <div class="arr">→</div>
      <div class="box"><b>项目群通知</b><span>配了群才发得出。本周版本计划 / 新建活 / 合入 / 发版 / 周报往项目自己的群发一条，每件可关。只发不读，不是机器人。</span></div>
    </div>
    <div class="pair">
      <div class="box out"><b>两台机器对不上账</b><span>活不知道记在哪</span></div>
      <div class="arr">→</div>
      <div class="box"><b>活在代码平台</b><span>issue + 标签是正本。本地没有业务库。三种人读同一份，不靠同步。</span></div>
    </div>
  </div>
`},

{title:"规矩和做法",html:`
  <div class="k">关键设计 · 1/2</div>
  <h1>规矩兜住。做法可换。</h1>
  <p class="sub">三层叠在一起：活在平台上，统一要求在提示词里，怎么做在工作流里。</p>
  <div class="figbox">
    <div class="cap">左边两条路径 · 右边开工时 agent 实际读到什么</div>
    <svg class="fig" viewBox="0 0 1040 268" xmlns="http://www.w3.org/2000/svg">
      <rect x="16" y="16" width="300" height="110" rx="12" fill="#F4F0E7" stroke="#DBD4C5"/>

{title:"数和工具",html:`
  <div class="k">关键设计 · 2/2</div>
  <h1>数难造假。工具是缝进来的。</h1>
  <div class="g2">
    <div class="tile">
      <h3>指标三类</h3>
      <svg class="fig" viewBox="0 0 460 120" style="margin:8px 0">
        <rect x="8" y="16" width="140" height="88" rx="10" fill="#EFD9CE"/>
        <text x="78" y="48" text-anchor="middle" font-size="14" font-weight="700">A 能回算</text>

        <rect x="160" y="16" width="140" height="88" rx="10" fill="#FBFAF6" stroke="#DBD4C5"/>
        <text x="230" y="48" text-anchor="middle" font-size="14" font-weight="700">B 不能回算</text>

        <rect x="312" y="16" width="140" height="88" rx="10" fill="#F4F0E7"/>
        <text x="382" y="48" text-anchor="middle" font-size="14" font-weight="700">C 手填</text>
        <text x="382" y="74" text-anchor="middle" font-size="12" fill="#57534A">必须能被看出来</text>
      </svg>
      <p>没数据就是灰，不是绿。没有「把灯点绿」这条路。打开项目会先自动采一轮。B 类读数追加在仓文件，没随合并请求上去，打开远端看不到。</p>
    </div>
    <div class="tile">
      <h3>计划不另写文件</h3>
      <svg class="fig" viewBox="0 0 460 120" style="margin:8px 0">
        <rect x="8" y="20" width="130" height="80" rx="10" fill="#FBFAF6" stroke="#C5654A"/>
        <text x="73" y="54" text-anchor="middle" font-size="13" font-weight="700">issue 评论</text>
        <text x="73" y="76" text-anchor="middle" font-size="11" fill="#A8432B">## 版本目标</text>
        <rect x="164" y="20" width="130" height="80" rx="10" fill="#FBFAF6" stroke="#DBD4C5"/>
        <text x="229" y="54" text-anchor="middle" font-size="13" font-weight="700">版本标签</text>
        <text x="229" y="76" text-anchor="middle" font-size="11" fill="#57534A">bw:plan:v0.x</text>
        <rect x="320" y="20" width="132" height="80" rx="10" fill="#FBFAF6" stroke="#DBD4C5"/>
        <text x="386" y="54" text-anchor="middle" font-size="13" font-weight="700">Release</text>
        <text x="386" y="76" text-anchor="middle" font-size="11" fill="#57534A">先建再打标</text>
      </svg>
      <p>排期拖一下，远端周标签就是新的。完成是关上 issue，不另打完成标签——看板认关单，别只盯着还挂着的旧状态标签。没有第二份周计划账本。</p>
    </div>
    <div class="tile">
      <h3>开工：探活后才开</h3>
      <svg class="fig" viewBox="0 0 460 120" style="margin:8px 0">
        <rect x="8" y="20" width="140" height="80" rx="10" fill="#EFD9CE"/>
        <text x="78" y="54" text-anchor="middle" font-size="13" font-weight="700">Claude CLI</text>
        <text x="78" y="76" text-anchor="middle" font-size="11" fill="#57534A">伪终端 · 看得见可停</text>
        <rect x="160" y="20" width="140" height="80" rx="10" fill="#EFD9CE"/>
        <text x="230" y="54" text-anchor="middle" font-size="13" font-weight="700">Open Design</text>
        <text x="230" y="76" text-anchor="middle" font-size="11" fill="#57534A">本机已开 · 嵌进来</text>
        <rect x="312" y="20" width="140" height="80" rx="10" fill="#F4F0E7"/>
        <text x="382" y="54" text-anchor="middle" font-size="13" font-weight="700">探不通</text>
        <text x="382" y="76" text-anchor="middle" font-size="11" fill="#57534A">拒绝开工 · 不偷换</text>
      </svg>
      <p>远端走 GitHub / CodeHub 命令行。群走 WeLink 命令行。不自造编辑器、聊天、代码平台。</p>
    </div>
    <div class="tile">
      <h3>每活一棵工作树</h3>
      <svg class="fig" viewBox="0 0 460 120" style="margin:8px 0">
        <rect x="20" y="28" width="100" height="64" rx="10" fill="#F4F0E7"/>

        <rect x="180" y="66" width="110" height="40" rx="8" fill="#FBFAF6" stroke="#DBD4C5"/>
        <text x="235" y="92" text-anchor="middle" font-size="12">活 B 目录</text>
        <rect x="330" y="36" width="110" height="52" rx="10" fill="#EFD9CE"/>
        <text x="385" y="68" text-anchor="middle" font-size="13" font-weight="700">人点完成</text>
      </svg>
      <p>agent 最远到「评审中」。定时任务只会自动建活，绝不自动完成活。</p>
    </div>
  </div>
`},

{title:"三种人",html:`
  <div class="k">Workbench 里没有成员和权限</div>
  <h1>三种人，读同一份正本。</h1>
  <p class="sub">协作发生在仓和代码平台上，不发生在 Workbench 里再造一套人。</p>

    <div class="tile">
      <svg class="fig" viewBox="0 0 280 72"><rect x="70" y="10" width="140" height="52" rx="12" fill="#EFD9CE"/><text x="140" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#A8432B">Builder</text></svg>
      <h3>构建者</h3>
      <p>在 Workbench 上转这一圈：定本周、开工、验收处点完成。端到端负责这个项目。</p>
    </div>
    <div class="tile">
      <svg class="fig" viewBox="0 0 280 72"><rect x="70" y="10" width="140" height="52" rx="12" fill="#FBFAF6" stroke="#C5654A"/><text x="140" y="42" text-anchor="middle" font-size="16" font-weight="700">Committer</text></svg>
      <h3>合入者</h3>
      <p>在代码平台审合并请求、点合入。Workbench 不代合。合完，构建者才能点完成。</p>
    </div>
    <div class="tile">
      <svg class="fig" viewBox="0 0 280 72"><rect x="70" y="10" width="140" height="52" rx="12" fill="#F4F0E7"/><text x="140" y="42" text-anchor="middle" font-size="16" font-weight="700">Leader</text></svg>

{title:"为什么用",html:`
  <div class="k">和传统项目管理比</div>
  <h1>换掉的不是谁写代码。</h1>
  <div class="figbox">
    <div class="cap">五个角色靠开会流转 → 一个 Builder + agent 循环</div>
    <svg class="fig" viewBox="0 0 1040 210" xmlns="http://www.w3.org/2000/svg">
      <text x="170" y="22" text-anchor="middle" font-size="13" fill="#8C867A">传统项目管理</text>
      <rect x="40" y="36" width="260" height="28" rx="6" fill="#F4F0E7"/><text x="170" y="55" text-anchor="middle" font-size="13">产品 · 项目 · 技术 · 设计 · 测试</text>
      <rect x="40" y="72" width="260" height="28" rx="6" fill="#F4F0E7"/><text x="170" y="91" text-anchor="middle" font-size="13">十页需求 · 甘特 · 周会汇报</text>
      <rect x="40" y="108" width="260" height="28" rx="6" fill="#F4F0E7"/><text x="170" y="127" text-anchor="middle" font-size="13">信息靠开会流动</text>
      <path d="M330 100 H430" stroke="#C5654A" stroke-width="2.4"/>
      <polygon points="430,100 416,93 416,107" fill="#C5654A"/>
      <text x="380" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#A8432B">换成</text>
      <rect x="450" y="36" width="250" height="52" rx="12" fill="#EFD9CE" stroke="#C5654A"/>
      <text x="575" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#A8432B">1 个 Builder</text>
      <rect x="450" y="104" width="250" height="52" rx="12" fill="#FBFAF6" stroke="#DBD4C5"/>
      <text x="575" y="136" text-anchor="middle" font-size="16" font-weight="700">+ agent 循环</text>
      <rect x="740" y="36" width="270" height="120" rx="12" fill="#FBFAF6" stroke="#C5654A"/>
      <text x="875" y="64" text-anchor="middle" font-size="14" font-weight="700">协作仍有三种人</text>
      <text x="875" y="90" text-anchor="middle" font-size="13" fill="#57534A">Builder · Committer · Leader</text>
      <text x="875" y="114" text-anchor="middle" font-size="13" fill="#57534A">靠同一份正本，不靠开会流转</text>
      <text x="875" y="138" text-anchor="middle" font-size="12" fill="#8C867A">对标 · 北极星 · 原型 · 复盘留下</text>

  </div>
  <div class="quote">「完成」永远由人点。<small>没数据就是灰，不是绿。数字对的是 issue 和已经合入的仓文件，不是本机还没上去的那份。</small></div>
`},

{title:"继续打磨",html:`
  <div class="k">实现落在哪 · 不讲代码细节</div>
  <h1>继续打磨的，是这些剧本和默认链。</h1>
  <p class="sub">管理面骨架不是 skill。核心规范跟资产盘点这份剧本走。定指标和计划是另一份剧本。</p>
  <div class="g2" style="margin-top:12px">
    <div class="tile">
      <span class="chip">不是 skill</span>
      <h3>管理面 · 规范铺底</h3>
      <p>接入时 Workbench 自己写，给总览和计划用：名片、开工映射、规范版本。不起 agent。仓根手册不写。要打磨的是这套骨架过期以后怎么再提一单。</p>
    </div>
    <div class="tile">
      <span class="chip">运作剧本</span>
      <h3>核心规范 · 资产盘点</h3>
      <p>每周：对账规范是否落后、文档和指标新不新鲜，只写建议。首次：才问你写开发手册（项目手册挂在这次上）。到点已经会建一张，绝不自动完成。要打磨的是首次写手册，以及周五这条节奏在真项目上跑实。</p>
    </div>
    <div class="tile">
      <span class="chip">运作剧本</span>
      <h3>定指标和本周 · 版本计划</h3>
      <p>运作活①开工就读这份剧本。一次对话：复盘上周 → 刷新指标（北极星 / 滞后 / 引领，能回算的现算）→ 确认本周 <code>v0.x</code> → 跟人聊出版本目标，写进评论，当场建纳入的活。要打磨的是这场对话在真项目上跑实。</p>
    </div>
    <div class="tile">
      <span class="chip">默认链</span>
      <h3>干活时选什么</h3>
      <p>构建 / 优化 / 运维：Claude 命令行 + 已打包的「对齐 → 实现 → 评审」。原型：Open Design 已嵌，默认工作流还没打包装进 Workbench。映射写在项目自己的开工约定里，可换。</p>
    </div>
  </div>
`},

{title:"开着的位",html:`
  <div class="k">组里的东西对号进来</div>
  <h1>位是开着的。对号是你们的事。</h1>
  <p class="sub">不是缺人填坑。是这些接口设计上就留着，听完自己能对上。</p>
  <div class="g3" style="margin-top:14px">
    <div class="tile">
      <h3>skill 槽</h3>
      <p>运作剧本和默认工作流走同一条：开工只给路径，agent 读文件。项目仓里的 skill 已经扫得见。做优质 skill、做部门技能市场的，往这里供。</p>
    </div>
    <div class="tile">
      <h3>项目助手 / 项目群</h3>
      <p>今天只能往项目本来就有的群发一条（评审中 / 合入 / 发版）。员工助手、数字员工，补成真正跟群打通的项目助手。还是这个位，不是另造一个群。</p>
    </div>
    <div class="tile">
      <h3>知识库</h3>
      <p>九屏里已经有这一屏：仓里的规范树，加上代码图。更深的检索、更好的代码理解、组里现成的知识底座，按这个屏往里缝。</p>
    </div>
    <div class="tile">
      <h3>开工工具</h3>
      <p>今天两条：Claude 命令行、Open Design。每张活选一个，探不通就灰，不偷换。别的成熟开工工具按探活声明接。</p>
    </div>
    <div class="tile">
      <h3>代码平台</h3>
      <p>issue、合并请求、发版走你已经在用的平台。今天 GitHub 和 CodeHub 两条命令行臂。别的平台按同样的位加一条。</p>
    </div>
    <div class="tile">
      <h3>做完提炼成 skill</h3>
      <p>蒸馏是活的附属动作：把一件做完的活收成带做法的 skill，永远记着来自哪张活。按钮在，命令还要接。组里有更好的蒸馏，也是这个位。</p>
    </div>
  </div>
`}

  var q = new URLSearchParams(location.search);
  if(q.has('outline')) document.body.classList.add('outline');
  if(q.has('present')) document.body.classList.add('present');
  var stage = document.getElementById('stage');
  var nav = document.getElementById('nav');
  var num = document.getElementById('num');
  var prog = document.getElementById('prog');
  var i = 0;
  nav.innerHTML = '<div class="brand">Workbench<i>.</i></div>' +
    SLIDES.map(function(s,idx){ return '<button data-i="'+idx+'">'+(idx+1)+'　'+s.title+'</button>'; }).join('');
  function show(n){
    if(n<0||n>=SLIDES.length) return;
    i = n;
    stage.innerHTML = '<article class="slide on">'+SLIDES[i].html+'</article>';
    num.textContent = (i+1)+' / '+SLIDES.length;
    prog.style.width = ((i+1)/SLIDES.length*100)+'%';
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function(b,idx){ b.classList.toggle('on', idx===i); });
    if(history.replaceState) history.replaceState(null,'', location.pathname + location.search + '#' + (i+1));
  }
  nav.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    show(+b.getAttribute('data-i'));
  });
  document.addEventListener('keydown', function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') { e.preventDefault(); show(i+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp') { e.preventDefault(); show(i-1); }
    else if(e.key==='Home') show(0);
    else if(e.key==='End') show(SLIDES.length-1);
  });
  var fromHash = parseInt((location.hash||'').replace('#',''),10);
  if(fromHash>=1 && fromHash<=SLIDES.length) show(fromHash-1);
  else show(0);
})();
</script>
</body>
</html>
