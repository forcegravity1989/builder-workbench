[package]
name = "bw"
description = "V4 内核:仓是正本、本地零库,远端 issue 映射 + 仓文件解析 + 现算推导 + 命令/事件总线。"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# 干活入口:交互式执行器 + 工作区/worktree 供给 + git 读数,全部沿用。
bw-engine = { workspace = true }

# process/fs:起 git 子进程与读写仓文件;net:Open Design 的本机端口探活。
tokio = { workspace = true, features = ["process", "fs", "net", "io-util"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
time = { workspace = true, features = ["std", "formatting", "parsing", "macros", "local-offset"] }
uuid = { workspace = true, features = ["v4"] }
# `.bw/managed.toml` 的指纹(03 篇 §3.1:sha256:<hex>)。已在 lock 里,不新增下载。
sha2 = "0.10"
# Windows 路径规范化去掉 `\\?\` 前缀;接入项目按真实仓根判重。
dunce = "1.0.5"

[dev-dependencies]
tokio = { workspace = true }
