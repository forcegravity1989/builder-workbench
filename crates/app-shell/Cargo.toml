[package]
name = "app-shell"
description = "Workbench MVP 桌面壳(Dioxus 0.7 / wry):五入口 + 顶层三屏,一屏一目录,一个外部能力一个适配模块。"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
# 共存期用这个名字,和旧壳的 builders-workbench 分得开;删旧壳那次改回去。
name = "bw-dev"
path = "src/main.rs"

[dependencies]
# 与旧壳同一个 hard-pin(=0.7.9)。desktop feature = wry WebView。
dioxus = { workspace = true, features = ["desktop"] }
bw-engine = { workspace = true }
bw = { workspace = true }
tokio = { workspace = true }
time = { workspace = true, features = ["std"] }
uuid = { workspace = true }
# JSON 字面量序列化(VM 经 document::eval 注入 WebView 等)。
serde_json = { workspace = true }
# 知识库屏渲染仓内 Markdown。只进这个 crate,内核零新增依赖。
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
# 接入页「打开本地仓」的原生目录选择器。Dioxus desktop 已间接依赖同版本,
# 这里显式声明,不靠传递依赖。
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# 嵌 Windows 图标资源(仅 Windows 目标,GNU 走 windres / MSVC 走 rc)。
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
