name: 提出需求
description: 提出 Workbench 的具体用户需求或改进
title: '[Feature]: '
type: Feature
labels:
  - Feature
body:
  - type: markdown
    attributes:
      value: |
        先查已有 Issue。描述用户问题与可判断的结果，方案可以待定；不要将旧实现或未经确认的设想直接当成开发承诺。
  - type: textarea
    id: problem
    attributes:
      label: 问题与范围
      description: 为谁解决什么问题？本次处理哪些范围？可写已有替代、关联 Issue 或原型。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 用户获得什么结果、怎样判断？需要先讨论的范围或判据写待确认。
    validations:
      required: true
