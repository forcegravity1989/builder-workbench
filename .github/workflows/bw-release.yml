name: BW Release Windows

# Why this file exists: the workbench-release skill drives stable version
# releases. Packaging and publishing are fixed, network-heavy actions that
# belong on a GitHub runner — local machines behind the corporate proxy
# cannot upload ~190MB installers (the proxy 403s oversized POSTs), and local
# builds also fight MAX_PATH worktrees and proxy-degraded downloads. This is
# the release-side counterpart of bw-package.yml: bw-package publishes an
# ADHOC-tagged prerelease for the acceptance screen's 出包 block; this
# workflow publishes the stable v<version> release with all three updater
# assets, from the release notes the skill prepared and confirmed locally.
#
#   gh workflow run bw-release.yml --ref main \
#     -f version=0.6.0 -F notes=@release-notes.md
#
# The artifacts are stamped with the release version input verbatim, so the
# tag v<version>, latest.yml's version, and the installed app's self-reported
# version all agree — the in-app updater (#338) decides "newer" by comparing
# that one string, and a -local build id here would strand every installer of
# this release at "already up to date" forever (v0.6.0's split ledger). A
# version containing "-rc" is published with --prerelease. The file name
# intentionally does NOT start with `bw-package` — the acceptance screen's
# package-pipeline dropdown must not list it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: '稳定版本号（不含 v 前缀），如 0.6.0；tag 为 v<version>，含 -rc 则标记 prerelease'
        required: true
        type: string
      notes:
        description: '版本说明全文（多行，按 release-notes 规范写好并经人确认）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-win:
    # Why windows-2022 and not windows-latest: the 2025/VS2026 image breaks
    # node-gyp native installs (same pin as the upstream Windows build legs).
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout the dispatched ref
        uses: actions/checkout@v6
        with:
          # The release step writes through gh with the workflow token; the
          # checkout itself never pushes (zizmor: artipacked).
          persist-credentials: false

      # pnpm must be on PATH before setup-node so setup-node can locate the store.
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      # Why before the build: refuse early instead of burning a full package
      # run on a version that is already released.
      - name: Guard against existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Same shape as release-win-workbench.mjs's WORKBENCH_RELEASE_TAG_PATTERN:
          # the package is stamped with this string, so anything else splits the ledger.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+\.[0-9]+)?$ ]]; then
            echo "::error::version '$VERSION' is not X.Y.Z or X.Y.Z-rc.YYYYMMDD.N"
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists — refusing to overwrite"
            exit 1
          fi
          echo "v$VERSION is free; will release ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"

      # Why retried: pnpm install pulls the Electron binary from GitHub release
      # assets and that CDN returns transient 504s often enough to lose a build.
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - name: Resolve build identity
        id: identity
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          commit="$(echo "$GITHUB_SHA" | cut -c1-12)"
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "Building Workbench $VERSION from ${GITHUB_REF_NAME} ($commit)"

      - name: Build Workbench Windows installer
        shell: bash
        run: pnpm run build:win:workbench
        env:
          # Why the adhoc channel flag: without it electron-builder stamps
          # publisherName 'SignPath Foundation' onto this unsigned build, and a
          # declared publisher that fails signature verification makes the
          # in-app updater reject the package. The flag also switches version
          # injection to ORCA_ADHOC_BUILD_VERSION — ORCA_LOCAL_BUILD_VERSION is
          # ignored while any Windows dev channel is active. The injected value
          # is the release version verbatim, NOT a -local build id: the flag is
          # only the unsigned-build channel; the package must self-report the
          # version its tag promises (#338).
          ORCA_WIN_ADHOC: '1'
          ORCA_ADHOC_BUILD_VERSION: ${{ steps.identity.outputs.version }}

      - name: Verify the three updater assets and the version ledger
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ls -la dist/
          test -f dist/orca-windows-setup.exe
          test -f dist/orca-windows-setup.exe.blockmap
          test -f dist/latest.yml
          # Ledger gate: latest.yml's version is what the in-app updater compares
          # against; if it differs from the release version, every installed copy
          # of this release strands on a version no future release can exceed.
          manifest_version="$(sed -n 's/^version:[[:space:]]*//p' dist/latest.yml | head -1 | tr -d "\"'")"
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "::error::latest.yml version '$manifest_version' != release version '$VERSION' — refusing to publish a split ledger"
            exit 1
          fi

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTES" > release-notes.md
          case "$VERSION" in
            *-rc*)
              gh release create "v$VERSION" dist/orca-windows-setup.exe \
                dist/orca-windows-setup.exe.blockmap dist/latest.yml \
                --target "$GITHUB_SHA" \
                --title "Workbench $VERSION" \
                --notes-file release-notes.md \
                --prerelease
              ;;
            *)
              gh release create "v$VERSION" dist/orca-windows-setup.exe \
                dist/orca-windows-setup.exe.blockmap dist/latest.yml \
                --target "$GITHUB_SHA" \
                --title "Workbench $VERSION" \
                --notes-file release-notes.md
              ;;
          esac
          gh release view "v$VERSION" --json url,tagName,isPrerelease,assets
