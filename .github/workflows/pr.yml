name: Workbench CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    # Why no paths filter: trigger-level path filters drop the check entirely on
    # excluded PRs (the lesson the old code_paths detector encoded). If verify is
    # ever made a required check, docs-only PRs would hang without a report.
    # Every PR gets the full Workbench CI instead.
  workflow_dispatch:

concurrency:
  group: workbench-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-host:
    name: Shared host protocols and lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      # The old flat test paths were replaced by suites around their current owners.
      # Legacy direct-SSH relay-only fixtures have no paired-host equivalent.
      # Exercise the native network owners as well as the BW overlay suites below.
      # Fixtures cannot establish two-machine Windows acceptance or account access.
      - name: Test shared host pairing, transport and subscription contracts
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/ipc/runtime-environments/requests/runtime-environment-idle-stop-resume.test.ts
          src/cli/runtime/connection/transport-framing.test.ts
          src/main/runtime/rpc/mobile/e2ee/remote-runtime-client-framing.integration.test.ts
          src/main/runtime/rpc/server/pairing/pairing-ticket-exchange.test.ts
          src/main/runtime/rpc/server/runtime-rpc-team-read-policy.test.ts
          src/renderer/src/workbench/builder-hosts-import.test.ts
          src/shared/remote-runtime/e2ee/mobile-e2ee-v2-framing.test.ts
          src/shared/remote-runtime/e2ee/node/mobile-e2ee-v2-node-key-schedule.test.ts
          src/shared/remote-runtime/host-store/runtime-environment-store-unreadable-records.test.ts
          src/shared/remote-runtime/session-graph/session-tabs-tab-delta.test.ts
      - name: Test shared host recovery, launch and close contracts
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/renderer/src/store/repos/dropped-repo-worktree-rows.test.ts
          src/renderer/src/runtime/web-session-tabs-sync-editor-restart.test.ts
          src/main/runtime/session-graph/renderer-status-replica.test.ts
          src/main/runtime/workspaces/catalog/scoped-worktree-row-resolution.test.ts
          src/main/runtime/workspaces/creation/runtime-branch-reuse-real-git.test.ts
          src/main/runtime/workspaces/lifecycle/workspace-lifecycle-queue.test.ts
          src/main/runtime/workspaces/removal/runtime-local-worktree-removal-identity.test.ts
          src/main/runtime/worktree-selector-miss-runtime.test.ts
          src/main/runtime/worktree-selector-miss.test.ts
          src/main/workspaces/catalog/repo-worktree-catalog-owner.test.ts
          src/renderer/src/components/terminal-pane/pty-transport/remote-runtime/remote-runtime-pty-transport-input-replay.test.ts
          src/renderer/src/runtime/hosted-terminals/streams/remote-runtime-terminal-frame-drop-resync.test.ts
          src/renderer/src/workbench/project-source-resolution.test.ts
          src/renderer/src/workbench/version-cycle/native-session.test.ts
          src/renderer/src/workbench/version-cycle/native-workspace.test.ts

  browser-annotations:
    name: Browser annotation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - name: Check annotation, clipboard and navigation contracts
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/shared/browser-annotation-viewport-bridge.test.ts
          src/main/browser/client-hosts/lifecycle/paired-runtime-browser-client-host-registry.test.ts
          src/renderer/src/components/browser-pane/assemble-chrome/BrowserPane.render-ipc.test.ts
          src/renderer/src/components/browser-pane/host-guest/browser-page-annotation-retention.test.ts

  codex-windows:
    name: Windows Codex protocol and lifecycle
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Keep native-addon intermediates below MAX_PATH while retaining the
      # workspace's node-gyp resolution for rebuilds run from package dirs.
      PNPM_CONFIG_VIRTUAL_STORE_DIR: '.p'
      PNPM_CONFIG_VIRTUAL_STORE_DIR_MAX_LENGTH: '32'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      # Account-free protocol checks; these do not launch Electron or prove
      # that a signed-in Codex conversation works in the Windows Chat UI.
      - name: Test Codex transport and session lifecycle
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/codex/codex-daemon-socket-path-guard.test.ts
          src/main/codex-accounts/codex-config-mirror.test.ts
          src/main/codehub/service.test.ts
          src/main/codex-accounts/managed-homes/host-codex-managed-home-ownership.test.ts
          src/main/codex-accounts/runtime-home/credentials/runtime-home-system-default-snapshot.test.ts
          src/main/codex-accounts/runtime-home/legacy-host/legacy-shared-auth-migration.test.ts
          src/main/codex/app-server/codex-app-server-client.test.ts
          src/main/codex/app-server/shared-servers/codex-shared-server-close.performance.test.ts
          src/main/codex/app-server/shared-servers/codex-shared-server-pool.test.ts
          src/main/codex/history/resume/codex-session-resume-home.test.ts
          src/main/native-chat/agent-session-wire/recovery/structured-agent-session-usage-limit-relaunch.test.ts

      - name: Test runtime bootstrap, credential permissions and WSL fallback
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/shared/secure-storage/secure-file.test.ts
          src/shared/secure-file-async.test.ts
          src/shared/secure-storage/secure-path-windows-acl.win32.test.ts
          src/main/runtime/rpc/server/pairing/mobile-pairing-userdata-path.test.ts
          src/main/runtime/rpc/server/pairing/unreadable-secret-store-preservation.win32.test.ts
          src/main/cli/wsl/wsl-cli-powershell-boundary.test.ts
          src/main/ipc/mobile-runtime-bind-host.test.ts
          src/main/runtime/host-instance-identity.test.ts
          src/main/runtime/terminal/launch/wsl-host-agent-terminal-launch.test.ts

  verify:
    name: lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node dependencies
        id: install
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          cache-electron-package: 'true'

      - name: Test DSH CLI integration contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/dsh/dsh-integration.test.ts
          src/main/dsh/dsh-hook-packages.test.ts
          src/main/agent-hooks/installation/testing/installer-contract.test.ts
          src/main/agent-hooks/server/testing/persistence/server-last-status-migration.test.ts
          src/main/agent-hooks/server/testing/presence/server-marked-exit-overlap.test.ts
          src/main/dsh/dsh-home-patch.test.ts

      - name: Test Issue association calculation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test .github/scripts/pr-issue-audit.test.mjs

      - name: Test share service
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test "services/bw-share/test/*.test.mjs"

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run typecheck

      - name: Test share client protocols
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/artifacts/share-html-inline.test.ts
          src/main/artifacts/self-hosted-share-service.test.ts

      - name: Test Workbench contracts and count ratchet
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:vitest-count-ratchet

      - name: Test native reporting and repository integration code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/persistence-workspace-default.test.ts
          src/main/observability/bundle.test.ts
          src/main/telemetry/client-workbench-transport.test.ts
          src/main/telemetry/consent.test.ts
          src/main/telemetry/picker-accept-rollup.test.ts
          src/main/ipc/w3-account-ipc.test.ts
          src/main/w3-account/w3-account-config.test.ts
          src/main/w3-account/w3-account-identity.test.ts
          src/main/w3-account/w3-account-session-store.test.ts
          src/main/w3-account/w3-session-bridge.test.ts
          src/renderer/src/components/settings/navigation/settings-navigation-w3-account.test.ts
          src/main/codehub/comments.test.ts
          src/main/codehub/issue-state.test.ts
          src/main/codehub/mr-reads.test.ts
          src/main/codehub/mutations.test.ts
          src/main/codehub/repo-reads.test.ts
          src/main/codehub/service.test.ts
          src/main/codehub/work-items.test.ts
          src/renderer/src/lib/codehub-api.test.ts
          src/renderer/src/components/task-page/codehub/codehub-detail-cache.test.ts
          src/renderer/src/components/task-page/codehub/controls.test.tsx
          src/shared/task-item-link.test.ts
          src/cli/handlers/workbench-materials.test.ts
          src/main/github/client/fetch/authenticated-viewer.test.ts
          src/main/workspaces/catalog/worktree-identity-persistence.test.ts
          src/renderer/src/workbench/project-source-resolution.test.ts
          src/renderer/src/workbench/workbench-wall-projects.test.ts

      - name: Test native usage protocols and account integration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/rate-limits/cursor-auth.test.ts
          src/main/rate-limits/cursor-usage-protocol.test.ts
          src/main/rate-limits/providers/antigravity/antigravity-usage-fetcher.test.ts
          src/main/rate-limits/providers/opencode-go/opencode-go-usage-api.test.ts
          src/main/rate-limits/service-cursor-usage.test.ts
          src/main/rate-limits/service/service-activation-refresh.test.ts
          src/main/codex/structured/catalog/codex-usage-limits.test.ts
          src/renderer/src/components/status-bar/usage/use-owner-usage-rate-limits.test.tsx
          src/renderer/src/lib/workspace/ownership/visible-account-surface.test.ts

      - name: Test restored automation and update contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/updater/recoverable-update-feed.test.ts
          src/main/updater/releases/updater-release-policy.test.ts
          src/main/updater/resumable-update-download.test.ts
          src/renderer/src/components/automations/AutomationsPage.editor-request.test.tsx
          src/renderer/src/store/slices/ui-automation-editor.test.ts
          src/shared/automation-run-prompt.test.ts

      - name: Test Cursor hook and continuation protocols
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/agent-hooks/installation/testing/installer-contract.test.ts
          src/main/ai-vault/scanners/cursor/session-scanner-cursor-acp-sessions.test.ts
          src/main/codex/history/resume/codex-session-resume-home.test.ts
          src/main/codex/hooks/installation/windows-hook-command.test.ts
          src/main/rate-limits/cursor-auth.test.ts
          src/main/rate-limits/cursor-usage-protocol.test.ts

      - name: Test native Bot requests, groups, connectors and automation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/bots/bot-home.test.ts
          src/main/bots/bot-request-settlement.test.ts
          src/main/bots/bot-group-follow-up-mail.test.ts
          src/main/bots/tool-oauth/bot-tool-oauth.test.ts
          src/main/runtime/rpc/methods/bots-items-worker-origin.test.ts
          src/main/runtime/rpc/methods/bots-items-waiting-compat.test.ts
          src/main/runtime/rpc/methods/orchestration/federation/paired-server-asks.test.ts
          src/main/automations/bot-trigger-people.test.ts
          src/renderer/src/components/bots/paired-server-asks.test.tsx
          src/renderer/src/components/bots/items/use-bot-item-question-steps.test.tsx

      - name: Build desktop application
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run build:desktop:assets

  e2e:
    name: Workbench Electron PR E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    # The Workbench build-time flags (WORKBENCH_SHELL / VITE_WORKBENCH_SHELL /
    # ORCA_PRODUCT_NAME) are baked by tests/e2e/global-setup.ts into the
    # electron-vite build it runs — one source for CI, macOS and Windows.

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          cache-electron-package: 'true'

      - name: Ensure Chinese text is readable in screenshots
        run: |
          # packages.microsoft.com 在托管 runner 上间歇 403，会令 apt-get update 整体失败（exit 100）；
          # 该源与 CJK 字体无关，更新前先移除，其余源的失败仍会阻断本步骤。
          sudo rm -f /etc/apt/sources.list.d/microsoft*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Run Workbench PR E2E allowlist
        run: xvfb-run --auto-servernum pnpm run test:e2e:workbench

      # Preserve successful journey screenshots as well as failure diagnostics.
      - name: Upload Workbench PR E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-pr-e2e-results
          path: test-results/
          if-no-files-found: ignore
