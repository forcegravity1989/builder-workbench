name: Workbench CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    # Why no paths filter: trigger-level path filters drop the check entirely on
    # excluded PRs (the lesson the old code_paths detector encoded). If verify is
    # ever made a required check, docs-only PRs would hang without a report.
    # Every PR gets the full Workbench CI instead.
  workflow_dispatch:

concurrency:
  group: workbench-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-host:
    name: Shared host protocols and lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      # Exercise the native network owners as well as the BW overlay suites below.
      # Fixtures cannot establish two-machine Windows acceptance or account access.
      - name: Test shared host pairing, transport and subscription contracts
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/shared/remote-runtime-
          src/shared/runtime-environment-store.test.ts
          src/shared/runtime-client-export-parity.test.ts
          src/main/ipc/runtime-environment
          src/cli/runtime/environments.test.ts
      - name: Test shared host recovery, launch and close contracts
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/renderer/src/store/repos/dropped-repo-worktree-rows.test.ts
          src/renderer/src/store/slices/runtime-status
          src/renderer/src/runtime/host-session-mirror-
          src/renderer/src/runtime/restored-client-hosted-browser-host-restart-attach.test.ts
          src/renderer/src/runtime/sync-runtime-graph-browser.test.ts
          src/renderer/src/runtime/use-runtime-session-mirror-environment-key.test.ts
          src/renderer/src/runtime/web-runtime-session-terminal-
          src/renderer/src/runtime/web-session-tabs-sync-
          src/renderer/src/components/terminal-pane/remote-runtime-pty-transport-
          src/renderer/src/components/terminal-pane/use-terminal-pane-lifecycle.test.ts
          src/renderer/src/components/terminal/terminal-tab-
          src/renderer/src/components/terminal/terminal-close-confirm-keyboard-vs-mouse.test.ts
          src/renderer/src/components/terminal-workspace-keydown.test.ts
          src/renderer/src/components/settings/AgentsPane.test.tsx
          src/renderer/src/components/agent/AgentSettingsDialog.test.tsx
          src/renderer/src/components/agent-session-continuation/AgentSessionContinuationDialog.test.tsx
          src/renderer/src/components/tab-bar/QuickLaunchButton.test.ts
          src/renderer/src/components/tab-bar/TabBar.windows-shell-remote-runtime.test.ts
          src/renderer/src/hooks/legacy-worker-terminal-recovery-event.test.ts
          src/renderer/src/lib/launch-agent-
          src/renderer/src/lib/runtime-session-mirror-targets.test.ts
          src/renderer/src/hooks/composer-state
          src/renderer/src/hooks/useComposerState
          src/renderer/src/components/NewWorkspaceComposerCard
          src/renderer/src/components/sidebar/folder-workspace-composer-submit.test.ts
          src/renderer/src/components/sidebar/rendered-sidebar-worktree-order.test.ts
          src/renderer/src/lib/fix-checks-agent-launch.test.ts
          src/renderer/src/lib/worktree-creation-flow
          src/renderer/src/lib/worktree-activation
          src/renderer/src/lib/worktree-creation-agent-seeding.test.ts
          src/renderer/src/lib/worktree-creation-structured-session.test.ts
          src/renderer/src/lib/pending-worktree-creation.test.ts
          src/renderer/src/components/dashboard/launch-dashboard-agent.test.ts
          src/renderer/src/components/dashboard/dashboard-worktree-launch-options.test.ts
          src/renderer/src/components/dashboard/build-dashboard-snapshot
          src/renderer/src/components/dashboard/useLiveDashboardSnapshot.test.ts
          src/renderer/src/components/dashboard/useDashboardPopoutBridge.test.tsx
          src/renderer/src/store/slices/worktrees-remote-runtime-create.test.ts
          src/renderer/src/store/slices/repos-project-groups.test.ts
          src/renderer/src/store/slices/repos-project-groups-delete.test.ts
          src/renderer/src/store/slices/repos-project-groups-owner-routing.test.ts
          src/renderer/src/store/slices/project-group-removal-targets.test.ts
          src/renderer/src/components/sidebar/ProjectGroupDeleteDialog.test.tsx
          src/renderer/src/components/sidebar/worktree-list/rows/use-project-group-dialogs-owner-host.test.tsx

  browser-annotations:
    name: Browser annotation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - name: Check annotation, clipboard and navigation contracts
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/shared/browser-annotation-viewport-bridge.test.ts
          src/renderer/src/components/browser-pane/annotate/browser-annotation-output.test.ts
          src/renderer/src/components/browser-pane/annotate/useGrabMode.test.ts
          src/renderer/src/components/browser-pane/annotate/browser-page-annotation-tray.test.tsx
          src/renderer/src/components/browser-pane/annotate/BrowserAnnotationSendMenuContent.test.tsx
          src/renderer/src/components/browser-pane/host-guest/browser-page-favicon-retention.test.ts
          src/renderer/src/components/browser-pane/describe-page/browser-annotation-geometry.test.ts
          src/renderer/src/store/slices/browser.test.ts
          src/renderer/src/lib/app-menu-paste.test.ts
          src/renderer/src/components/native-chat/use-native-chat-composer-paste.test.tsx
          src/renderer/src/components/native-chat/use-native-chat-composer-attachments.test.tsx
          src/main/browser/browser-manager-annotation-bridge.test.ts

  codex-windows:
    name: Windows Codex protocol and lifecycle
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Keep native-addon intermediates below MAX_PATH while retaining the
      # workspace's node-gyp resolution for rebuilds run from package dirs.
      PNPM_CONFIG_VIRTUAL_STORE_DIR: '.p'
      PNPM_CONFIG_VIRTUAL_STORE_DIR_MAX_LENGTH: '32'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      # Account-free protocol checks; these do not launch Electron or prove
      # that a signed-in Codex conversation works in the Windows Chat UI.
      - name: Test Codex transport and session lifecycle
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/codex/codex-app-server-connection.test.ts
          src/main/codex/codex-app-server-process-teardown.test.ts
          src/main/codex/codex-structured-session-close.test.ts
          src/main/codex/codex-structured-session-cancel.test.ts
          src/main/codex/codex-structured-launch-resolution.test.ts
          src/main/codex/codex-session-index-heal.test.ts
          src/main/codex-accounts/codex-credential-absence-grace.test.ts
          src/main/codex-accounts/codex-windows-interactive-login.test.ts
          src/main/codex-accounts/service-login-process-teardown.test.ts
          src/main/rate-limits/codex-
          src/main/rate-limits/service-inactive-account-previews.test.ts

      - name: Test runtime bootstrap, credential permissions and WSL fallback
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/shared/secure-file.test.ts
          src/shared/secure-file-async.test.ts
          src/shared/secure-path-windows-acl.win32.test.ts
          src/main/runtime/mobile-pairing-userdata-path.test.ts
          src/main/runtime/rpc/mobile-auth-acl-critical-path.test.ts
          src/main/runtime/runtime-metadata.test.ts
          src/main/runtime/runtime-metadata-ownership-watch.test.ts
          src/main/runtime/runtime-rpc-metadata-lifecycle.test.ts
          src/main/runtime/runtime-rpc-websocket-bind-host.test.ts
          src/main/runtime/unreadable-secret-store-preservation.win32.test.ts
          src/main/git/runner-wsl-gh-fallback.test.ts
          src/main/gitlab/gitlab-known-host-probe-wsl-fallback.test.ts

  verify:
    name: lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          cache-electron-package: 'true'

      - name: Test DSH CLI integration contracts
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/dsh/dsh-integration.test.ts
          src/main/dsh/dsh-hook-packages.test.ts
          src/shared/agent-process-recognition.test.ts
          src/shared/agent-session-resume.test.ts
          src/shared/tui-agent-startup.test.ts
          src/main/agent-hooks/managed-hook-script-refresh.test.ts
          src/main/agent-hooks/managed-hook-command-contract.test.ts
          src/main/agent-hooks/server-retired-pane-new-turn.test.ts

      - name: Test Issue association calculation
        run: node --test .github/scripts/pr-issue-audit.test.mjs

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test Workbench contracts and count ratchet
        run: pnpm run check:vitest-count-ratchet

      - name: Test native reporting and repository integration code
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/persistence-workspace-default.test.ts
          src/main/ipc/repos
          src/main/ipc/feedback.test.ts
          src/main/ipc/feedback-image-attachments.test.ts
          src/main/ipc/diagnostics.test.ts
          src/main/ipc/telemetry.test.ts
          src/main/ipc/preflight-command-exec.test.ts
          src/main/ipc/preflight-host-cli-status.test.ts
          src/main/observability/bundle.test.ts
          src/main/observability/architecture.test.ts
          src/main/telemetry
          src/main/codehub
          src/preload/api/platform-bridge.test.ts
          src/renderer/src/lib/codehub-api.test.ts
          src/renderer/src/components/task-page/codehub
          src/renderer/src/components/feature-wall/use-integration-connection-status.test.ts
          src/renderer/src/components/feature-wall/feature-wall-setup-progress.test.ts
          src/renderer/src/components/setup-guide/use-setup-guide-progress.test.ts
          src/renderer/src/components/setup-guide/use-setup-guide-telemetry.test.ts
          src/renderer/src/lib/feature-education-telemetry.test.ts
          src/shared/telemetry-events-feature-education.test.ts
          src/renderer/src/components/settings/settings-setup-guide-progress.test.ts
          src/renderer/src/components/sidebar/RemoveFolderDialog.test.tsx
          src/renderer/src/store/slices/repos-cross-host-project-collisions.test.ts
          src/renderer/src/store/slices/repos-host-identity-routing.test.ts
          src/shared/git-remote-identity.test.ts

      - name: Test native usage protocols and account integration
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/rate-limits
          src/main/claude-accounts/keychain.test.ts
          src/main/ipc/register-core-handlers/register-core-handlers.test.ts
          src/shared/rate-limit-types.test.ts
          src/renderer/src/components/status-bar/status-bar-provider-visibility.test.ts
          src/renderer/src/store/slices/ui-hydration-workspace-preferences.test.ts
          src/renderer/src/web/web-preload-api-composition.test.ts

      - name: Test Cursor hook and continuation protocols
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/cursor
          src/main/claude/hook-service.test.ts
          src/main/agent-hooks/windows-powershell-hook-launcher.test.ts
          src/main/agent-hooks/installer-utils.test.ts
          src/main/ai-vault/session-scanner-cursor-chat-meta.test.ts
          src/shared/agent-session-option-catalog.test.ts
          src/shared/agent-session-option-catalog-grok.test.ts
          src/shared/tui-agent-startup-session-options.test.ts
          src/shared/agent-session-resume.test.ts
          src/shared/agent-resume-argv-drop.test.ts
          src/shared/agent-resume-launch-command.test.ts
          src/renderer/src/runtime/agent-resume-host-authority-capability.test.ts

      - name: Build desktop application
        run: pnpm run build:desktop

  e2e:
    name: Workbench Electron smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    # The Workbench build-time flags (WORKBENCH_SHELL / VITE_WORKBENCH_SHELL /
    # ORCA_PRODUCT_NAME) are baked by tests/e2e/global-setup.ts into the
    # electron-vite build it runs — one source for CI, macOS and Windows.

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          cache-electron-package: 'true'

      - name: Ensure Chinese text is readable in screenshots
        run: |
          # packages.microsoft.com 在托管 runner 上间歇 403，会令 apt-get update 整体失败（exit 100）；
          # 该源与 CJK 字体无关，更新前先移除，其余源的失败仍会阻断本步骤。
          sudo rm -f /etc/apt/sources.list.d/microsoft*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Run Workbench smoke
        run: xvfb-run --auto-servernum pnpm run test:e2e:workbench

      # Preserve successful journey screenshots as well as failure diagnostics.
      - name: Upload Workbench smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-smoke-test-results
          path: test-results/
          if-no-files-found: ignore
