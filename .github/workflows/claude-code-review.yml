# PR 自动评审。谈定见 changes/reviewer-agent/;codehub 仓走 Workbench 内建「请评审」。
# 前提(人做一次):给仓装 Claude GitHub App + 配 secret CLAUDE_CODE_OAUTH_TOKEN。
name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    # fork PR 拿不到 secrets,显式跳过,不留一场认证失败的红。
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # 评论走 App 的 OIDC 令牌,不用 workflow 令牌,所以这里没有写权限。
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 评审要看 git 历史
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 机器人开的 PR 默认一律不评审。claude[bot] 在这个仓真开过 PR
          # (#90/#94/#98/#100 那批死码清理),点名放行它一个,不开 "*"。
          allowed_bots: "claude[bot]"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # 只传 PR 号:这条命令没有 $ARGUMENTS,多传的会被静默忽略。
          prompt: "/code-review:code-review --comment ${{ github.event.pull_request.number }}"
          # 这一长串必需,别精简:Bash 在这个 action 里默认关闭,而 code-review
          # 全靠 gh 干活;发 inline comment 的 MCP server 也只在点名时才装。
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git diff:*),Read,Glob,Grep"
      # 空跑时靠这份日志查哪一步被挡。不开 show_full_output——它会把工具结果
      # (可能含 secret)打进公开日志。
      - if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
