# 外部代码评审（按需召唤）。谈定见 docs/05-features/reviewer-agent/；codehub 仓走 Workbench 内建「请评审」。
# bw-orca 产品分支正本（2026-09-29 自 main 迁入，行为一致；main 计划被本分支覆盖，机制不随覆盖丢失）：
# 默认分支仍是 main 期间，issue_comment 召唤执行 main 上的定义——它检出 PR head 后运行本分支的
# .github/scripts/check-pr-review.mjs，bw-orca head 的回执链即生效；bw-orca 成为默认分支后由本定义接管触发。
# 触发模型（2026-09-20 拍板修订，此前为 PR 事件全自动）：仓库成员在 PR 评论单独一行发 /code-review
# 才评审当前 head SHA；draft 不触发；fork PR 无 secrets 跳过。命令判定是行首匹配、整行独占，
# 不解析 markdown——代码块或引用里单独成行的示范同样会触发（已知边界，后果只是多审一次当前提交）。
# 未召唤=未评审（灰），不失败、不缺省绿；召唤后的回执读回见 .github/scripts/check-pr-review.mjs
# （校验结论评论的 bw-code-review:<SHA> 标记）与 code-review-receipt artifact。
# workflow_dispatch 是同一职责的手动入口（等价召唤；issue_comment 触发的 workflow 只认默认分支上的定义）。
# 前提(人做一次):给仓装 Claude GitHub App + 配 secret CLAUDE_CODE_OAUTH_TOKEN——已在 main 侧配齐，仓库级生效。
name: Code Review
concurrency:
  group: code-review-${{ github.event.issue.number || inputs.pr }}
  # 只有「真召唤」才允许替换进行中的评审：任何新评论（含评审自己发的结论评论）都会创建
  # issue_comment run 进入本并发组，无条件取消会让结论评论在回执步骤跑完前杀掉本次评审
  # （claude-code-action 生态已知坑）。命令不在首行的召唤不取消只排队，随后照常执行。
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, '/code-review') }}
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: '要评审的 PR 号（等价于在该 PR 评论 /code-review）'
        required: true
        type: string
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 召唤人限定仓库成员；命令行的精确判定（行首匹配、draft、fork）在 gate 步骤，
    # 这里只做粗筛让无关评论直接 skipped。评论正文一律经 env 传入脚本，不内插进 shell。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/code-review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # 评论走 App 的 OIDC 令牌,不用 workflow 令牌,所以这里没有写权限。
      id-token: write
    steps:
      - name: Resolve the summoned PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_INPUT: ${{ github.event.issue.number || inputs.pr }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          skip() { echo "$1"; echo "skip=true" >> "$GITHUB_OUTPUT"; }
          if [ "$EVENT_NAME" = "issue_comment" ] &&
             ! printf '%s' "$COMMENT_BODY" | grep -Eq '^[[:space:]]*/code-review[[:space:]]*$'; then
            skip "评论里没有行首 /code-review 命令（引用或讨论中提到不触发），跳过"
            exit 0
          fi
          pr=$(gh pr view "$PR_INPUT" --repo "$GITHUB_REPOSITORY" \
            --json number,isDraft,headRefOid,isCrossRepository)
          if [ "$(jq -r '.isDraft' <<< "$pr")" = "true" ]; then
            skip "draft PR 不触发外部评审，跳过"
            exit 0
          fi
          # fork 判定用 isCrossRepository：GraphQL 的 headRepository 对同仓 PR 恒为 null
          # （仅跨仓 PR 才填充），按 full_name 判会把所有同仓召唤误当 fork 跳过（实测发现）。
          if [ "$(jq -r '.isCrossRepository' <<< "$pr")" = "true" ]; then
            skip "PR 头来自 fork 仓，拿不到 secrets，跳过"
            exit 0
          fi
          echo "number=$(jq -r '.number' <<< "$pr")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.headRefOid' <<< "$pr")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.pr.outputs.skip != 'true'
        with:
          fetch-depth: 0 # 评审要看 git 历史
          ref: ${{ steps.pr.outputs.head_sha }}
      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.pr.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 显式 prompt 使 action 进入自动化 agent 模式，不依赖评论里的 @claude 提及；
          # 机器人 actor 由 action 默认拒绝，召唤人已限定仓库成员，不再放行任何 bot。
          # gh pr view --comments 的查询里带 CI 检查数据,App 令牌默认读不到,
          # 整条命令会以 "Resource not accessible by integration" 失败。
          additional_permissions: |
            actions: read
          prompt: |
            审查 PR #${{ steps.pr.outputs.number }} 的当前提交 ${{ steps.pr.outputs.head_sha }}。
            这是代码审查，不修改实现、不合并、不关闭 Issue。
            先读 AGENTS.md 与变更涉及的现行规范，再用 gh pr view / gh pr diff 和源码检查真实 bug、失败处理、证据真实性与规范符合性。
            历史评论不代表当前提交已经审查；不得因为本 PR 以前有 Review 就跳过新提交。
            仅报告有证据的缺陷，给出文件、行号、触发条件与影响；不要用风格偏好或猜测阻止合入。
            完成后必须用 gh pr comment 发布当前提交的结论。第一行必须原样为：
            <!-- bw-code-review:${{ steps.pr.outputs.head_sha }} -->
            正文写明所审 SHA、审查范围，以及“未发现需处理问题”或有优先级的具体问题。
            将评论正文写到 ${{ runner.temp }}/pr-review-${{ steps.pr.outputs.head_sha }}.md，用 --body-file 发布，随后用 gh pr view 读回确认。
            即使没有问题也必须发布结论。最终聊天回复不代替 PR 产物。
          # 延续现有评审模型。编译和真实 E2E 由 CI 独立验证。
          # gh 用于读 PR 和发布结论；Write 只用于评论临时文件。
          # 非交互任务不委派后台 Agent，避免会话结束而没有审查产物。
          claude_args: >-
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git diff:*),Read,Write,Glob,Grep"
            --disallowedTools "Agent,Task"
            --append-system-prompt "你运行在 GitHub Actions 的非交互环境里:没有下一轮,你这一轮结束运行就结束。所有检查与评审都必须自己在本轮内做完并把结果落到 PR 上,不要把工作交给别人再等回复。"
      - name: Require a published conclusion for this commit
        if: ${{ always() && steps.pr.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: node .github/scripts/check-pr-review.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.pr.outputs.skip != 'true' }}
        with:
          name: code-review-receipt
          path: .bw/release/out/code-review/
          include-hidden-files: true
          if-no-files-found: error
      # 空跑时靠这份日志查哪一步被挡。不开 show_full_output——它会把工具结果
      # (可能含 secret)打进公开日志。
      - if: ${{ always() && steps.pr.outputs.skip != 'true' && steps.claude.outputs.execution_file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
