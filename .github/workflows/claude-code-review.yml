# PR 自动评审。谈定见 05-features/reviewer-agent/;codehub 仓走 Workbench 内建「请评审」。
# 前提(人做一次):给仓装 Claude GitHub App + 配 secret CLAUDE_CODE_OAUTH_TOKEN。
name: Code Review
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # fork PR 拿不到 secrets,显式跳过,不留一场认证失败的红。
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # 评论走 App 的 OIDC 令牌,不用 workflow 令牌,所以这里没有写权限。
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 评审要看 git 历史
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 默认拒一切机器人 actor;claude[bot] 在这个仓真开过 PR,点名放行它一个。
          allowed_bots: "claude[bot]"
          # gh pr view --comments 的查询里带 CI 检查数据,App 令牌默认读不到,
          # 整条命令会以 "Resource not accessible by integration" 失败。
          additional_permissions: |
            actions: read
          prompt: |
            审查 PR #${{ github.event.pull_request.number }} 的当前提交 ${{ github.event.pull_request.head.sha }}。
            这是代码审查，不修改实现、不合并、不关闭 Issue。
            先读 AGENTS.md 与变更涉及的现行规范，再用 gh pr view / gh pr diff 和源码检查真实 bug、失败处理、证据真实性与规范符合性。
            历史评论不代表当前提交已经审查；不得因为本 PR 以前有 Review 就跳过新提交。
            仅报告有证据的缺陷，给出文件、行号、触发条件与影响；不要用风格偏好或猜测阻止合入。
            完成后必须用 gh pr comment 发布当前提交的结论。第一行必须原样为：
            <!-- bw-code-review:${{ github.event.pull_request.head.sha }} -->
            正文写明所审 SHA、审查范围，以及“未发现需处理问题”或有优先级的具体问题。
            将评论正文写到 ${{ runner.temp }}/pr-review-${{ github.event.pull_request.head.sha }}.md，用 --body-file 发布，随后用 gh pr view 读回确认。
            即使没有问题也必须发布结论。最终聊天回复不代替 PR 产物。
          # 延续现有评审模型。编译和真实 E2E 由 CI 独立验证。
          # gh 用于读 PR 和发布结论；Write 只用于评论临时文件。
          # 非交互任务不委派后台 Agent，避免会话结束而没有审查产物。
          claude_args: >-
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git diff:*),Read,Write,Glob,Grep"
            --disallowedTools "Agent,Task"
            --append-system-prompt "你运行在 GitHub Actions 的非交互环境里:没有下一轮,你这一轮结束运行就结束。所有检查与评审都必须自己在本轮内做完并把结果落到 PR 上,不要把工作交给别人再等回复。"
      - name: Require a published conclusion for this commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-pr-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-review-receipt
          path: .bw/release/out/code-review/
          include-hidden-files: true
          if-no-files-found: error
      # 空跑时靠这份日志查哪一步被挡。不开 show_full_output——它会把工具结果
      # (可能含 secret)打进公开日志。
      - if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
