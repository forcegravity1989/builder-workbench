# 夜间 PR 补审(兜底):事件驱动漏掉的 open PR,每晚扫一遍逐个补审。
#
# 与 claude-code-review.yml(事件驱动主力)的分工:那条管新开/有更新的 PR,
# 这条兜「超过 24 小时无任何 review」的漏网存量。谈定见 changes/reviewer-agent/。
#
# 设计对齐仓规矩:「有没有事」由确定性脚本判(gh+jq 筛选,不用模型决定),
# 没有漏网 PR 时 Claude 一步都不起、零花费;有才逐条补审。
#
# 两条 GitHub 的规矩要知道:
#   - schedule 只从**默认分支**跑——本文件合入 main 之前定时不会生效
#     (workflow_dispatch 手动触发不受此限,可先验)。
#   - 公开仓 60 天无活动会自动停掉 schedule;本仓活跃,基本碰不到。
name: Nightly PR Sweep
on:
  schedule:
    - cron: "0 14 * * *" # UTC 14:00 = 北京时间 22:00
  workflow_dispatch: {}
concurrency:
  group: nightly-pr-sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # 补审评论经 gh 用 workflow 令牌发(github-actions bot 身份)——与事件
      # 驱动那条不同(那条经 Claude App 的 OIDC 发)。所以这里要 write。
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: 筛出超过 24 小时无 review 的 open PR(确定性脚本)
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        # 判据全部机器可核:open、非 draft、开了超过 24 小时、正式 review 数为 0、
        # 且没有 Claude 的评论或以前的「夜间补审」评论(避免每晚重复轰炸)。
        run: |
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          list=$(gh pr list -R "$GITHUB_REPOSITORY" --state open \
            --json number,isDraft,createdAt,reviews,comments \
            --jq "[.[]
                   | select(.isDraft | not)
                   | select(.createdAt < \"$cutoff\")
                   | select((.reviews | length) == 0)
                   | select([.comments[] | (.author.login | test(\"claude\"; \"i\"))
                             or (.body | contains(\"夜间补审\"))] | any | not)
                   | .number] | join(\" \")")
          echo "numbers=$list" >> "$GITHUB_OUTPUT"
          echo "待补审 PR:${list:-无(今晚不起 Claude)}"
      - name: 逐个补审
        if: steps.stale.outputs.numbers != ''
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            这些 open PR 已超过 24 小时没有任何 review(由前置的确定性脚本筛出):${{ steps.stale.outputs.numbers }}
            逐条处理:用 `gh pr view <号>` 读正文、`gh pr diff <号>` 读真实改动,按仓根 AGENTS.md
            写明的规矩做简要评审,把意见整理成**一条评论**用 `gh pr comment <号>` 发到该 PR。
            评论开头写「夜间补审」;每条问题给 文件:行 证据;真没问题就写可合入,不硬凑意见。
            只评不改:不合并、不关 PR、不推分支、不改任何文件。
          # 纯 prompt 的 automation mode 默认没有任何工具,必须在这里逐个点名;
          # 钉 sonnet + 限轮数 + job 超时,三道开销上限。
          claude_args: '--model claude-sonnet-5 --max-turns 40 --allowedTools "Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"'
