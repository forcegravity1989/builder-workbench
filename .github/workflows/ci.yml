name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel:
    name: kernel + base (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # app-shell pulls the Dioxus/wry tree, which needs system WebKit/GTK —
      # glib-2.0 is not on the plain ubuntu runner, so linking dies in the
      # build script before clippy sees any code. This job stays light and
      # never compiles the shell; shell build/packaging is a separate matrix.
      # The shell's clippy runs locally (macOS builds it without pkg-config);
      # the three structural guards below are pure text checks, so they run
      # here to enforce the shell's layout rules on every push.
      - name: Clippy (headless crates)
        run: cargo clippy --workspace --exclude app-shell -- -D warnings

      - name: Test (kernel + base + compile-fail doctests)
        run: cargo test --workspace --exclude app-shell

      - name: Kernel stays UI-free
        run: ./scripts/guard-kernel-ui-free.sh

      # Shell layout rules. Pure grep — no compilation, so they run here even
      # though app-shell itself is not built on this runner.
      - name: Shell stays laid out the way it says it is
        run: |
          ./scripts/guard-no-cross-screen-import.sh
          ./scripts/guard-screen-hooks.sh
          ./scripts/guard-file-lines.sh

      - name: codegraph.db not staged in feature commits
        run: ./scripts/guard-codegraph-clean.sh

  # 行为读回:跑仓里那几个不碰网络、不碰 claude 的 smoke,把它们的输出收成一份
  # 报告贴在 PR 上。CI 原本只验代码卫生(编得过、格式对),从不验产品行为——
  # 这一段补的就是那块。
  behavior:
    name: 行为读回(无网)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 smoke
        run: cargo build --examples -p bw -p bw-engine
      - name: 逐个真跑并收报告
        run: |
          R=$GITHUB_STEP_SUMMARY
          echo "## 行为读回报告" >> $R
          echo "" >> $R
          echo "提交 \`${GITHUB_SHA:0:8}\` · 无网络、无 claude 环境下真跑" >> $R
          echo "" >> $R
          fail=0
          for e in pty_smoke health_smoke metrics_smoke settings_smoke prompt_smoke onboard_smoke; do
            d=$(mktemp -d)
            if out=$(./target/debug/examples/$e "$d" 2>&1); then st="通过"; else st="**失败**"; fail=1; fi
            echo "<details><summary>$st · $e</summary>" >> $R
            echo "" >> $R
            echo '```' >> $R
            echo "$out" | head -60 >> $R
            echo '```' >> $R
            echo "</details>" >> $R
            echo "$e: $st"
          done
          exit $fail

