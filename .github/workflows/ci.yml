name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Summary 里的外部评审状态行要读 PR 评论（只读）。
  pull-requests: read
  issues: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel:
    name: kernel + base (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify using the project entry point
        run: node .bw/release/verify/verify.mjs --profile headless
      - name: Verification summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .bw/release/verify/github-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-linux
          path: .bw/release/out/verify/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Windows desktop verification
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # This VM belongs to one job. Local runs still create an isolated desktop.
      BW_E2E_DESKTOP: current
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prepare the Microsoft WebView2 runtime
        timeout-minutes: 5
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .bw/release/e2e/runtime.ps1 -InstallMissing
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify using the project entry point
        run: node .bw/release/verify/verify.mjs --profile pr
      - name: Verification summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .bw/release/verify/github-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-windows
          path: .bw/release/out/verify/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
