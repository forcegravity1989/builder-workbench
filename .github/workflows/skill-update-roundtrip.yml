name: Skill update round trip

# Why dispatch-only: verify-skill-update-roundtrip.mjs materializes every
# version named by resources/skills/release-mapping.json from release tags
# (historicalRelease / seedPlacement run `git ls-tree <tag>`). Those are Orca
# upstream v1.4.x tags; this fork only has v0.4.0 / v0.5.0-rc.*, so the matrix
# is structurally red here — #352, #353 and the main push 09076a6e each ran
# 13/13 failures. The old paths filter assumed skills/** changes stay rare; any
# PR touching resources/skills/** lit the matrix up. Downgraded with the rest of
# the Orca CI matrix (ref/upstream.md §2.6); the manual entry does not guarantee
# runnability. Matrix trimmed to windows-latest: BW ships Windows installers and
# the macOS / Ubuntu scenarios are not needed (human decision 2026-10-14); the
# ubuntu skills-cli:latest include leg and its continue-on-error went with them.
on:
  workflow_dispatch:

jobs:
  roundtrip:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        shape: [symlink, copy]
        autocrlf: ['false', 'true']
        skills-cli: ['1.5.17']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Historical skill snapshots need tags, but only their blobs are read.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Verify targeted update convergence and copy behavior
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKILL_UPDATE_SOURCE: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SKILL_UPDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: >-
          node config/scripts/verify-skill-update-roundtrip.mjs
          --cli=${{ matrix.skills-cli }}
          --autocrlf=${{ matrix.autocrlf }}
          --shape=${{ matrix.shape }}
