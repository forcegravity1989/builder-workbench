name: Release ref validation

on:
  # Why dispatch-only: part of the Orca CI/E2E isolation (ref/upstream.md). Its
  # contract tests (config/scripts/workflow-ref-*.test.mjs) validate the old
  # release-chain workflows and are no longer discoverable through the trimmed
  # Workbench Vitest include, so an automatic PR trigger could only go red.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ref-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Verify case-twin refs and release trust boundary
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          config/scripts/workflow-ref-reachability.test.mjs
          config/scripts/workflow-ref-mirror-case-safety.test.mjs
          config/scripts/dev-channel-windows-workflow-contract.test.mjs
