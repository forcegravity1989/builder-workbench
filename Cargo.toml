[workspace]
resolver = "2"
members = [
    "crates/bw-v4",
    "crates/app-shell",
    "crates/v4-engine",
]
# `default-members` = the headless kernel + capability base. Routine
# `cargo test` / `cargo check` stay UI-free and fast — they never pull the
# Dioxus/wry dependency tree. Build the desktop shell explicitly with
# `cargo build -p app-shell` (bin `bw-v4-dev`).
default-members = [
    "crates/bw-v4",
    "crates/v4-engine",
]

[workspace.package]
edition = "2021"
version = "0.0.0"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
# --- Kernel deps (must stay wasm32-compilable: no async, no IO, no UI) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["serde"] }
time = { version = "0.3", default-features = false, features = ["serde"] }
thiserror = "1"

# --- Runtime deps (tokio async 运行时; toml 解析 .bw/*.toml) ---
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
toml = "0.8"

# --- Internal crates (path deps; V4 三 crate,对 V3 零依赖) ---
bw-v4 = { path = "crates/bw-v4" }
v4-engine = { path = "crates/v4-engine" }
app-shell = { path = "crates/app-shell" }

# --- UI stack: hard-pinned dioxus 0.7.9(0.8.0-alpha 会破坏,手动 bump 不走 ^) ---
dioxus = "=0.7.9"

# Smaller / faster release binary for the desktop shell.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
