<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__BW_FILE_NAME__ · 分享</title>
    <!--
      Share viewer. The content stays in an opaque iframe (/s/:id/content) and element picking runs
      through the injected bridge (src/bridge.js, postMessage only). Annotations live beside the
      content and are written to /api/shares/:id/annotations.

      Visual spec: the Workbench warm skin tokens (src/renderer/src/workbench/workbench-tokens.css,
      claude theme) are inlined below — the share server's CSP only allows inline styles, so no
      external stylesheet or font file. The annotation popover follows the Orca element-annotation
      dialog (element text title, monospace selector, large terracotta-bordered textarea, 取消 /
      添加, Ctrl+Enter). No intent segments and no author field: annotations are anonymous and the
      list shows text + time + target only.
    -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }

      /* ── Workbench warm-skin tokens (claude theme, light) ── */
      :root {
        color-scheme: light;
        --background: #faf9f5;
        --foreground: #1f1e1d;
        --card: #fefdfa;
        --muted-foreground: #75716a;
        --accent: #fef0eb;
        --accent-foreground: #1f1e1d;
        --secondary: #f0eee6;
        --input: #ebe7e1;
        --ring: #d97757;
        --primary: #d97757;
        --primary-foreground: #ffffff;
        --border: #ebe7e1;
        --sidebar: #f0eee6;
        --destructive: #c15f4d;
        --destructive-background: #ffe4df;
        --warning-background: #feecce;
        --warning-text: #774a03;
        --radius-md: 8px;
        --radius-lg: 10px;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --font-sans:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          'Noto Sans SC', sans-serif;
      }
      /* ── Workbench warm-skin tokens (claude theme, dark) ── */
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --background: #0a0a0a;
          --foreground: #fafafa;
          --card: #171717;
          --muted-foreground: #a1a1a1;
          --accent: color-mix(in srgb, #d97757 16%, transparent);
          --accent-foreground: #fafafa;
          --secondary: #262626;
          --input: oklch(26.9% 0 0);
          --ring: #d97757;
          --primary: #d97757;
          --primary-foreground: #ffffff;
          --border: rgba(255, 255, 255, 0.07);
          --sidebar: #262626;
          --destructive: #ff6568;
          --destructive-background: rgba(255, 101, 104, 0.1);
          --warning-background: oklch(27.9% 0.077 45.635);
          --warning-text: oklch(87.9% 0.169 91.605);
        }
      }

      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.5;
      }

      /* ── Controls: primitives.css Button (size sm, 32px) ── */
      .vw-btn {
        display: inline-flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        background: transparent;
        color: var(--foreground);
        font-family: inherit;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        white-space: nowrap;
        outline: none;
        cursor: pointer;
        transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .vw-btn:disabled {
        pointer-events: none;
        opacity: 0.5;
      }
      .vw-btn:focus-visible {
        border-color: var(--ring);
        box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 40%, transparent);
      }
      .vw-btn svg {
        flex: none;
      }
      .vw-btn-primary {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .vw-btn-primary:hover {
        background: color-mix(in oklab, var(--primary) 88%, transparent);
      }
      .vw-btn-ghost:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }

      /* ── Badges: target tags use warning (they echo the sandbox amber highlight) ── */
      .vw-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        width: fit-content;
        max-width: 100%;
        flex-shrink: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        border: 1px solid transparent;
        border-radius: 9999px;
        padding: 2px 8px;
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        white-space: nowrap;
      }
      .vw-tag-target {
        background: var(--warning-background);
        color: var(--warning-text);
      }
      .vw-tag-stale {
        background: var(--destructive-background);
        color: var(--destructive);
      }

      /* ── Viewer skeleton ── */
      .viewer {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .viewer-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--sidebar);
      }
      .viewer-head .file-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .viewer-head .shared-at {
        font-size: 12px;
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .viewer-body {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .viewer-content {
        flex: 1;
        min-width: 0;
        position: relative;
        background: var(--background);
      }
      .viewer-content iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      .selecting .viewer-content {
        cursor: crosshair;
      }

      /* ── Selection-mode hint (add-note enters selection immediately) ── */
      .select-hint {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 9999px;
        background: var(--card);
        color: var(--foreground);
        font-size: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        pointer-events: none;
        white-space: nowrap;
      }
      .select-hint .esc {
        padding: 0 6px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--secondary);
        color: var(--muted-foreground);
        font-size: 11px;
        line-height: 18px;
      }

      /* ── Annotation popover: the Orca element-annotation dialog (g3-annot-pop).
            Element text title + monospace selector + large terracotta-bordered textarea +
            取消 / 添加 (Ctrl+Enter). Anchored beside the picked element by the bridge rect. ── */
      .anno-popover {
        position: absolute;
        z-index: 40;
        width: min(340px, calc(100% - 32px));
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--card);
        color: var(--foreground);
        box-shadow:
          0 16px 40px rgb(0 0 0 / 0.18),
          0 1px 2px rgb(0 0 0 / 0.06);
      }
      @media (prefers-color-scheme: dark) {
        .anno-popover {
          box-shadow:
            0 24px 64px rgb(0 0 0 / 0.55),
            inset 0 1px 0 rgb(255 255 255 / 0.06);
        }
      }
      .anno-popover header {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .anno-popover header .pop-icon {
        flex: none;
        margin-top: 2px;
        color: var(--muted-foreground);
      }
      .anno-popover header .pop-titles {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .anno-popover header strong {
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        color: var(--foreground);
        overflow-wrap: anywhere;
      }
      .anno-popover header code {
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 16px;
        color: var(--muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .anno-popover header .pop-close {
        flex: none;
        height: 24px;
        width: 24px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        background: none;
        color: var(--muted-foreground);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .anno-popover header .pop-close:hover {
        background: var(--accent);
        color: var(--foreground);
      }
      .anno-popover header .pop-close:focus-visible {
        border-color: var(--ring);
        box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 40%, transparent);
      }
      /* Always-on terracotta border, like the Orca annotation box; focused on open. */
      .anno-popover textarea {
        width: 100%;
        min-height: 104px;
        padding: 10px 12px;
        border: 2px solid color-mix(in oklab, var(--ring) 65%, transparent);
        border-radius: var(--radius-lg);
        background: var(--background);
        color: var(--foreground);
        font-family: inherit;
        font-size: 14px;
        line-height: 1.6;
        resize: vertical;
        outline: none;
        transition: border-color 150ms;
      }
      .anno-popover textarea:hover,
      .anno-popover textarea:focus-visible {
        border-color: var(--ring);
      }
      .anno-popover textarea::placeholder {
        color: color-mix(in oklab, var(--muted-foreground) 70%, transparent);
      }
      .anno-popover .form-error {
        font-size: 12px;
        color: var(--destructive);
      }
      .anno-popover footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }
      .anno-popover footer .kbd {
        display: inline-flex;
        align-items: center;
        gap: 1px;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgb(255 255 255 / 0.22);
        color: inherit;
        font-size: 10px;
        font-family: var(--font-mono);
        line-height: 14px;
      }

      /* ── Annotation tray: floats over the content, aligned with Orca's native
         BrowserPageAnnotationTray (bottom-right overlay, collapsible header row). ── */
      .anno-tray {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 30;
        width: min(320px, calc(100% - 24px));
        max-height: 45%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--card);
        box-shadow: 0 10px 24px rgb(0 0 0 / 0.18);
      }
      /* After the base tray rule: a dark shadow needs a later source position to win. */
      @media (prefers-color-scheme: dark) {
        .anno-tray {
          box-shadow:
            0 16px 44px rgb(0 0 0 / 0.5),
            inset 0 1px 0 rgb(255 255 255 / 0.06);
        }
      }
      .anno-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px 6px 6px;
        flex: none;
      }
      .anno-toggle {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        color: var(--foreground);
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        text-align: left;
        cursor: pointer;
      }
      .anno-toggle:hover {
        background: var(--accent);
      }
      .anno-toggle:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: -2px;
      }
      .anno-toggle .chevron {
        flex: none;
        color: var(--muted-foreground);
        transition: transform 120ms ease;
      }
      .anno-tray.collapsed .anno-toggle .chevron {
        transform: rotate(-90deg);
      }
      .anno-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--border);
      }
      /* Collapsed = the header row only; the list stays in the DOM so the scroll
         position survives collapse/expand (same trick as the native tray's forceMount). */
      .anno-tray.collapsed .anno-body {
        display: none;
      }
      .anno-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-height: 0;
      }
      /* Zero annotations: a mini pill is the whole affordance until the first note lands. */
      .anno-mini {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 30;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 14px;
        border: 1px solid color-mix(in oklab, var(--primary) 70%, transparent);
        border-radius: 9999px;
        background: var(--primary);
        color: var(--primary-foreground);
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 6px 18px rgb(0 0 0 / 0.16);
        cursor: pointer;
      }
      .anno-mini:hover {
        filter: brightness(1.05);
      }
      .anno-mini:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      .anno-mini:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .annotation-item {
        display: flex;
        gap: 8px;
        padding: 6px 6px;
        border-radius: var(--radius-md);
        cursor: pointer;
      }
      .annotation-item:hover,
      .annotation-item:focus-visible {
        background: var(--accent);
      }
      .annotation-item:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: -2px;
      }
      /* Own annotations (this browser holds the delete token): terracotta left rail. */
      .annotation-item.mine {
        box-shadow: inset 2px 0 0 var(--primary);
      }
      .annotation-item .badge {
        flex: none;
        margin-top: 1px;
        height: 20px;
        width: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background: var(--primary);
        color: var(--primary-foreground);
        font-size: 10px;
        font-weight: 600;
      }
      .annotation-item .main {
        flex: 1;
        min-width: 0;
      }
      .annotation-item .title-row {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .annotation-item .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 600;
        color: var(--foreground);
      }
      .annotation-item .time {
        flex: none;
        color: var(--muted-foreground);
        font-size: 11px;
      }
      .annotation-item .delete {
        flex: none;
        height: 20px;
        width: 20px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-md);
        background: none;
        color: var(--muted-foreground);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      /* Touch devices have no hover, so the delete action must stay visible there;
         pointer devices keep it out of the way until the row is hovered (native can-hover). */
      @media (hover: hover) {
        .annotation-item .delete {
          opacity: 0;
        }
        .annotation-item:hover .delete,
        .annotation-item .delete:focus-visible {
          opacity: 1;
        }
      }
      .annotation-item .delete:hover {
        background: var(--destructive-background);
        color: var(--destructive);
      }
      .annotation-item .delete:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: -2px;
      }
      .annotation-item .text {
        margin: 2px 0 0;
        font-size: 12px;
        line-height: 1.5;
        color: var(--foreground);
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .annotation-item .meta {
        margin-top: 3px;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .list-status {
        padding: 4px 12px 8px;
        font-size: 12px;
        color: var(--destructive);
        flex: none;
      }
      .bridge-hint {
        padding: 6px 12px 10px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted-foreground);
        text-align: center;
        flex: none;
      }
      .bridge-hint:empty {
        display: none;
      }
      .list-error {
        padding: 16px;
        text-align: center;
        color: var(--destructive);
        font-size: 13px;
      }
      .list-error button {
        margin-top: 8px;
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--input);
        border-radius: var(--radius-md);
        background: var(--card);
        color: var(--foreground);
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="viewer" id="viewer">
      <header class="viewer-head">
        <span class="file-name" id="file-name">__BW_FILE_NAME__</span>
        <span class="shared-at" id="shared-at">分享于 __BW_CREATED_AT__</span>
      </header>
      <div class="viewer-body">
        <div class="viewer-content" id="viewer-content">
          <iframe id="content-frame" title="分享内容"></iframe>
          <div class="select-hint" id="select-hint" hidden>
            点击要批注的元素 <span class="esc">Esc</span> 取消；点击空白处写页面级批注
          </div>
          <form class="anno-popover" id="anno-form" hidden role="dialog" aria-label="添加批注">
            <header>
              <svg
                class="pop-icon"
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                <path d="M12 7v6" />
                <path d="M9 10h6" />
              </svg>
              <div class="pop-titles">
                <strong id="pop-title">整页批注</strong>
                <code id="target-line" hidden></code>
              </div>
              <button class="pop-close" id="pop-close-btn" type="button" aria-label="关闭批注小窗">
                ×
              </button>
            </header>
            <textarea
              id="text-input"
              placeholder="描述你想在这里提出的批注……"
              maxlength="2000"
            ></textarea>
            <div class="form-error" id="form-error" hidden></div>
            <footer>
              <button class="vw-btn vw-btn-ghost" id="cancel-btn" type="button">取消</button>
              <button class="vw-btn vw-btn-primary" id="submit-btn" type="submit" disabled>
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
                添加
                <span class="kbd">Ctrl↵</span>
              </button>
            </footer>
          </form>
          <!-- 批注托盘：右下角悬浮于内容之上，对齐 Orca 原生 BrowserPageAnnotationTray；
             零批注时整个托盘收成迷你按钮，有批注后展开为可折叠托盘 -->
          <button class="anno-mini" id="anno-mini" type="button" hidden disabled>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
            批注
          </button>
          <aside class="anno-tray" id="anno-tray" aria-label="批注" hidden>
            <div class="anno-head">
              <button class="anno-toggle" id="anno-toggle" type="button" aria-expanded="true">
                <svg
                  class="chevron"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="m6 9 6 6 6-6" />
                </svg>
                批注 <span id="anno-count"></span>
              </button>
              <button class="vw-btn vw-btn-primary" id="add-btn" type="button" disabled>
                添加批注
              </button>
            </div>
            <div class="anno-body">
              <div class="anno-list" id="anno-list"></div>
              <div class="list-status" id="list-status"></div>
              <div class="bridge-hint" id="bridge-hint"></div>
            </div>
          </aside>
        </div>
      </div>
    </div>
    <script>
      ;(function () {
        'use strict'

        var shareId = (location.pathname.match(/^\/s\/([A-Za-z0-9_-]{22})/) || [])[1]
        var frame = document.getElementById('content-frame')
        var contentEl = document.getElementById('viewer-content')
        var viewerEl = document.getElementById('viewer')
        var selectHint = document.getElementById('select-hint')
        var listEl = document.getElementById('anno-list')
        var countEl = document.getElementById('anno-count')
        var formEl = document.getElementById('anno-form')
        var formErrorEl = document.getElementById('form-error')
        var popTitle = document.getElementById('pop-title')
        var popSelector = document.getElementById('target-line')
        var textInput = document.getElementById('text-input')
        var submitBtn = document.getElementById('submit-btn')
        var addBtn = document.getElementById('add-btn')
        var bridgeHint = document.getElementById('bridge-hint')
        var listStatusEl = document.getElementById('list-status')
        var trayEl = document.getElementById('anno-tray')
        var miniBtn = document.getElementById('anno-mini')
        var toggleBtn = document.getElementById('anno-toggle')

        var API = '/api/shares/' + shareId + '/annotations'
        var TOKENS_PREFIX = 'bw-anno-tokens:' + shareId + ':'
        var TRAY_KEY = 'bw-anno-tray:' + shareId
        var POLL_MS = 30_000
        var POP_GAP = 8
        var POP_MARGIN = 16

        var annotations = []
        var myTokens = readTokens()
        var picking = false
        var submitting = false
        var pickedTarget = null
        // Bumped whenever the dialog opens or closes. A submit remembers its value so a response
        // that arrives after the user cancelled (and maybe opened a new draft) cannot close the
        // new dialog or wipe its text.
        var popSeq = 0
        var bridgeReady = false
        var staleIds = new Set()
        var listStatusTimer = null
        // Both tray modes stay hidden until the first list load settles, so the mini pill
        // never flashes before the real annotation count is known.
        var listLoaded = false
        var listFailed = false
        // Set when a submit lands while the tray is collapsed; applied on the next expand.
        var pendingScrollToNewest = false

        frame.src = '/s/' + shareId + '/content'

        // ---- bridge handshake ---------------------------------------------------------------

        window.addEventListener('message', function (event) {
          var data = event.data
          if (!data || typeof data !== 'object' || event.source !== frame.contentWindow) {
            return
          }
          switch (data.type) {
            case 'bw-anno-ready':
              bridgeReady = true
              setAddEnabled(true)
              bridgeHint.textContent = ''
              miniBtn.title = ''
              probeTargets()
              break
            case 'bw-anno-select':
              // Ignore a selection that arrives after the form was cancelled: the bridge may still
              // have a click in flight when stop-select lands, and it must not reopen the popover.
              if (!picking) {
                break
              }
              picking = false
              renderPicking()
              openSelected(data)
              break
            case 'bw-anno-cancel':
              stopPicking()
              break
            case 'bw-anno-highlight-result':
              if (!data.found) {
                // Match by annotation id (the bridge echoes it) so two annotations sharing one
                // selector mark the clicked one, not the first match; fall back to selector only
                // if an older bridge omitted the id.
                var annotation = data.id
                  ? annotations.find(function (item) {
                      return item.id === data.id
                    })
                  : annotations.find(function (item) {
                      return item.target && item.target.selector === data.selector
                    })
                if (annotation) {
                  staleIds.add(annotation.id)
                  renderList()
                }
              }
              break
            case 'bw-anno-probe-result': {
              var changed = false
              var results = Array.isArray(data.results) ? data.results : []
              results.forEach(function (entry) {
                if (!entry || !entry.id) {
                  return
                }
                if (entry.found) {
                  if (staleIds.delete(entry.id)) {
                    changed = true
                  }
                } else if (!staleIds.has(entry.id)) {
                  staleIds.add(entry.id)
                  changed = true
                }
              })
              if (changed) {
                renderList()
              }
              break
            }
            default:
              break
          }
        })

        setTimeout(function () {
          if (!bridgeReady) {
            // The shared document's own CSP (e.g. script-src 'none') can block the bridge.
            // Page-level annotations still work, so the popover opens without picking.
            setAddEnabled(true)
            bridgeHint.textContent = '该内容不支持元素级批注，可添加页面级批注'
            // Zero annotations keep the tray collapsed to the mini pill; carry the hint there.
            miniBtn.title = '该内容不支持元素级批注，可添加页面级批注'
          }
        }, 2500)

        function setAddEnabled(enabled) {
          addBtn.disabled = !enabled
          miniBtn.disabled = !enabled
        }

        function postToFrame(message) {
          if (!bridgeReady) {
            return
          }
          frame.contentWindow.postMessage(message, '*')
        }

        // Ask the bridge which targets still exist, so a stale annotation is marked on load and
        // on every refresh — not only after someone clicks it.
        function probeTargets() {
          if (!bridgeReady) {
            return
          }
          var selectors = []
          annotations.forEach(function (item) {
            if (item.target && item.target.selector) {
              selectors.push({ id: item.id, selector: item.target.selector })
            }
          })
          if (selectors.length) {
            postToFrame({ type: 'bw-anno-probe', selectors: selectors })
          }
        }

        // ---- element picking ----------------------------------------------------------------

        // 「添加批注」enters selection mode directly; there is no separate pick button. A click on
        // blank content arrives as the body selector and becomes a page-level annotation.
        function startPicking() {
          if (!bridgeReady) {
            openPopover(null, null, null)
            return
          }
          picking = true
          pickedTarget = null
          renderPicking()
          postToFrame({ type: 'bw-anno-start-select' })
        }

        function stopPicking() {
          picking = false
          renderPicking()
          postToFrame({ type: 'bw-anno-stop-select' })
        }

        // Esc must cancel picking when focus sits in this document (e.g. right after clicking
        // 「添加批注」); the bridge only sees keys while the iframe itself holds focus.
        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape') {
            return
          }
          if (picking) {
            stopPicking()
          } else if (!formEl.hidden) {
            closePopover()
          }
        })

        function renderPicking() {
          viewerEl.classList.toggle('selecting', picking)
          selectHint.hidden = !picking
        }

        function openSelected(data) {
          var rect = data && data.rect && typeof data.rect === 'object' ? data.rect : null
          var isPageLevel =
            !data || !data.selector || data.selector === 'body' || data.selector === 'html'
          if (isPageLevel) {
            pickedTarget = null
            // A blank-area click still makes the bridge highlight <body>; drop that outline since
            // a page-level annotation has no target to point at.
            postToFrame({ type: 'bw-anno-clear' })
            openPopover(null, null, null)
            return
          }
          pickedTarget = {
            selector: data.selector,
            text: typeof data.text === 'string' ? data.text : '',
            rect: rect
              ? { x: rect.x, y: rect.y, width: rect.width, height: rect.height }
              : { x: 0, y: 0, width: 0, height: 0 }
          }
          var anchorX = rect && typeof rect.x === 'number' ? rect.x : null
          var anchorY =
            rect && typeof rect.y === 'number' && typeof rect.height === 'number'
              ? rect.y + rect.height
              : null
          openPopover(pickedTarget, anchorX, anchorY)
        }

        // ---- popover ------------------------------------------------------------------------

        // Positions the dialog beside the picked element (below it, flipped above when there is
        // no room) inside the content column — the same rule as the Orca AnnotationPopover.
        // Anchors are content-local: the iframe fills this column at 0,0, so the bridge rect
        // (iframe viewport coordinates) maps straight onto the popover's absolute offsets.
        function positionPopover(anchorX, anchorY) {
          var contentRect = contentEl.getBoundingClientRect()
          var popWidth = formEl.offsetWidth || 340
          var popHeight = formEl.offsetHeight || 220
          var left = anchorX === null ? (contentRect.width - popWidth) / 2 : anchorX
          left = Math.min(
            Math.max(left, POP_MARGIN),
            Math.max(contentRect.width - popWidth - POP_MARGIN, POP_MARGIN)
          )
          var top
          if (anchorY === null) {
            top = POP_MARGIN + 56
          } else {
            top = anchorY + POP_GAP
            if (top + popHeight > contentRect.height - POP_MARGIN) {
              top = Math.max(anchorY - popHeight - POP_MARGIN, POP_MARGIN)
            }
          }
          formEl.style.left = left + 'px'
          formEl.style.top = top + 'px'
        }

        function openPopover(target, anchorX, anchorY) {
          popSeq += 1
          // A request still in flight belongs to the previous draft; the new draft is separable.
          submitting = false
          formEl.hidden = false
          showFormError('')
          textInput.value = ''
          updateSubmitState()
          if (target) {
            popTitle.textContent = elementTitle(target.text, target.selector)
            popSelector.textContent = target.selector
            popSelector.hidden = false
          } else {
            popTitle.textContent = '整页批注'
            popSelector.textContent = ''
            popSelector.hidden = true
          }
          positionPopover(anchorX, anchorY)
          textInput.focus()
        }

        // Element text is the dialog title; the selector is the monospace subtitle. Keep the
        // title short — the bridge caps it at 200 chars, which would not fit the header.
        function elementTitle(text, selector) {
          var trimmed = (text || '').trim().replace(/\s+/g, ' ')
          if (trimmed) {
            return trimmed.slice(0, 60)
          }
          return selector || '元素'
        }

        function closePopover() {
          popSeq += 1
          formEl.hidden = true
          pickedTarget = null
          textInput.value = ''
          showFormError('')
          updateSubmitState()
          // The bridge highlighted the picked element; clear it now that the dialog is gone.
          postToFrame({ type: 'bw-anno-clear' })
        }

        function updateSubmitState() {
          // Typing during an in-flight submit must not light up a button whose click is ignored.
          submitBtn.disabled = submitting || !textInput.value.trim()
        }

        // ---- form ---------------------------------------------------------------------------

        function requestAdd() {
          if (picking) {
            stopPicking()
            return
          }
          if (bridgeReady && !formEl.hidden) {
            closePopover()
          }
          startPicking()
        }

        addBtn.addEventListener('click', requestAdd)
        miniBtn.addEventListener('click', requestAdd)

        formEl.addEventListener('submit', function (event) {
          event.preventDefault()
          submitAnnotation()
        })

        document.getElementById('cancel-btn').addEventListener('click', function () {
          // Mid-selection → leave selection; popover open → close it (same as Esc).
          if (picking) {
            stopPicking()
          } else {
            closePopover()
          }
        })

        document.getElementById('pop-close-btn').addEventListener('click', closePopover)

        textInput.addEventListener('input', updateSubmitState)

        // Orca's annotation box submits on Ctrl/Cmd+Enter.
        textInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
            event.preventDefault()
            submitAnnotation()
          }
        })

        function submitAnnotation() {
          // Ctrl+Enter bypasses the disabled submit button, so guard the request itself against
          // a second press while the first is in flight.
          if (submitting) {
            return
          }
          var text = textInput.value.trim()
          if (!text) {
            showFormError('批注内容不能为空')
            return
          }
          if (text.length > 2000) {
            showFormError('批注文字过长（上限 2000 字）')
            return
          }
          submitting = true
          submitBtn.disabled = true
          var seq = popSeq
          // Author stays out of the request: annotations are anonymous, and the list shows no
          // author. The store keeps its own placeholder.
          var body = { text: text }
          if (pickedTarget) {
            body.target = pickedTarget
          }
          fetch(API, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body)
          })
            .then(function (response) {
              if (response.ok) {
                return response.json().then(function (data) {
                  myTokens[data.annotation.id] = data.deleteToken
                  saveToken(data.annotation.id, data.deleteToken)
                  if (seq !== popSeq) {
                    // The user already cancelled and may be writing a new draft; leave that alone.
                    refresh()
                    return
                  }
                  submitting = false
                  closePopover()
                  refresh().then(function () {
                    // Newest annotations sit at the bottom; keep the just-submitted one in view.
                    scrollToNewest()
                  })
                })
              }
              return response.json().then(function (data) {
                throw new Error((data.error && data.error.code) || 'error')
              })
            })
            .catch(function (error) {
              if (seq !== popSeq) {
                return // Belongs to a draft the user already cancelled; nothing to show.
              }
              submitting = false
              updateSubmitState()
              showFormError(errorText(error))
            })
        }

        function errorText(error) {
          var code = error && error.message ? String(error.message) : ''
          if (code === 'annotations_full') {
            return '批注已满（上限 500 条），无法继续添加'
          }
          if (code === 'text_too_long') {
            return '批注文字过长（上限 2000 字）'
          }
          if (code === 'rate_limited') {
            return '操作太频繁，请稍后再试'
          }
          if (code === 'not_found') {
            return '分享链接不存在或已过期'
          }
          if (code === 'bad_request') {
            return '提交内容不符合要求，请检查后重试'
          }
          return '提交失败，请稍后再试'
        }

        function showFormError(message) {
          formErrorEl.textContent = message
          formErrorEl.hidden = !message
        }

        // ---- list ---------------------------------------------------------------------------

        function refresh() {
          return fetch(API)
            .then(function (response) {
              if (!response.ok) {
                throw new Error('list_' + response.status)
              }
              return response.json()
            })
            .then(function (data) {
              annotations = data.items || []
              listLoaded = true
              listFailed = false
              showListStatus('')
              renderList()
              probeTargets()
            })
            .catch(function () {
              listLoaded = true
              listFailed = true
              renderTrayMode()
              listEl.innerHTML = ''
              var errorBox = document.createElement('div')
              errorBox.className = 'list-error'
              errorBox.textContent = '批注列表加载失败'
              var retry = document.createElement('button')
              retry.type = 'button'
              retry.textContent = '重试'
              retry.addEventListener('click', refresh)
              errorBox.appendChild(retry)
              listEl.appendChild(errorBox)
            })
        }

        // ---- tray mode & collapse ------------------------------------------------------------

        // Zero annotations collapse the whole tray into the mini pill; a failed load keeps the
        // tray up so the retry button stays reachable.
        function renderTrayMode() {
          var showTray = listLoaded && (annotations.length > 0 || listFailed)
          trayEl.hidden = !showTray
          miniBtn.hidden = !(listLoaded && !listFailed && annotations.length === 0)
        }

        function applyCollapsed(collapsed) {
          trayEl.classList.toggle('collapsed', collapsed)
          toggleBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true')
          // A submit while collapsed cannot scroll a display:none list (scrollHeight is 0);
          // replay the pending jump as soon as the list becomes visible again.
          if (!collapsed && pendingScrollToNewest) {
            pendingScrollToNewest = false
            scrollToNewest()
          }
        }

        function scrollToNewest() {
          if (trayEl.classList.contains('collapsed')) {
            pendingScrollToNewest = true
            return
          }
          listEl.scrollTop = listEl.scrollHeight
        }

        toggleBtn.addEventListener('click', function () {
          var collapsed = !trayEl.classList.contains('collapsed')
          applyCollapsed(collapsed)
          try {
            localStorage.setItem(TRAY_KEY, collapsed ? '1' : '0')
          } catch {
            // A full quota only loses the memory of the collapse state.
          }
        })

        try {
          applyCollapsed(localStorage.getItem(TRAY_KEY) === '1')
        } catch {
          applyCollapsed(false)
        }

        // Native-tray row shape: numbered badge, target title, two-line-clamped text, then a
        // selector/stale meta line — no author line: annotations are anonymous.
        function renderList() {
          listEl.innerHTML = ''
          countEl.textContent = annotations.length ? String(annotations.length) : ''
          renderTrayMode()
          if (!annotations.length) {
            return
          }
          annotations.forEach(function (annotation, index) {
            var item = document.createElement('div')
            item.className = 'annotation-item' + (myTokens[annotation.id] ? ' mine' : '')

            var badge = document.createElement('span')
            badge.className = 'badge'
            badge.textContent = String(index + 1)
            item.appendChild(badge)

            var main = document.createElement('div')
            main.className = 'main'

            var titleRow = document.createElement('div')
            titleRow.className = 'title-row'
            var title = document.createElement('span')
            title.className = 'title'
            title.textContent = annotation.target
              ? annotation.target.text || annotation.target.selector
              : '整页批注'
            titleRow.appendChild(title)
            var time = document.createElement('span')
            time.className = 'time'
            time.textContent = formatTime(annotation.createdAt)
            titleRow.appendChild(time)

            if (myTokens[annotation.id]) {
              var del = document.createElement('button')
              del.type = 'button'
              del.className = 'delete'
              del.title = '删除我的批注'
              del.setAttribute('aria-label', '删除我的批注')
              del.textContent = '×'
              del.addEventListener('click', function (event) {
                event.stopPropagation()
                deleteAnnotation(annotation.id)
              })
              titleRow.appendChild(del)
            }
            main.appendChild(titleRow)

            var text = document.createElement('p')
            text.className = 'text'
            text.textContent = annotation.text
            main.appendChild(text)

            // Without a text summary the title already shows the selector; repeat it only when
            // the stale badge needs its own line or the title carries different text.
            if (annotation.target && (staleIds.has(annotation.id) || annotation.target.text)) {
              var stale = staleIds.has(annotation.id)
              var meta = document.createElement('div')
              meta.className = 'meta'
              var tag = document.createElement('span')
              tag.className = 'vw-tag ' + (stale ? 'vw-tag-stale' : 'vw-tag-target')
              tag.textContent = stale ? '元素已变化' : annotation.target.selector
              meta.appendChild(tag)
              main.appendChild(meta)
            }
            item.appendChild(main)

            // Only annotations with a target can jump to an element; page-level ones stay inert
            // and out of the tab order instead of being focusable but dead.
            if (annotation.target) {
              var highlight = function () {
                postToFrame({
                  type: 'bw-anno-highlight',
                  id: annotation.id,
                  selector: annotation.target.selector
                })
              }
              item.tabIndex = 0
              item.setAttribute('role', 'button')
              item.setAttribute('aria-label', '在内容中定位该批注')
              item.addEventListener('click', highlight)
              item.addEventListener('keydown', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                  event.preventDefault()
                  highlight()
                }
              })
            }
            listEl.appendChild(item)
          })
        }

        function deleteAnnotation(annotationId) {
          fetch(API + '/' + annotationId, {
            method: 'DELETE',
            headers: { 'x-delete-token': myTokens[annotationId] || '' }
          })
            .then(function (response) {
              if (response.ok || response.status === 404) {
                delete myTokens[annotationId]
                removeToken(annotationId)
                refresh()
                return
              }
              if (response.status === 403) {
                showListStatus('删除失败：本机删除令牌已失效，无法删除该批注')
              } else if (response.status === 429) {
                showListStatus('操作太频繁，请稍后再试')
              } else {
                showListStatus('删除失败，请稍后再试')
              }
            })
            .catch(function () {
              showListStatus('网络异常，删除未生效，请稍后再试')
            })
        }

        function showListStatus(message) {
          listStatusEl.textContent = message
          if (listStatusTimer) {
            clearTimeout(listStatusTimer)
            listStatusTimer = null
          }
          if (message) {
            listStatusTimer = setTimeout(function () {
              listStatusEl.textContent = ''
              listStatusTimer = null
            }, 4000)
          }
        }

        // ---- polling ------------------------------------------------------------------------

        setInterval(function () {
          if (!document.hidden) {
            refresh()
          }
        }, POLL_MS)

        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) {
            refresh()
          }
        })

        // Another tab of this share added or removed a token: refresh our copy so the delete
        // buttons stay accurate without waiting for the next poll. Fires only in the other tabs.
        window.addEventListener('storage', function (event) {
          if (event.key && event.key.indexOf(TOKENS_PREFIX) === 0) {
            myTokens = readTokens()
            // Keep a load-failure error box intact; re-rendering here would replace it with a stale
            // empty list. The next refresh restores the real list with the updated delete buttons.
            if (!listEl.querySelector('.list-error')) {
              renderList()
            }
          }
        })

        // ---- helpers ------------------------------------------------------------------------

        // One localStorage key per annotation, never a whole-map snapshot: two tabs of the same
        // share each hold their own in-memory copy, so rewriting a shared map would drop tokens
        // another tab added and permanently cost that author the delete capability (the server
        // keeps only a hash). Independent keys make every write touch just its own annotation.
        function readTokens() {
          var tokens = {}
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i)
              if (key && key.indexOf(TOKENS_PREFIX) === 0) {
                var id = key.slice(TOKENS_PREFIX.length)
                var value = localStorage.getItem(key)
                if (id && value) {
                  tokens[id] = value
                }
              }
            }
          } catch {
            // Storage unavailable (private mode / disabled): delete capability degrades, the
            // annotations themselves live on the server and are unaffected.
          }
          return tokens
        }

        function saveToken(id, token) {
          try {
            localStorage.setItem(TOKENS_PREFIX + id, token)
          } catch {
            // A full quota only costs the delete capability for this annotation; the annotation
            // itself lives on the server and must not be reported as failed.
          }
        }

        function removeToken(id) {
          try {
            localStorage.removeItem(TOKENS_PREFIX + id)
          } catch {
            // Best-effort: a leftover local token only yields an honest 403/404 on a later delete.
          }
        }

        function formatTime(iso) {
          try {
            var date = new Date(iso)
            var pad = function (n) {
              return String(n).padStart(2, '0')
            }
            return (
              date.getFullYear() +
              '-' +
              pad(date.getMonth() + 1) +
              '-' +
              pad(date.getDate()) +
              ' ' +
              pad(date.getHours()) +
              ':' +
              pad(date.getMinutes())
            )
          } catch {
            return ''
          }
        }

        refresh()
      })()
    </script>
  </body>
</html>
