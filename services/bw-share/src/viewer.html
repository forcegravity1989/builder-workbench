<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__BW_FILE_NAME__ · 分享</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font:
          14px/1.5 -apple-system,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        color: #1f2937;
        background: #f3f4f6;
      }
      .viewer-head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 10px 16px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        flex: none;
      }
      .viewer-head .file-name {
        font-size: 15px;
        font-weight: 600;
      }
      .viewer-head .shared-at {
        font-size: 12px;
        color: #6b7280;
      }
      .viewer-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .viewer-content {
        flex: 1;
        min-width: 0;
        background: #fff;
      }
      .viewer-content iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      .anno-panel {
        width: 340px;
        flex: none;
        display: flex;
        flex-direction: column;
        border-left: 1px solid #e5e7eb;
        background: #fff;
      }
      .anno-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid #e5e7eb;
        flex: none;
      }
      .anno-head h2 {
        margin: 0;
        font-size: 14px;
      }
      .anno-head .count {
        font-size: 12px;
        color: #6b7280;
      }
      .anno-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 14px;
      }
      .annotation-item {
        padding: 8px 10px;
        margin-bottom: 8px;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        background: #f9fafb;
        cursor: pointer;
      }
      .annotation-item.mine {
        border-color: #93c5fd;
        background: #eff6ff;
      }
      .annotation-item .meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #6b7280;
      }
      .annotation-item .author {
        font-weight: 600;
        color: #374151;
      }
      .annotation-item .time {
        margin-left: auto;
      }
      .annotation-item .target-tag {
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 1px 6px;
        border-radius: 4px;
        background: #fef3c7;
        color: #92400e;
        font-size: 12px;
      }
      .annotation-item .stale-tag {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        background: #fee2e2;
        color: #991b1b;
        font-size: 12px;
      }
      .annotation-item .text {
        margin: 4px 0 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .annotation-item .delete {
        margin-top: 4px;
        font-size: 12px;
        color: #2563eb;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      .annotation-empty {
        padding: 24px 8px;
        text-align: center;
        color: #9ca3af;
      }
      .anno-form {
        border-top: 1px solid #e5e7eb;
        padding: 10px 14px;
        flex: none;
        display: none;
      }
      .anno-form.visible {
        display: block;
      }
      .anno-form .row {
        display: flex;
        gap: 8px;
        margin-bottom: 6px;
      }
      .anno-form input[type='text'] {
        flex: 1;
        padding: 5px 8px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-size: 13px;
      }
      .anno-form textarea {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-size: 13px;
        resize: vertical;
        min-height: 56px;
      }
      .anno-form .target-line {
        font-size: 12px;
        color: #6b7280;
        margin: 6px 0;
      }
      .anno-form .target-line .picked {
        color: #92400e;
        background: #fef3c7;
        border-radius: 4px;
        padding: 1px 6px;
      }
      .anno-form .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      .anno-form button {
        padding: 5px 12px;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .anno-form .submit {
        background: #2563eb;
        color: #fff;
      }
      .anno-form .submit:disabled {
        background: #93c5fd;
        cursor: not-allowed;
      }
      .anno-form .cancel,
      .anno-form .pick {
        background: #fff;
        color: #374151;
        border-color: #d1d5db;
      }
      .anno-form .pick.active {
        background: #fef3c7;
        border-color: #f59e0b;
        color: #92400e;
      }
      .anno-form .pick:disabled {
        color: #9ca3af;
        cursor: not-allowed;
      }
      .list-status {
        padding: 0 14px;
        font-size: 12px;
        color: #b91c1c;
      }
      .form-error {
        color: #b91c1c;
        font-size: 12px;
        margin-top: 6px;
        min-height: 16px;
      }
      .anno-toolbar {
        padding: 10px 14px;
        border-top: 1px solid #e5e7eb;
        flex: none;
      }
      .anno-toolbar button {
        width: 100%;
        padding: 7px 0;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      .anno-toolbar button:disabled {
        background: #93c5fd;
        cursor: not-allowed;
      }
      .anno-toolbar .hint {
        font-size: 12px;
        color: #9ca3af;
        text-align: center;
        margin-top: 6px;
      }
      .list-error {
        padding: 16px;
        text-align: center;
        color: #b91c1c;
        font-size: 13px;
      }
      .list-error button {
        margin-top: 8px;
        padding: 4px 12px;
        border-radius: 4px;
        border: 1px solid #d1d5db;
        background: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="viewer-head">
      <span class="file-name" id="file-name">__BW_FILE_NAME__</span>
      <span class="shared-at" id="shared-at">分享于 __BW_CREATED_AT__</span>
    </div>
    <div class="viewer-body">
      <div class="viewer-content">
        <iframe id="content-frame" title="分享内容"></iframe>
      </div>
      <aside class="anno-panel">
        <div class="anno-head">
          <h2>批注</h2>
          <span class="count" id="anno-count"></span>
        </div>
        <div class="anno-list" id="anno-list"></div>
        <div class="list-status" id="list-status"></div>
        <form class="anno-form" id="anno-form">
          <div class="row">
            <input
              type="text"
              id="author-input"
              placeholder="你的名字（留空则匿名）"
              maxlength="50"
            />
          </div>
          <textarea
            id="text-input"
            placeholder="批注内容（2000 字以内）"
            maxlength="2000"
          ></textarea>
          <div class="target-line" id="target-line">未选择元素，将作为页面级批注</div>
          <div class="actions">
            <button type="button" class="pick" id="pick-btn" disabled>选择元素</button>
            <button type="submit" class="submit" id="submit-btn">提交</button>
            <button type="button" class="cancel" id="cancel-btn">取消</button>
          </div>
          <div class="form-error" id="form-error"></div>
        </form>
        <div class="anno-toolbar">
          <button type="button" id="add-btn">添加批注</button>
          <div class="hint" id="bridge-hint"></div>
        </div>
      </aside>
    </div>
    <script>
      ;(function () {
        'use strict'

        var shareId = (location.pathname.match(/^\/s\/([A-Za-z0-9_-]{22})/) || [])[1]
        var frame = document.getElementById('content-frame')
        var listEl = document.getElementById('anno-list')
        var countEl = document.getElementById('anno-count')
        var formEl = document.getElementById('anno-form')
        var formErrorEl = document.getElementById('form-error')
        var authorInput = document.getElementById('author-input')
        var textInput = document.getElementById('text-input')
        var targetLine = document.getElementById('target-line')
        var pickBtn = document.getElementById('pick-btn')
        var submitBtn = document.getElementById('submit-btn')
        var addBtn = document.getElementById('add-btn')
        var bridgeHint = document.getElementById('bridge-hint')
        var listStatusEl = document.getElementById('list-status')

        var API = '/api/shares/' + shareId + '/annotations'
        var AUTHOR_KEY = 'bw-anno-author'
        var TOKENS_PREFIX = 'bw-anno-tokens:' + shareId + ':'
        var POLL_MS = 30_000

        var annotations = []
        var myTokens = readTokens()
        var picking = false
        var pickedTarget = null
        var bridgeReady = false
        var staleIds = new Set()
        var listStatusTimer = null

        frame.src = '/s/' + shareId + '/content'

        // ---- bridge handshake ---------------------------------------------------------------

        window.addEventListener('message', function (event) {
          var data = event.data
          if (!data || typeof data !== 'object' || event.source !== frame.contentWindow) {
            return
          }
          switch (data.type) {
            case 'bw-anno-ready':
              bridgeReady = true
              pickBtn.disabled = false
              bridgeHint.textContent = ''
              probeTargets()
              break
            case 'bw-anno-select':
              // Ignore a selection that arrives after the form was cancelled: the bridge may still
              // have a click in flight when stop-select lands, and it must not repopulate the form.
              if (!picking) {
                break
              }
              picking = false
              pickBtn.classList.remove('active')
              pickedTarget = { selector: data.selector, text: data.text, rect: data.rect }
              renderTargetLine()
              break
            case 'bw-anno-cancel':
              stopPicking()
              break
            case 'bw-anno-highlight-result':
              if (!data.found) {
                // Match by annotation id (the bridge echoes it) so two annotations sharing one
                // selector mark the clicked one, not the first match; fall back to selector only
                // if an older bridge omitted the id.
                var annotation = data.id
                  ? annotations.find(function (item) {
                      return item.id === data.id
                    })
                  : annotations.find(function (item) {
                      return item.target && item.target.selector === data.selector
                    })
                if (annotation) {
                  staleIds.add(annotation.id)
                  renderList()
                }
              }
              break
            case 'bw-anno-probe-result': {
              var changed = false
              var results = Array.isArray(data.results) ? data.results : []
              results.forEach(function (entry) {
                if (!entry || !entry.id) {
                  return
                }
                if (entry.found) {
                  if (staleIds.delete(entry.id)) {
                    changed = true
                  }
                } else if (!staleIds.has(entry.id)) {
                  staleIds.add(entry.id)
                  changed = true
                }
              })
              if (changed) {
                renderList()
              }
              break
            }
            default:
              break
          }
        })

        setTimeout(function () {
          if (!bridgeReady) {
            // The shared document's own CSP (e.g. script-src 'none') can block the bridge. Page-level
            // annotations keep working; element picking is honestly reported as unavailable.
            bridgeHint.textContent = '该内容不支持元素级批注，可添加页面级批注'
          }
        }, 2500)

        function postToFrame(message) {
          if (!bridgeReady) {
            return
          }
          frame.contentWindow.postMessage(message, '*')
        }

        // Ask the bridge which targets still exist, so a stale annotation is marked on load and
        // on every refresh — not only after someone clicks it.
        function probeTargets() {
          if (!bridgeReady) {
            return
          }
          var selectors = []
          annotations.forEach(function (item) {
            if (item.target && item.target.selector) {
              selectors.push({ id: item.id, selector: item.target.selector })
            }
          })
          if (selectors.length) {
            postToFrame({ type: 'bw-anno-probe', selectors: selectors })
          }
        }

        // ---- element picking ----------------------------------------------------------------

        function startPicking() {
          if (!bridgeReady) {
            showFormError('内容尚未加载完成，暂不能选择元素；可直接提交页面级批注')
            return
          }
          picking = true
          pickedTarget = null
          renderTargetLine()
          pickBtn.classList.add('active')
          pickBtn.textContent = '点击内容中的元素…'
          postToFrame({ type: 'bw-anno-start-select' })
        }

        function stopPicking() {
          picking = false
          pickBtn.classList.remove('active')
          pickBtn.textContent = '选择元素'
          postToFrame({ type: 'bw-anno-stop-select' })
        }

        // Esc must cancel picking when focus sits in this document (e.g. right after clicking the
        // pick button); the bridge only sees keys while the iframe itself holds focus.
        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && picking) {
            stopPicking()
          }
        })

        function renderTargetLine() {
          if (pickedTarget) {
            targetLine.innerHTML = ''
            var picked = document.createElement('span')
            picked.className = 'picked'
            picked.textContent = '已选：' + (pickedTarget.text || pickedTarget.selector)
            targetLine.appendChild(picked)
          } else {
            targetLine.textContent = picking
              ? '请点击右侧内容中的元素（Esc 取消）'
              : '未选择元素，将作为页面级批注'
          }
        }

        // ---- form ---------------------------------------------------------------------------

        addBtn.addEventListener('click', function () {
          formEl.classList.add('visible')
          addBtn.disabled = true
          authorInput.value = localStorage.getItem(AUTHOR_KEY) || ''
          textInput.focus()
        })

        formEl.addEventListener('submit', function (event) {
          event.preventDefault()
          submitAnnotation()
        })

        pickBtn.addEventListener('click', function () {
          if (picking) {
            stopPicking()
          } else {
            startPicking()
          }
        })

        document.getElementById('cancel-btn').addEventListener('click', function () {
          closeForm()
        })

        function closeForm() {
          formEl.classList.remove('visible')
          addBtn.disabled = false
          submitBtn.disabled = false
          textInput.value = ''
          pickedTarget = null
          // Tell the bridge to leave selection mode too; otherwise its capture-phase click handler
          // keeps swallowing the first normal click in the content after the form is cancelled.
          stopPicking()
          renderTargetLine()
          showFormError('')
        }

        function submitAnnotation() {
          var author = authorInput.value.trim()
          var text = textInput.value.trim()
          if (!text) {
            showFormError('批注内容不能为空')
            return
          }
          submitBtn.disabled = true
          var body = { author: author, text: text }
          if (pickedTarget) {
            body.target = pickedTarget
          }
          fetch(API, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body)
          })
            .then(function (response) {
              if (response.ok) {
                return response.json().then(function (data) {
                  myTokens[data.annotation.id] = data.deleteToken
                  saveToken(data.annotation.id, data.deleteToken)
                  try {
                    localStorage.setItem(AUTHOR_KEY, author)
                  } catch {
                    // Same quota story as saveToken: the author name is a convenience only.
                  }
                  closeForm()
                  refresh()
                })
              }
              return response.json().then(function (data) {
                throw new Error((data.error && data.error.code) || 'error')
              })
            })
            .catch(function (error) {
              submitBtn.disabled = false
              showFormError(errorText(error))
            })
        }

        function errorText(error) {
          var code = error && error.message ? String(error.message) : ''
          if (code === 'annotations_full') {
            return '批注已满（上限 500 条），无法继续添加'
          }
          if (code === 'text_too_long') {
            return '批注文字过长（上限 2000 字）'
          }
          if (code === 'rate_limited') {
            return '操作太频繁，请稍后再试'
          }
          if (code === 'not_found') {
            return '分享链接不存在或已过期'
          }
          if (code === 'bad_request') {
            return '提交内容不符合要求，请检查后重试'
          }
          return '提交失败，请稍后再试'
        }

        function showFormError(message) {
          formErrorEl.textContent = message
        }

        // ---- list ---------------------------------------------------------------------------

        function refresh() {
          return fetch(API)
            .then(function (response) {
              if (!response.ok) {
                throw new Error('list_' + response.status)
              }
              return response.json()
            })
            .then(function (data) {
              annotations = data.items || []
              showListStatus('')
              renderList()
              probeTargets()
            })
            .catch(function () {
              listEl.innerHTML = ''
              var errorBox = document.createElement('div')
              errorBox.className = 'list-error'
              errorBox.textContent = '批注列表加载失败'
              var retry = document.createElement('button')
              retry.type = 'button'
              retry.textContent = '重试'
              retry.addEventListener('click', refresh)
              errorBox.appendChild(retry)
              listEl.appendChild(errorBox)
            })
        }

        function renderList() {
          listEl.innerHTML = ''
          countEl.textContent = annotations.length ? annotations.length + ' 条' : ''
          if (!annotations.length) {
            var empty = document.createElement('div')
            empty.className = 'annotation-empty'
            empty.textContent = '还没有批注，点击下方按钮添加'
            listEl.appendChild(empty)
            return
          }
          annotations.forEach(function (annotation) {
            var item = document.createElement('div')
            item.className = 'annotation-item' + (myTokens[annotation.id] ? ' mine' : '')

            var meta = document.createElement('div')
            meta.className = 'meta'
            var author = document.createElement('span')
            author.className = 'author'
            author.textContent = annotation.author
            var time = document.createElement('span')
            time.className = 'time'
            time.textContent = formatTime(annotation.createdAt)
            meta.appendChild(author)
            meta.appendChild(time)
            item.appendChild(meta)

            if (annotation.target) {
              var tag = document.createElement('span')
              tag.className = staleIds.has(annotation.id) ? 'stale-tag' : 'target-tag'
              tag.textContent = staleIds.has(annotation.id)
                ? '元素已变化'
                : annotation.target.text || annotation.target.selector
              item.appendChild(tag)
            }

            var text = document.createElement('p')
            text.className = 'text'
            text.textContent = annotation.text
            item.appendChild(text)

            if (myTokens[annotation.id]) {
              var del = document.createElement('button')
              del.type = 'button'
              del.className = 'delete'
              del.textContent = '删除'
              del.addEventListener('click', function (event) {
                event.stopPropagation()
                deleteAnnotation(annotation.id)
              })
              item.appendChild(del)
            }

            item.addEventListener('click', function () {
              if (annotation.target) {
                postToFrame({ type: 'bw-anno-highlight', id: annotation.id, selector: annotation.target.selector })
              }
            })
            listEl.appendChild(item)
          })
        }

        function deleteAnnotation(annotationId) {
          fetch(API + '/' + annotationId, {
            method: 'DELETE',
            headers: { 'x-delete-token': myTokens[annotationId] || '' }
          })
            .then(function (response) {
              if (response.ok || response.status === 404) {
                delete myTokens[annotationId]
                removeToken(annotationId)
                refresh()
                return
              }
              if (response.status === 403) {
                showListStatus('删除失败：本机删除令牌已失效，无法删除该批注')
              } else if (response.status === 429) {
                showListStatus('操作太频繁，请稍后再试')
              } else {
                showListStatus('删除失败，请稍后再试')
              }
            })
            .catch(function () {
              showListStatus('网络异常，删除未生效，请稍后再试')
            })
        }

        function showListStatus(message) {
          listStatusEl.textContent = message
          if (listStatusTimer) {
            clearTimeout(listStatusTimer)
            listStatusTimer = null
          }
          if (message) {
            listStatusTimer = setTimeout(function () {
              listStatusEl.textContent = ''
              listStatusTimer = null
            }, 4000)
          }
        }

        // ---- polling ------------------------------------------------------------------------

        setInterval(function () {
          if (!document.hidden) {
            refresh()
          }
        }, POLL_MS)

        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) {
            refresh()
          }
        })

        // Another tab of this share added or removed a token: refresh our copy so the delete
        // buttons stay accurate without waiting for the next poll. Fires only in the other tabs.
        window.addEventListener('storage', function (event) {
          if (event.key && event.key.indexOf(TOKENS_PREFIX) === 0) {
            myTokens = readTokens()
            // Keep a load-failure error box intact; re-rendering here would replace it with a stale
            // empty list. The next refresh restores the real list with the updated delete buttons.
            if (!listEl.querySelector('.list-error')) {
              renderList()
            }
          }
        })

        // ---- helpers ------------------------------------------------------------------------

        // One localStorage key per annotation, never a whole-map snapshot: two tabs of the same
        // share each hold their own in-memory copy, so rewriting a shared map would drop tokens
        // another tab added and permanently cost that author the delete capability (the server
        // keeps only a hash). Independent keys make every write touch just its own annotation.
        function readTokens() {
          var tokens = {}
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i)
              if (key && key.indexOf(TOKENS_PREFIX) === 0) {
                var id = key.slice(TOKENS_PREFIX.length)
                var value = localStorage.getItem(key)
                if (id && value) {
                  tokens[id] = value
                }
              }
            }
          } catch {
            // Storage unavailable (private mode / disabled): delete capability degrades, the
            // annotations themselves live on the server and are unaffected.
          }
          return tokens
        }

        function saveToken(id, token) {
          try {
            localStorage.setItem(TOKENS_PREFIX + id, token)
          } catch {
            // A full quota only costs the delete capability for this annotation; the annotation
            // itself lives on the server and must not be reported as failed.
          }
        }

        function removeToken(id) {
          try {
            localStorage.removeItem(TOKENS_PREFIX + id)
          } catch {
            // Best-effort: a leftover local token only yields an honest 403/404 on a later delete.
          }
        }

        function formatTime(iso) {
          try {
            var date = new Date(iso)
            var pad = function (n) {
              return String(n).padStart(2, '0')
            }
            return (
              date.getFullYear() +
              '-' +
              pad(date.getMonth() + 1) +
              '-' +
              pad(date.getDate()) +
              ' ' +
              pad(date.getHours()) +
              ':' +
              pad(date.getMinutes())
            )
          } catch {
            return ''
          }
        }

        refresh()
      })()
    </script>
  </body>
</html>
