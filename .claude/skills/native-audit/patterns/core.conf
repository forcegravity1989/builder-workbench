# native-audit 通用模式表 —— 跨组织、跨语言、跨托管平台的命名惯例。
#
# 这里只放**别的组织也会这么叫**的词。任何一条只有某一个仓才用的说法(某公司的
# 词表词、某项目的目录名)都属于方言,进 dialect.*.conf,默认不加载。
# 判定标准:能在两个以上无关组织的公开仓里见到,才有资格进这份表。
#
# 值一律是 ERE(grep -E),不带 grep 选项;引号用单引号,避免 shell 展开。

# ── 规矩正本(给 AI 读的手册) ─────────────────────────────────────
# 各家 harness 的入口件名:Claude Code / Codex 用 AGENTS.md·CLAUDE.md,Cursor 用
# .cursorrules,GitHub Copilot 用 copilot-instructions,通用工程惯例还有 CONVENTIONS.md。
P_HANDBOOK_FILE='(^|/)(AGENTS|CLAUDE|CONVENTIONS|GEMINI)\.md$|(^|/)\.cursorrules$|(^|/)\.?copilot-instructions(\.md)?$|(^|/)\.windsurfrules$|(^|/)\.clinerules'
P_HANDBOOK_SUBTREE='/(AGENTS|CLAUDE|CONVENTIONS)\.md$|/\.cursorrules$'
# 「怎么改这份手册」自描述段
P_SELF_EDIT='^#{1,3} *(editing|maintaining|updating) (these|this)|^#{1,3} *(修订|怎么改|如何维护)'
# 地图/词表类导航件
P_MAP_FILE='(^|/)(ARCHITECTURE|DESIGN|GLOSSARY|CONTEXT|TERMINOLOGY|OVERVIEW)\.md$|(^|/)docs/(architecture|design|glossary|overview)\.md$'
P_READ_BEFORE='read .{0,30}before (chang|edit|modif)|先读|阅读.{0,10}再(改|动)|before you (change|edit)'
# 技能/剧本包
P_SKILL_FILE='(^|/)(SKILL|skill)\.md$|(^|/)\.claude/(skills|commands)/|(^|/)\.agents/skills/|(^|/)\.github/prompts/'

# ── 计划·意图 ────────────────────────────────────────────────
P_ISSUE_TEMPLATE_DIR='.github/ISSUE_TEMPLATE .gitlab/issue_templates .github/issue_template'
P_PR_TEMPLATE='.github/pull_request_template.md .github/PULL_REQUEST_TEMPLATE.md .github/PULL_REQUEST_TEMPLATE .gitlab/merge_request_templates'
# 意图件:提案/RFC/需求件的通用命名
P_INTENT_FILE='(^|/)(proposed|proposals?|rfcs?)/.*\.md$|(^|/)(intent|proposal|motivation)\.md$'

# ── 设计·决策 ────────────────────────────────────────────────
# 决策记录目录:ADR 是跨行业标准,rfc/decisions/design-docs 同样通用;
# notes/{implemented,proposed} 是 agent-notes 惯例;changes|features 是产物链惯例。
# 目录常带排序用的数字前缀(02-adr、05-features),模式要认。
P_DECISION_PATH='(^|/)([0-9]+[-_])?(adrs?|rfcs?|decisions?|design[-_]docs?)/|(^|/)([0-9]+[-_])?notes/(implemented|proposed|rejected|archived)/|(^|/)([0-9]+[-_])?(changes|features)/[^/]*/(intent|spec|proposal)\.md$'
# 决策记录里的「替代方案」节(缺它 = 只记结论不记打败了谁)
P_ALTERNATIVES_SECTION='^#{1,4} *(alternatives|options considered|trade-?offs|considered alternatives|替代方案|其他方案|备选方案|方案对比)'
P_CONSEQUENCE_SECTION='^#{1,4} *(consequences?|implications?|后果|影响|代价)'
# 「非琐碎变更必须附决策记录」这类强制条款
P_DECISION_MANDATE='must (include|add|write) (an? )?(adr|decision|agent note|rfc)|每个?非琐碎.{0,10}(变更|改动).{0,10}(记录|决策)|requires? an? (adr|decision record)'
# 生命周期目录(状态即路径)
P_LIFECYCLE_DIR='(proposed|accepted|implemented|rejected|superseded|archived|deprecated)'
P_STATUS_FILE='(^|/)(STATUS|status)\.md$'
# 冻结/归档清单
P_FROZEN_MANIFEST='(archived|frozen)/(manifest|index)\.(json|ya?ml|txt)$|CODEOWNERS'

# ── 构建 ────────────────────────────────────────────────────
P_PLAN_FILE='(^|/)(plan|implementation-plan|acceptance)(\.md)?$|(^|/)plan\.md$'
P_PLAN_FIRST='plan (before|first)|先(写|做|出)(计划|方案)|acceptance criteria|implementation plan|approve the plan'
# 本地钩子:各家钩子管理器
P_HOOK_CONFIG='lefthook.yml lefthook.yaml .husky .pre-commit-config.yaml .githooks .git-hooks hooks'
# 门禁脚本命名惯例(verify/guard/check/lint/validate)
P_GATE_SCRIPT='^(verify|guard|check|validate|lint|assert)[-_]'
P_GATE_SELFTEST='^(verify|guard|check|validate)[-_].*\.(spec|test)\.'
# 脚本可能放在哪(不假设一定叫 scripts/)
P_SCRIPT_DIR='scripts script tools bin hack ci .ci build-scripts'
# 生成物新鲜度
P_GEN_SCRIPT='^(gen|generate|codegen|build)[-_]'
P_VENDOR_MANIFEST='(^|/)vendor/(README|MANIFEST|manifest)|(^|/)third[-_]party/(README|MANIFEST)|go.sum|Cargo.lock|package-lock.json|pnpm-lock.yaml|poetry.lock|uv.lock'
P_DEPENDENCY_POLICY='hand[- ]roll|not invented here|dependency policy|prefer (maintained|existing) (dep|librar|package)|vendoring policy|依赖(政策|策略|取舍)|不(自己)?造轮子'
# AI/并行工作单元的分支与合并痕迹
P_AI_BRANCH='codex/|claude|copilot|cursor/|aider|devin|worktree|gpt-|llm/'
P_AI_TRAILER='claude|codex|cursor|copilot|gpt|gemini|deepseek|aider|devin|\[bot\]'

# ── 测试·验证 ────────────────────────────────────────────────
P_TESTING_DOC='(^|/)(TESTING|testing|test-strategy|test-policy)\.md$|(^|/)docs/testing'
P_EVIDENCE_RULE='report only .{0,20}(command|check)s? (you )?ran|evidence (in|on) the (pr|mr)|verification output|paste the output|证据.{0,6}(进|入|附)|附上.{0,6}(输出|证据)'
P_CHANGE_SCOPE_TOOL='change[-_]scope|changed[-_]files|diff[-_]scope|affected'
P_REGRESSION_FIRST='watch (it )?(go )?red|introduce the regression|failing test first|red[- ]green|reproduce .{0,20}as a (failing )?test|先写.{0,6}失败(的)?测试'
P_TEST_PROTECTION='(never|do not|don.t) (modify|edit|change|touch) (the )?tests?|tests? (are|is) (read[- ]only|off[- ]limits)|禁止(修改|改动).{0,6}测试'
P_REAL_ENTRY='verify the world|self[- ]report|real entry|built artifact|end[- ]to[- ]end .{0,20}(real|actual)|smoke test|真实入口|端到端'
P_FLAKE_POLICY='flak(e|y|iness)|nondeterministic|non[- ]deterministic|intermittent (failure|test)|retry .{0,10}test|不稳定(的)?测试|抖动'

# ── 评审·合入·发布 ────────────────────────────────────────────
P_REVIEW_SKILL='(review|reviewing)[^/]*/(SKILL|skill)\.md$|(^|/)\.claude/(skills|commands)/[^/]*review'
P_REVIEW_CI='review|codereview|code-review'
# 「写码的不批自己的码」/ agent 不许合并
P_SELF_MERGE_BAN='(cannot|can.t|may not|must not|never) (approve|merge) (their|its|your) own|no self[- ](approval|merge)|agent.{0,20}(cannot|never) merge|disallow.{0,20}merge|不(允许|得).{0,10}(自己|agent).{0,10}(合并|merge)'
P_LABEL_TAXONOMY='kind/|area/|type/|scope/|priority/|status/|label taxonomy|标签(体系|词表|规范)'
P_FORCE_POLICY='force[- ]with[- ]lease|never .{0,10}force push|no force[- ]push|不(许|得).{0,6}force'
P_RELEASE_FILE='CHANGELOG.md SAFETY.md SECURITY.md THIRD_PARTY_NOTICES.md NOTICE LICENSE RELEASING.md RELEASE.md'
P_RELEASE_CI='release|publish|deploy|tag'
# 回滚:只认发布/运维语境,避开「运行时状态回滚」这个同名概念
P_ROLLBACK='rollback (plan|procedure|drill|runbook|path|strategy)|(release|deploy|deployment|发版|部署).{0,25}(rollback|roll back|回滚)|回滚(演练|剧本|步骤|路径|方案)|revert (the )?(release|deploy)'

# ── 运维·复盘 ────────────────────────────────────────────────
# 复盘件的路径。短缩写必须带边界:裸 `rca` 会命中 o|rca|.rs、Hove|rCa|rd.tsx;
# 裸 `retro` 会命中 retrofit。命中后仍按文档类型过滤(复盘是文档,不是源码)。
P_POSTMORTEM_PATH='post[-_]?mortem|incident[-_]?(report|review)|(^|[-_/])retrospectives?([-_/.]|$)|(^|[-_/])rca([-_/.]|$)|root[-_]cause|复盘|事故(记录|报告)'
P_DOC_EXT='\.(md|markdown|adoc|rst|txt|org)$'
P_POSTMORTEM_RULE='post[-_]?mortem|incident (review|report)|blameless|root cause analysis|复盘|事故记录'
# 自动化流转脚本(检测/流转不靠模型)
P_AUTOMATION_SCRIPT='issue[-_]management|triage|automation|policy\.(mjs|js|ts|py)|stale|labeler'

# ── 知识维护·反 slop ──────────────────────────────────────────
P_DOC_STRUCTURE='one home per fact|single source of truth|current state, not|document(s)? (the )?current|do not (narrate|restate)|唯一(正本|来源)|一事一(家|处)|只写现状'
P_SLOP_CHECKLIST='slop|redundan|duplicat(e|ed) (rule|content)|reasoning transcript|filler|boilerplate prose|冗余|复述|注水'
P_DOC_GATE_SCRIPT='(md|markdown|doc|docs|link|budget|mermaid|prose|spell|vale|lint-md)'
P_SIMPLIFY_SKILL='(simplif|cleanup|prune|archive|deprecat|减法|归档|精简)'
P_FROZEN_RULE='frozen|immutable|do not edit|append[- ]only|historical (banner|notice)|deprecated notice|冻结|不再(修改|编辑)|历史横幅'

# ── AI 协作 ─────────────────────────────────────────────────
P_MULTIHARNESS_GATE='(skill|prompt|harness|agent)[-_].*(sync|verify|check|lint)|(verify|check)[-_].*(skill|prompt|agent)'
P_SECRET_POLICY='never commit (credential|secret|key|token)|do not commit .{0,15}(secret|credential|\.env)|secrets? (policy|management)|不(要|得|准).{0,10}提交.{0,10}(密钥|凭据|token|secret)'
P_SECRET_IGNORE='^\.env|\*\.env|\.env\.|secrets?|credentials?|\*\.pem|\*\.key'
P_AGENT_REGRESSION='snapshot test|golden (file|test)|eval (suite|set|harness)|regression (suite|corpus)|replay|回放|评测集|快照(测试|回放)'

# ── 扫描范围排除(与业务无关的目录) ───────────────────────────
P_EXCLUDE_DIR='node_modules target dist build out .git vendor third_party .venv venv __pycache__ .next .nuxt coverage snapshots fixtures testdata .cache'
# 别人的代码不算本仓的实践:vendored / 第三方 / 子模块里的手册、技能、决策记录
# 都不该计入这个仓的水位。路径匹配(不只是 grep 排除),因为 git ls-files 不吃 --exclude-dir。
P_VENDORED_PATH='(^|/)(vendor|vendored|third[-_]party|3rdparty|external|deps|node_modules|submodules?)/'
