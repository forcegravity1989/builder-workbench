# 方言表:Builders' Workbench —— 本仓私有词汇,**默认不加载**。
#
# 这些词只有本仓(及被它管的项目)才这么说。放进通用表会有两个后果:扫别人的仓
# 一条都命不中(读数系统性偏低),扫自己的仓又因为「词表里正好有这个词」而虚高。
# 所以它们只在显式 `--dialect` 时叠加到通用模式上,且报告必须写明用了方言。
#
# 用法: battery.sh <repo> --dialect <此文件>
# 写自己组织的方言:照抄本文件改词即可,变量名必须是 D_<通用变量名去掉 P_ 前缀>。
# 引擎把 D_X 以 `|` 追加到 P_X 后面,不覆盖。

# 「读回」= 从远端/git/仓文件独立重新查出来核对,是本仓证据纪律的核心动作
D_EVIDENCE_RULE='读回|报告不代答'
D_REAL_ENTRY='读回|深链|BW_OPEN'

# 门禁自测的本仓说法
D_REGRESSION_FIRST='坏例|门禁自测'

# 依赖政策:本仓 AGENTS.md 原话
D_DEPENDENCY_POLICY='成熟 CLI|自建须举证|不为.{0,8}兼容|薄适配'

# 文档纪律:本仓写作规范用词
D_DOC_STRUCTURE='30 秒导读|唯一正本|历史横幅'
D_SLOP_CHECKLIST='黑话|写作纪律|人话'
D_FROZEN_RULE='过时不删|历史横幅'

# 活/标签体系
D_LABEL_TAXONOMY='bw:status:|bw:plan:|bw:category:|bw:released:'

# 规范铺底的落点。**不写产物链路径** —— 通用表的
# `(changes|features)/<id>/(intent|spec|proposal).md` 已经覆盖本仓的链,
# 方言再补一条宽的会把 plan/STATUS/报告都算成决策记录(实测 14 虚高到 28)。
# 方言只补通用表**漏掉**的,不重复它已覆盖的。
D_AUTOMATION_SCRIPT='\.bw/scripts'
D_SECRET_POLICY='不入仓|不进仓'

# 交互式验证(本仓 E2E 形态:深链启动 + computer-use + 读回)
D_FLAKE_POLICY='抖动'
D_AGENT_REGRESSION='现算|读数流水'
