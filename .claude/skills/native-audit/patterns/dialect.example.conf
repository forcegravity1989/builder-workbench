# 方言表模板 —— 复制这份、改成你自己组织的说法,用 `--dialect <文件>` 加载。
#
# 什么该进方言:**只有你们组织这么叫**的词。通用表已经认得 ADR、post-mortem、
# rollback plan 这些跨组织说法;如果你们把「决策记录」叫成别的名字、把「证据要
# 进 PR」这条纪律写成一句只有你们看得懂的话,那就写在这里,否则扫自己的仓会因为
# 用词不同被判 0。
#
# 什么不该进方言:
#   - 通用表已经覆盖的东西。重复一遍只会让读数虚高(实测:一条与通用表重叠的
#     路径模式,把某仓的决策记录数从 14 抬到 28,多出来的全是同目录下的非决策件)。
#   - 你希望自己得分高的词。方言不是加分项,它只让「已经成文的纪律」被认出来。
#
# 规则:变量名 = 通用表变量名把 `P_` 换成 `D_`;引擎把它以 `|` 追加到通用模式后面,
# 不覆盖 —— 通用信号永远还在。值是 ERE。

# 例:某组织把「独立复查一遍数据」这条证据纪律叫「回读核对」
# D_EVIDENCE_RULE='回读核对|复核原始数据'

# 例:某组织的状态标签前缀是 acme:
# D_LABEL_TAXONOMY='acme:status:|acme:area:'

# 例:某组织把复盘叫「事件总结会」
# D_POSTMORTEM_RULE='事件总结会'

# 例:某组织的自动化脚本放在非常规目录
# D_AUTOMATION_SCRIPT='ops/robots'
