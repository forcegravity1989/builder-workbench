# 生态与托管平台模式表 —— 按仓里实际存在的标志文件自动选用,不假设语言。
#
# 引擎探测到哪个生态就把对应模式 OR 进去;monorepo 多生态并存时全部叠加。
# 加一门语言 = 在这里加一组 ECO_<名>_* 变量并把名字写进 ECO_ALL,引擎不用改。

ECO_ALL='rust node python go java ruby dotnet cpp'

ECO_rust_MARKER='Cargo.toml'
ECO_rust_STRICT='forbid\(unsafe_code\)|-D warnings|#!\[deny|rust-version'
ECO_rust_LINT='clippy.toml .clippy.toml rustfmt.toml .rustfmt.toml deny.toml'
ECO_rust_TEST='cargo (test|nextest)'
ECO_rust_TESTMARK='#\[(test|tokio::test|rstest)\]'
ECO_rust_SRC='\.rs$'

ECO_node_MARKER='package.json'
ECO_node_STRICT='"strict" *: *true|"noImplicitAny" *: *true|"noUncheckedIndexedAccess"'
ECO_node_LINT='.eslintrc .eslintrc.js .eslintrc.json eslint.config.js eslint.config.mjs .oxlintrc.json biome.json .jscpd.json tsconfig.json'
ECO_node_TEST='(pnpm|npm|yarn|bun)( run)? test|vitest|jest|mocha|playwright|node --test'
ECO_node_TESTMARK='\b(it|test|describe)\('
ECO_node_SRC='\.(ts|tsx|js|jsx|mjs|cjs)$'

ECO_python_MARKER='pyproject.toml setup.py requirements.txt Pipfile'
ECO_python_STRICT='strict *= *true|mypy|pyright|disallow_untyped'
ECO_python_LINT='ruff.toml .ruff.toml setup.cfg .flake8 mypy.ini .pylintrc tox.ini'
ECO_python_TEST='pytest|python -m unittest|nox|tox'
ECO_python_TESTMARK='^\s*def test_|@pytest\.'
ECO_python_SRC='\.py$'

ECO_go_MARKER='go.mod'
ECO_go_STRICT='golangci|go vet|-race'
ECO_go_LINT='.golangci.yml .golangci.yaml revive.toml'
ECO_go_TEST='go test'
ECO_go_TESTMARK='^func Test[A-Z]'
ECO_go_SRC='\.go$'

ECO_java_MARKER='pom.xml build.gradle build.gradle.kts'
ECO_java_STRICT='-Werror|checkstyle|errorprone|spotbugs'
ECO_java_LINT='checkstyle.xml spotbugs.xml .editorconfig pmd.xml'
ECO_java_TEST='mvn test|gradle test|junit'
ECO_java_TESTMARK='@Test\b'
ECO_java_SRC='\.(java|kt)$'

ECO_ruby_MARKER='Gemfile'
ECO_ruby_STRICT='frozen_string_literal|rubocop'
ECO_ruby_LINT='.rubocop.yml .standard.yml'
ECO_ruby_TEST='rspec|rake test|minitest'
ECO_ruby_TESTMARK='^\s*(it|describe|test) '
ECO_ruby_SRC='\.rb$'

ECO_dotnet_MARKER='*.csproj *.sln Directory.Build.props'
ECO_dotnet_STRICT='TreatWarningsAsErrors|Nullable>enable|AnalysisLevel'
ECO_dotnet_LINT='.editorconfig stylecop.json'
ECO_dotnet_TEST='dotnet test|xunit|nunit'
ECO_dotnet_TESTMARK='\[(Fact|Test|Theory)\]'
ECO_dotnet_SRC='\.cs$'

ECO_cpp_MARKER='CMakeLists.txt Makefile meson.build'
ECO_cpp_STRICT='-Werror|-Wall|clang-tidy|/WX'
ECO_cpp_LINT='.clang-tidy .clang-format cpplint.cfg'
ECO_cpp_TEST='ctest|gtest|catch2'
ECO_cpp_TESTMARK='TEST(_F)?\(|CATCH_TEST_CASE'
ECO_cpp_SRC='\.(c|cc|cpp|h|hpp)$'

# ── CI / 托管平台 ────────────────────────────────────────────
# 只认 GitHub Actions 会让 GitLab、CodeHub(GitLab v4 兼容)、Jenkins 的仓系统性判 0。
CI_GLOB='.github/workflows/*.yml .github/workflows/*.yaml .gitlab-ci.yml .gitlab/ci/*.yml .circleci/config.yml Jenkinsfile .woodpecker.yml .woodpecker/*.yml azure-pipelines.yml .drone.yml .buildkite/*.yml bitbucket-pipelines.yml .teamcity/*.kts .forgejo/workflows/*.yml .gitea/workflows/*.yml'
CI_DIR='.github/workflows .gitlab/ci .circleci .woodpecker .buildkite .forgejo/workflows .gitea/workflows'
# CI 配置里「跑了测试」「有覆盖率/快照门禁」的通用信号
CI_TEST_SIGNAL='test|spec|check'
CI_COVERAGE_SIGNAL='coverage|codecov|snapshot|golden'
# 依赖更新机器人
BOT_CONFIG='.github/dependabot.yml .github/dependabot.yaml renovate.json .renovaterc .renovaterc.json .github/renovate.json'
