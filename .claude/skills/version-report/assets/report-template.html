<!doctype html>
<html lang="zh-CN" data-theme="claude">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>版本报告</title>
<style id="se-source-style">:root {
  --color-bg: #ffffff;
  --color-surface: #f5f5f7;
  --color-card: #ffffff;
  --color-text: #1d1d1f;
  --color-accent: #0071e3;
  --color-accent-2: #5856d6;

  --color-neutral-100: #f2f3f5;
  --color-neutral-200: #e6e8ea;
  --color-neutral-300: #d1d3d5;
  --color-neutral-400: #b2b4b7;
  --color-neutral-500: #909295;
  --color-neutral-600: #6f7274;
  --color-neutral-700: #535558;
  --color-neutral-800: #393b3d;
  --color-neutral-900: #232426;

  --color-accent-100: #edf4fe;
  --color-accent-200: #dae9fe;
  --color-accent-300: #b7d5fe;
  --color-accent-400: #82b7ff;
  --color-accent-500: #3b91fe;
  --color-accent-600: #006ddc;
  --color-accent-700: #0152a8;

  --color-accent-2-100: #f1f3ff;
  --color-accent-2-700: #4544ab;

  --color-success: #34c759; --color-success-soft: #d9f8dc; --color-success-deep: #1d622c;
  --color-warning: #ff9500; --color-warning-soft: #ffead9; --color-warning-deep: #7c4602;
  --color-danger: #ff3b30; --color-danger-soft: #fee7e3; --color-danger-deep: #97261e;

  --color-divider: color-mix(in srgb, var(--color-text) 12%, transparent);

  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-heading: var(--font-body);
  --font-heading-weight: 600;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px;

  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;

  --shadow-sm: 0 1px 2px color-mix(in srgb, var(--color-neutral-900) 4%, transparent), 0 1px 1px color-mix(in srgb, var(--color-neutral-900) 3%, transparent);
  --shadow-md: 0 8px 24px color-mix(in srgb, var(--color-neutral-900) 8%, transparent), 0 2px 6px color-mix(in srgb, var(--color-neutral-900) 5%, transparent);
}

/* Claude palette — warm ivory ground, terracotta accent, slate second voice. */
[data-theme="claude"] {
  --color-bg: #faf9f5;
  --color-surface: #f0eee6;
  --color-card: #fefdfa;
  --color-text: #1f1e1d;
  --color-accent: #d97757;
  --color-accent-2: #4c73a5;

  --color-neutral-100: #f6f3ef;
  --color-neutral-200: #ebe7e1;
  --color-neutral-300: #d7d2ca;
  --color-neutral-400: #b8b3ac;
  --color-neutral-500: #96918a;
  --color-neutral-600: #75716a;
  --color-neutral-700: #58554f;
  --color-neutral-800: #3d3a36;
  --color-neutral-900: #262421;

  --color-accent-100: #fef0eb;
  --color-accent-200: #ffe0d7;
  --color-accent-300: #fec3af;
  --color-accent-400: #f19b80;
  --color-accent-500: #d47354;
  --color-accent-600: #af5233;
  --color-accent-700: #893a1f;

  --color-accent-2-100: #edf4fe;
  --color-accent-2-700: #355781;

  --color-success: #579766; --color-success-soft: #dcf7e1; --color-success-deep: #286037;
  --color-warning: #ce9042; --color-warning-soft: #feecce; --color-warning-deep: #774a03;
  --color-danger: #c15f4d; --color-danger-soft: #ffe4df; --color-danger-deep: #883324;
}

* , *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
}

.sheet { max-width: 940px; margin: 0 auto; padding: var(--space-6) var(--space-6) 96px; }

h1, h2 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); margin: 0; }
h1 { font-size: 26px; letter-spacing: -0.022em; line-height: 1.15; }
h2 { font-size: 17px; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: var(--space-3); }
h2 .no { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--color-accent-600); letter-spacing: 0.04em; }
h2 .hint { font-size: 12px; font-weight: 400; color: color-mix(in srgb, var(--color-text) 45%, transparent); }

a { color: var(--color-accent-600); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
code { font-family: var(--font-mono); font-size: 0.9em; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }

/* — masthead（紧凑：标题 + 一行元信息） — */
.mast { border-bottom: 1px solid var(--color-divider); padding-bottom: var(--space-3); }
.eyebrow { margin: 0 0 var(--space-1); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 50%, transparent); }
.mast .v { font-family: var(--font-mono); letter-spacing: -0.01em; }
.meta-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-1) var(--space-2); margin: var(--space-2) 0 0; font-size: 12px; color: color-mix(in srgb, var(--color-text) 62%, transparent); }
.meta-line .mi b { font-weight: 500; color: color-mix(in srgb, var(--color-text) 45%, transparent); margin-right: 3px; }
.meta-line .sep { color: color-mix(in srgb, var(--color-text) 30%, transparent); }

/* — 交付流程条 — */
.flow { display: flex; gap: var(--space-3); list-style: none; margin: var(--space-4) 0 0; padding: 0; }
.flow li { flex: 1 1 0; min-width: 0; position: relative; background: var(--color-card); border: 1px solid var(--color-divider); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); }
.flow li:not(:last-child)::after { content: ''; position: absolute; right: -11px; top: 50%; translate: 0 -50%; width: 7px; height: 7px; border-top: 1.5px solid var(--color-neutral-400); border-right: 1.5px solid var(--color-neutral-400); rotate: 45deg; }
.flow b { display: block; font-size: 12.5px; line-height: 1.4; }
.flow span { display: block; font-size: 11px; line-height: 1.4; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.flow li.now { background: var(--color-accent-100); border-color: var(--color-accent-300); }
.flow li.now b { color: var(--color-accent-700); }

/* — health strip — */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-3); margin: var(--space-4) 0 0; }
.card { background: var(--color-card); border: 1px solid var(--color-divider); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--space-2) var(--space-4); }
.card-head { margin: 0 0 var(--space-1); font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 50%, transparent); }
.card-value { margin: 0; font-size: 15px; font-weight: 600; }
.card-value.mono { font-size: 12px; font-weight: 500; word-break: break-all; }

/* — 总览：目标状态行 + 任务计数 — */
.ov-goals { margin: var(--space-4) 0 0; border: 1px solid var(--color-divider); border-radius: var(--radius-lg); background: var(--color-card); box-shadow: var(--shadow-sm); overflow: hidden; }
.ov-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-4); }
.ov-row + .ov-row { border-top: 1px solid color-mix(in srgb, var(--color-text) 7%, transparent); }
.ov-row .g { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--color-accent-700); }
.ov-row .ov-title { font-size: 13px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-row .ov-read { grid-column: 2 / -1; font-size: 12px; color: color-mix(in srgb, var(--color-text) 60%, transparent); }
.ov-row .tag { grid-row: 1; grid-column: 3; justify-self: end; }
.ov-tasks { margin: var(--space-3) 0 0; font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 65%, transparent); }
.ov-tasks b { font-weight: 600; color: var(--color-text); }

/* — tags — */
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; line-height: 1; letter-spacing: 0.01em; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-700); }
.tag-success { background: var(--color-success-soft); color: var(--color-success-deep); }
.tag-warning { background: var(--color-warning-soft); color: var(--color-warning-deep); }
.tag-danger { background: var(--color-danger-soft); color: var(--color-danger-deep); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-700); }
.tag-outline { border: 1px solid var(--color-divider); color: color-mix(in srgb, var(--color-text) 70%, transparent); padding: 3px 8px; }

/* — blocks — */
.block { border-top: 1px solid var(--color-divider); margin-top: var(--space-8); padding-top: var(--space-6); }
.block > h2 { margin-bottom: var(--space-4); }
.block.appendix { background: color-mix(in srgb, var(--color-surface) 55%, var(--color-bg)); border: 1px solid var(--color-divider); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-6); margin-top: var(--space-8); }

/* — goal cards — */
.goal { background: var(--color-card); border: 1px solid var(--color-divider); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--space-4) var(--space-6); margin: 0 0 var(--space-4); }
.goal-head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2); }
.goal-head .g { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--color-accent-700); }
.goal h3 { margin: 0 0 var(--space-3); font-size: 15px; font-weight: var(--font-heading-weight); line-height: 1.45; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-2); }
.kv > div { background: var(--color-surface); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); }
.kv dt { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 50%, transparent); margin: 0 0 2px; }
.kv dd { margin: 0; font-size: 13px; word-break: break-word; }
.goal .why { margin: var(--space-3) 0 0; font-size: 12px; color: color-mix(in srgb, var(--color-text) 60%, transparent); }

/* — tables — */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 50%, transparent); padding: 0 var(--space-3) var(--space-2) 0; border-bottom: 1px solid var(--color-divider); }
td { padding: var(--space-2) var(--space-3) var(--space-2) 0; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 7%, transparent); vertical-align: top; }
th:last-child, td:last-child { padding-right: 0; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tight td, .tight th { font-size: 12px; }

/* — case cards — */
.case { border: 1px solid var(--color-divider); border-radius: var(--radius-lg); background: var(--color-card); box-shadow: var(--shadow-sm); padding: var(--space-3) var(--space-4); margin: 0 0 var(--space-4); }
.case-head { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.case-head .id { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--color-accent-700); }
.case-head h3 { margin: 0; font-size: 14px; font-weight: var(--font-heading-weight); flex: 1 1 auto; }
.case .flow { margin: var(--space-2) 0 0; font-size: 12px; color: color-mix(in srgb, var(--color-text) 65%, transparent); }
.case .flow b { font-weight: 600; color: color-mix(in srgb, var(--color-text) 80%, transparent); }
.case .msg { margin: var(--space-2) 0 0; font-size: 12px; color: var(--color-danger-deep); }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-3); margin: var(--space-3) 0 0; }
.shots figure { margin: 0; }
.shots img { width: 100%; height: auto; border: 1px solid var(--color-divider); border-radius: var(--radius-sm); display: block; background: var(--color-surface); }
.shots figcaption { margin: var(--space-1) 0 0; font-family: var(--font-mono); font-size: 10px; color: color-mix(in srgb, var(--color-text) 50%, transparent); word-break: break-all; }
.files { margin: var(--space-2) 0 0; font-size: 11px; color: color-mix(in srgb, var(--color-text) 55%, transparent); word-break: break-all; }

/* — empty / unknown — */
.absent { background: var(--color-surface); border: 1px dashed var(--color-divider); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-size: 13px; }
.absent p { margin: 0; }
.absent .why { margin: var(--space-1) 0 0; font-size: 12px; color: color-mix(in srgb, var(--color-text) 60%, transparent); }

.src { margin: var(--space-3) 0 0; font-size: 11px; color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.foot { margin-top: var(--space-8); border-top: 1px solid var(--color-divider); padding-top: var(--space-4); font-size: 11px; color: color-mix(in srgb, var(--color-text) 45%, transparent); }
</style>
</head>
<body>
<main class="sheet">

  <header class="mast">
    <p class="eyebrow">版本验收报告</p>
    <h1><span class="v"><!--bw:slot:version--></span></h1>
    <p class="meta-line"><!--bw:slot:head-meta--></p>
  </header>

  <ol class="flow" aria-label="版本交付流程">
    <li><b>本版计划</b><span>目标与任务拆解</span></li>
    <li><b>开发与合入</b><span>Issue 为正本</span></li>
    <li><b>出包</b><span>pack 产物</span></li>
    <li><b>E2E 验收</b><span>verify / e2e</span></li>
    <li class="now"><b>版本报告</b><span>本页</span></li>
  </ol>

  <section aria-label="本版总览">
    <div class="strip"><!--bw:slot:health--></div>
    <!--bw:slot:overview-->
  </section>

  <section class="block">
    <h2><span class="no">01</span>本版目标与结果<span class="hint">来自本版计划 plan.goals</span></h2>
    <!--bw:slot:goals-->
  </section>

  <section class="block">
    <h2><span class="no">02</span>任务拆解与状态<span class="hint">Issue 正本，状态读回</span></h2>
    <!--bw:slot:tasks-->
  </section>

  <section class="block">
    <h2><span class="no">03</span>目标验收：E2E 用例与截图<span class="hint">复用 E2E 线产物</span></h2>
    <!--bw:slot:cases-->
  </section>

  <section class="block appendix">
    <h2><span class="no">附录</span>基础用例<span class="hint">冒烟与通用回归，非本版目标验收点</span></h2>
    <!--bw:slot:appendix-->
  </section>

  <p class="foot"><!--bw:slot:foot--></p>

</main>
</body>
</html>
